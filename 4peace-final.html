// ── 定数 ──
const PANEL='oklch(0.1 0.05 280/0.85)',BORDER='oklch(0.5 0.25 300/0.6)';

// ── ゲームロジック ──
function createDeck(){
  const d=[];
  while(d.length<10){
    const v=Math.floor(Math.random()*5)+1;
    if(d.filter(x=>x===v).length<3)d.push(v);
  }
  return d.sort(()=>Math.random()-0.5);
}

function calcPts(cards){
  const s=[...cards].sort((a,b)=>a-b);
  if(cards.length===4&&s.join('')==='1234')return{total:5,label:'ストレート +5pt',voice:'ストレート'};
  if(cards.length===2&&s[0]===5&&s[1]===5)return{total:1,label:'役なし +1pt',voice:'役なし'};
  const freq={};
  cards.forEach(v=>{freq[v]=(freq[v]||0)+1;});
  const counts=Object.values(freq);
  if(counts.some(c=>c>=3))return{total:4,label:'スリーカード +4pt',voice:'スリーカード'};
  if(counts.filter(c=>c===2).length>=2)return{total:3,label:'ツーペア +3pt',voice:'ツーペア'};
  if(counts.some(c=>c===2))return{total:2,label:'ワンペア +2pt',voice:'ワンペア'};
  return{total:1,label:'役なし +1pt',voice:'役なし'};
}

function canPlay(v,fieldSum,field){
  if(field.filter(x=>x!==null).length>=4)return false;
  const filled=field.filter(x=>x!==null).length+1;
  const newSum=fieldSum+v;
  if(filled===3&&newSum<5)return false;
  if(filled===4&&newSum<10)return false;
  return true;
}

// ── BGM (Grit Sprint.mp3) ──
let bgmRunning=false,bgmAudio=null,bgmTrack=0;
const BGM_TRACKS=['Grit Sprint.mp3','Iron Lullaby.mp3'];
function stopBGM(){
  bgmRunning=false;
  if(bgmAudio){bgmAudio.pause();bgmAudio.currentTime=0;}
}
function startBGM(){
  if(bgmRunning)return;
  bgmRunning=true;
  try{
    if(!bgmAudio||bgmAudio._track!==bgmTrack){
      if(bgmAudio){bgmAudio.pause();}
      bgmAudio=new Audio(BGM_TRACKS[bgmTrack]);
      bgmAudio._track=bgmTrack;
      bgmAudio.loop=true;
      bgmAudio.volume=0.45;
    }
    bgmAudio.play().catch(()=>{});
  }catch(e){bgmRunning=false;}
}
function switchBGMTrack(){
  const wasRunning=bgmRunning;
  stopBGM();
  bgmAudio=null;
  bgmTrack=(bgmTrack+1)%BGM_TRACKS.length;
  if(wasRunning)startBGM();
}

// ── サーバー時刻同期 ──
// ping/pongで3回計測し平均オフセットを算出してからコールバックを呼ぶ
function syncServerTime(ws, offsetRef, callback) {
  let count = 0;
  const offsets = [];
  function doPing() {
    if (!ws || ws.readyState !== WebSocket.OPEN) { callback(); return; }
    ws.send(JSON.stringify({ type: 'ping', clientTime: Date.now() }));
  }
  const origOnMessage = ws.onmessage;
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'pong') {
        const rtt = Date.now() - msg.clientTime;
        offsets.push(msg.serverTime + (rtt / 2) - Date.now());
        count++;
        if (count < 3) { setTimeout(doPing, 50); }
        else {
          offsetRef.current = offsets.reduce((a, b) => a + b, 0) / offsets.length;
          ws.onmessage = origOnMessage;
          callback();
        }
        return;
      }
    } catch(e) {}
    if (origOnMessage) origOnMessage(e);
  };
  doPing();
}

// ── Web Audio SE システム（mp3不要・コード生成）──
const AC=new(window.AudioContext||window.webkitAudioContext)();
function resumeAC(){if(AC.state==='suspended')AC.resume();}
document.addEventListener('pointerdown',()=>{resumeAC();},{once:true,capture:true});

// 基本オシレーター再生
function playOsc({freq=440,type='sine',vol=0.3,dur=0.15,attack=0.005,decay=0.1,start=0,detune=0}){
  try{
    const t=AC.currentTime+start;
    const o=AC.createOscillator();
    const g=AC.createGain();
    o.type=type;o.frequency.value=freq;o.detune.value=detune;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+attack);
    g.gain.exponentialRampToValueAtTime(0.001,t+attack+decay);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+attack+decay+0.02);
  }catch(e){}
}

// ノイズバースト（爆発・打撃用）
function playNoise({vol=0.4,dur=0.3,start=0,freq=200,q=1}){
  try{
    const t=AC.currentTime+start;
    const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1);
    const src=AC.createBufferSource();
    const flt=AC.createBiquadFilter();
    const g=AC.createGain();
    src.buffer=buf;flt.type='bandpass';flt.frequency.value=freq;flt.Q.value=q;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(flt);flt.connect(g);g.connect(AC.destination);
    src.start(t);src.stop(t+dur);
  }catch(e){}
}

// ── 各SE定義 ──

// カードを出す：シュッという鋭い音 + 軽いタップ

// GO! チャイム（上昇）
function playGoChime(){
  resumeAC();
  [[523,0,0.1],[659,0.1,0.1],[784,0.2,0.1],[1047,0.3,0.25]].forEach(([freq,s,dec])=>{

// 役SE（レベル別）
function playComboSfx(voice){
  resumeAC();
  const lv=getComboLevel(voice);
  if(lv===1){
    // 役なし：軽いチン
    playOsc({freq:880,type:'sine',vol:0.2,attack:0.005,decay:0.15,start:0});
    playOsc({freq:1320,type:'triangle',vol:0.1,attack:0.005,decay:0.1,start:0.03});
  }else if(lv===2){
    // ワンペア：2音上昇
    playOsc({freq:660,type:'sine',vol:0.28,attack:0.008,decay:0.2,start:0});
    playOsc({freq:880,type:'sine',vol:0.28,attack:0.008,decay:0.25,start:0.12});
    playOsc({freq:1320,type:'triangle',vol:0.12,attack:0.005,decay:0.15,start:0.12});
  }else if(lv===3){
    // ツーペア：3音上昇＋きらめき
    playOsc({freq:523,type:'sine',vol:0.3,attack:0.008,decay:0.18,start:0});
    playOsc({freq:659,type:'sine',vol:0.3,attack:0.008,decay:0.22,start:0.1});
    playOsc({freq:880,type:'sine',vol:0.32,attack:0.008,decay:0.3,start:0.22});
    playOsc({freq:1760,type:'triangle',vol:0.15,attack:0.005,decay:0.2,start:0.22});
    playNoise({vol:0.08,dur:0.1,start:0.22,freq:5000,q:3});
  }else if(lv===4){
    // スリーカード：4音きらびやかファンファーレ
    [[523,0],[659,0.09],[784,0.18],[1047,0.28]].forEach(([freq,s])=>{
      playOsc({freq,type:'sine',vol:0.32,attack:0.008,decay:0.3,start:s});
      playOsc({freq:freq*1.5,type:'triangle',vol:0.12,attack:0.005,decay:0.2,start:s});
    });
    playNoise({vol:0.1,dur:0.15,start:0.3,freq:6000,q:4});
    playOsc({freq:2093,type:'sine',vol:0.18,attack:0.01,decay:0.4,start:0.32});
  }else{
    // ストレート：派手なフルファンファーレ＋爆発感
    [[261,0],[329,0.07],[392,0.14],[523,0.21],[659,0.28],[784,0.36],[1047,0.45]].forEach(([freq,s])=>{
      playOsc({freq,type:'sine',vol:0.35,attack:0.008,decay:0.35,start:s});
      playOsc({freq:freq*2,type:'triangle',vol:0.15,attack:0.005,decay:0.25,start:s});
      if(s>0.2)playNoise({vol:0.06,dur:0.08,start:s,freq:4000+freq*2,q:3});
    });
    // 最後にドーン
    playOsc({freq:80,type:'sine',vol:0.4,attack:0.01,decay:0.6,start:0.5});
    playNoise({vol:0.2,dur:0.3,start:0.5,freq:200,q:0.8});
    // 上昇グリッサンド
    playOsc({freq:200,type:'sawtooth',vol:0.2,attack:0.01,decay:0.5,start:0.48,detune:1200});
  }
}
// ── サイバー演出レベル定義 ──
// 役ごとに演出の派手さを定義
// level 1=役なし, 2=ワンペア, 3=ツーペア, 4=スリーカード, 5=ストレート
function getComboLevel(voice){
  if(voice==='ストレート')return 5;
  if(voice==='スリーカード')return 4;
  if(voice==='ツーペア')return 3;
  if(voice==='ワンペア')return 2;
  return 1;
}

// ── 花火パーティクルエフェクト ──
function CyberParticles({color,level,active}){
  const canvasRef=useRef(null);
  const rafRef=useRef(null);
  useEffect(()=>{
    if(!active)return;
    const canvas=canvasRef.current;
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
    const cx=canvas.width/2, cy=canvas.height*0.45;
    const col=color||'#00d4ff';
    const palettes={
      1:[col,'#ffffff','#aaffff'],
      2:[col,'#ffffff','#ffff88','#aaffff'],
      3:[col,'#ffffff','#ffff44','#ff88ff','#44ffff'],
      4:[col,'#ff88ff','#ffff44','#ffffff','#ff4488','#44ffff','#88ff44'],
      5:[col,'#ff00ff','#ffff00','#ffffff','#00ffff','#ff4400','#44ff00','#ff0044'],
    };
    const pal=palettes[Math.min(level,5)]||palettes[1];
    const rndCol=()=>pal[Math.floor(Math.random()*pal.length)];
    const particles=[];
    function spawnBurst(bx,by,cnt,speedMult,sizeMult,gravMult,decayMult){
      for(let i=0;i<cnt;i++){
        const angle=Math.random()*Math.PI*2;
        const speed=(3+Math.random()*[0,5,8,12,16,22][level])*speedMult;
        const size=(Math.random()*[0,3,4,6,8,11][level]+2)*sizeMult;
        const isStar=Math.random()<0.25;
        const isTail=level>=2&&Math.random()<0.4;
        particles.push({
          x:bx,y:by,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
          life:1,decay:(0.005+Math.random()*0.01)*decayMult,
          size,col:rndCol(),
          isStar,isTail,
          gravity:0.10*gravMult+Math.random()*0.08,
          px:bx,py:by,
        });
      }
    }
    const cnt=[0,25,45,70,100,150][level]||25;
    spawnBurst(cx,cy,cnt,1,1,1,1);
    // 第2波（遅延バースト）
    const t2=setTimeout(()=>{
      if(level>=2){
        const n2=[0,0,15,30,50,80][level];
        const offsets=level>=4?[[cx-80,cy-40],[cx+80,cy-40],[cx,cy+60]]:[[cx-60,cy-30],[cx+60,cy-30]];
        offsets.forEach(([ox,oy])=>spawnBurst(ox,oy,Math.floor(n2/offsets.length),0.7,0.8,1.2,1.2));
      }
    },180);
    // 第3波（level4以上）
    const t3=setTimeout(()=>{
      if(level>=4){
        for(let i=0;i<4;i++){
          const ox=cx+(Math.random()-0.5)*canvas.width*0.6;
          const oy=cy+(Math.random()-0.5)*canvas.height*0.4;
          spawnBurst(ox,oy,20,0.6,0.7,1.3,1.5);
        }
      }
    },400);
    let frame=0;
    function drawStar(ctx,x,y,r,col,alpha){
      ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=col;
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const a=((i*Math.PI)/5)-Math.PI/2;
        const rad=i%2===0?r:r*0.42;
        i===0?ctx.moveTo(x+rad*Math.cos(a),y+rad*Math.sin(a)):ctx.lineTo(x+rad*Math.cos(a),y+rad*Math.sin(a));
      }
      ctx.closePath();ctx.fill();ctx.restore();
    }
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      frame++;
      // 拡散リング
      const rings=level>=5?6:level>=4?5:level>=3?4:level>=2?3:2;
      for(let r=0;r<rings;r++){
        const progress=(frame-r*6)/70;
        if(progress<=0||progress>1)continue;
        ctx.save();
        ctx.globalAlpha=(1-progress)*0.8;
        ctx.strokeStyle=pal[r%pal.length];
        ctx.lineWidth=level>=4?4:3;
        ctx.shadowBlur=12;ctx.shadowColor=pal[r%pal.length];
        ctx.beginPath();
        ctx.arc(cx,cy,progress*Math.min(canvas.width,canvas.height)*0.5*(1+r*0.22),0,Math.PI*2);
        ctx.stroke();ctx.restore();
      }
      // フラッシュ（第1フレームのみ）
      if(frame<=3){
        ctx.save();
        ctx.globalAlpha=0.18*(1-frame/4);
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,canvas.width*0.5);
        g.addColorStop(0,'#ffffff');g.addColorStop(0.3,col);g.addColorStop(1,'transparent');
        ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.restore();
      }
      particles.forEach(p=>{
        p.px=p.x; p.py=p.y;
        p.x+=p.vx; p.y+=p.vy;
        p.vx*=0.95; p.vy=p.vy*0.95+p.gravity;
        p.life-=p.decay;
        if(p.life<=0)return;
        const a=Math.max(0,p.life);
        if(p.isTail){
          ctx.save();ctx.globalAlpha=a*0.7;
          ctx.strokeStyle=p.col;ctx.lineWidth=p.size*0.6;
          ctx.shadowBlur=8;ctx.shadowColor=p.col;
          ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore();
        }
        if(p.isStar){
          drawStar(ctx,p.x,p.y,p.size*p.life*1.5,p.col,a);
        } else {
          ctx.save();ctx.globalAlpha=a;
          ctx.fillStyle=p.col;
          ctx.shadowBlur=level>=3?10:6;ctx.shadowColor=p.col;
          ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.5,p.size*p.life),0,Math.PI*2);ctx.fill();ctx.restore();
        }
      });
      const alive=particles.filter(p=>p.life>0);
      if(alive.length>0||frame<80){rafRef.current=requestAnimationFrame(draw);}
      else{ctx.clearRect(0,0,canvas.width,canvas.height);}
    }
    draw();
    return()=>{cancelAnimationFrame(rafRef.current);clearTimeout(t2);clearTimeout(t3);};
  },[active,color,level]);
  if(!active)return null;
  return h('canvas',{ref:canvasRef,style:{position:'fixed',inset:0,zIndex:300,pointerEvents:'none',width:'100%',height:'100%'}});
}

// ── Screen Effects ──
let shakeActive=false;
function triggerShake(dur=500){
  if(shakeActive)return;shakeActive=true;
  const el=document.getElementById('root');
  if(el)el.style.animation=`cameraShake ${dur}ms ease both`;
  setTimeout(()=>{if(el)el.style.animation='';shakeActive=false;},dur);
}
function triggerScreenFlash(color,dur=300){
  const ov=document.createElement('div');

  document.body.appendChild(ov);setTimeout(()=>ov.remove(),dur+50);
}

// ── BlastEffect（花火＋リング＋フラッシュ）──
function BlastEffect({voice,who,active}){
  const cvRef=useRef(null);const rafRef=useRef(null);
  const lv=getComboLevel(voice);
  const mc=who==='player'?'#00e5ff':'#ff2d9b';
  useEffect(()=>{
    if(!active)return;
    const cv=cvRef.current;if(!cv)return;
    cv.width=window.innerWidth;cv.height=window.innerHeight;
    const ctx=cv.getContext('2d');const cx=cv.width/2,cy=cv.height*.40;
    const pals={1:[mc,'#fff'],2:[mc,'#fff','#ffe080'],3:[mc,'#ff88ff','#ffff66','#fff'],4:[mc,'#ff88ff','#ffff44','#fff','#ff4488','#44ffff'],5:['#ff00ff','#ffff00','#00ffff','#ff4400','#fff','#00ff88']};
    const pal=pals[Math.min(lv,5)];const rc=()=>pal[Math.floor(Math.random()*pal.length)];
    const particles=[];
    function sp(bx,by,cnt,sm=1,sz=1,gm=1){for(let i=0;i<cnt;i++){const a=Math.random()*Math.PI*2,spd=(4+Math.random()*[0,7,10,16,22,32][lv])*sm,siz=(Math.random()*[0,3,4,6,9,13][lv]+2)*sz,sh=Math.random()<.3?'star':Math.random()<.4?'trail':'dot';particles.push({x:bx,y:by,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:.004+Math.random()*.009,size:siz,col:rc(),sh,grav:.09*gm+Math.random()*.07,px:bx,py:by});}}
    sp(cx,cy,[0,30,55,90,140,220][lv]);
    const t2=setTimeout(()=>{if(lv>=2){const offs=lv>=4?[[cx-90,cy-50],[cx+90,cy-50],[cx,cy+60]]:[[cx-60,cy-30],[cx+60,cy-30]];offs.forEach(([ox,oy])=>sp(ox,oy,18,.8,.85,1.1));}},160);
    const t3=setTimeout(()=>{if(lv>=3)for(let i=0;i<(lv>=5?6:3);i++)sp(cx+(Math.random()-.5)*cv.width*.7,cy+(Math.random()-.5)*cv.height*.5,lv>=5?35:18,.65,.8,1.3);},340);
    function dStar(c,x,y,r,col,a){c.save();c.globalAlpha=a;c.fillStyle=col;c.shadowBlur=10;c.shadowColor=col;c.beginPath();for(let i=0;i<10;i++){const ag=(i*Math.PI/5)-Math.PI/2,rd=i%2===0?r:r*.42;i===0?c.moveTo(x+rd*Math.cos(ag),y+rd*Math.sin(ag)):c.lineTo(x+rd*Math.cos(ag),y+rd*Math.sin(ag));}c.closePath();c.fill();c.restore();}
    let fr=0;
    function draw(){
      ctx.clearRect(0,0,cv.width,cv.height);fr++;
      const rings=[0,2,3,5,7,10][lv];
      for(let r=0;r<rings;r++){const p=(fr-r*5)/80;if(p<=0||p>1)continue;ctx.save();ctx.globalAlpha=(1-p)*.85;ctx.strokeStyle=pal[r%pal.length];ctx.lineWidth=lv>=4?5:3;ctx.shadowBlur=lv>=4?20:10;ctx.shadowColor=pal[r%pal.length];ctx.beginPath();ctx.arc(cx,cy,p*Math.min(cv.width,cv.height)*.52*(1+r*.2),0,Math.PI*2);ctx.stroke();ctx.restore();}
      if(fr<=4){ctx.save();ctx.globalAlpha=.2*(1-fr/5);const g=ctx.createRadialGradient(cx,cy,0,cx,cy,cv.width*.55);g.addColorStop(0,'#fff');g.addColorStop(.25,mc);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();}
      particles.forEach(p=>{p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy=p.vy*.94+p.grav;p.life-=p.decay;if(p.life<=0)return;const a=Math.max(0,p.life);if(p.sh==='trail'){ctx.save();ctx.globalAlpha=a*.75;ctx.strokeStyle=p.col;ctx.lineWidth=p.size*.7;ctx.shadowBlur=10;ctx.shadowColor=p.col;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore();}else if(p.sh==='star'){dStar(ctx,p.x,p.y,p.size*p.life*1.5,p.col,a);}else{ctx.save();ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.shadowBlur=lv>=3?12:6;ctx.shadowColor=p.col;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.size*p.life),0,Math.PI*2);ctx.fill();ctx.restore();}});
      particles.filter(p=>p.life>0).length>0||fr<100?rafRef.current=requestAnimationFrame(draw):ctx.clearRect(0,0,cv.width,cv.height);
    }
    draw();
    return()=>{cancelAnimationFrame(rafRef.current);clearTimeout(t2);clearTimeout(t3);};
  },[active]);
  if(!active)return null;
  return h('canvas',{ref:cvRef,style:{position:'fixed',inset:0,zIndex:300,pointerEvents:'none',width:'100%',height:'100%'}});
}

// ── サイバーコンボ表示（旧）──
function CyberComboDisplay({combo}){
  const[phase,setPhase]=useState('name'); // 'name' | 'pts' | 'done'
  useEffect(()=>{
    setPhase('name');
    const t1=setTimeout(()=>setPhase('pts'),1300);
    const t2=setTimeout(()=>setPhase('done'),5100);
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[combo]);
  if(!combo||phase==='done')return null;
  const level=getComboLevel(combo.text);

  const[difficulty,setDifficulty]=useState('normal');
  const diffRef=useRef('normal');
  useEffect(()=>{diffRef.current=difficulty;},[difficulty]);

  // オンライン対戦
  const[onlinePhase,setOnlinePhase]=useState(''); // waiting|playing|end
  const[roomId,setRoomId]=useState('');
  const[onlineRole,setOnlineRole]=useState('');
  const[onMyHand,setOnMyHand]=useState([]);
  const[onOpHandCount,setOnOpHandCount]=useState(0);
  const[onOpHandSum,setOnOpHandSum]=useState(0);
  const[onField,setOnField]=useState([]);
  const[onFieldColors,setOnFieldColors]=useState([]);
  const[onFieldSum,setOnFieldSum]=useState(0);
  const[onMyPt,setOnMyPt]=useState(0);
  const[onOpPt,setOnOpPt]=useState(0);
  const[onRNum,setOnRNum]=useState(1);
  const[onTimeLeft,setOnTimeLeft]=useState(10);
  const[onCountNum,setOnCountNum]=useState(-1);
  const[onLoadingPct,setOnLoadingPct]=useState(-1);
  const[onShowReady,setOnShowReady]=useState(false);
  const[onFlashMsg,setOnFlashMsg]=useState(null);
  const[onBurstAnim,setOnBurstAnim]=useState(false);
  const[onResetFA,setOnResetFA]=useState(false);
  const[onComboShow,setOnComboShow]=useState(null);
  const[onEndData,setOnEndData]=useState(null);
  const wsR=useRef(null);
  const onRoleR=useRef('');
  const onBurstAnimR=useRef(false);
  const timeupSEFiredR=useRef(false);
  const comboSEFiredR=useRef(false);
  const onCdIntervalR=useRef(null);
  const onTimerIntervalR=useRef(null);
  const endTimeRef=useRef(0);
  const onMyHandR=useRef([]);
  const onFieldR=useRef([]);
  const onFieldSumR=useRef(0);
  const onTimeLeftR=useRef(10);
  const playingStartAtR=useRef(null);
  const timerRAFR=useRef(null);
  const serverTimeOffsetR=useRef(0); // サーバー時刻 - クライアント時刻
  const onCountNumR=useRef(-1);
  const onFieldAreaRef=useRef(null);
  const aiRef=useRef(null),timerRef=useRef(null),countRef=useRef(null);
  const pPtR=useRef(0),dPtR=useRef(0);
  const pHR=useRef([]),dHR=useRef([]);
  const fieldR=useRef([]),fieldSumR=useRef(0);
  const fieldAreaRef=useRef(null);
  const phaseR=useRef('menu'),countNumR=useRef(-1),lockR=useRef(false);
  const aiFirstFastRef=useRef(true);

  useEffect(()=>{pPtR.current=pPt;},[pPt]);
  useEffect(()=>{dPtR.current=dPt;},[dPt]);
  useEffect(()=>{pHR.current=pH;},[pH]);
  useEffect(()=>{dHR.current=dH;},[dH]);
  useEffect(()=>{fieldR.current=field;},[field]);
  useEffect(()=>{fieldSumR.current=fieldSum;},[fieldSum]);
  useEffect(()=>{phaseR.current=phase;},[phase]);


  // ── オンライン接続 ──
  function onConnect(onOpen){
    const ws=new WebSocket(WS_URL);
    wsR.current=ws;
    ws.onopen=()=>onOpen(ws);
    ws.onmessage=(e)=>onMsg(JSON.parse(e.data));
    ws.onclose=()=>{if(['online_waiting','online_playing'].includes(phaseR.current)){alert('接続が切れました');goOnlineHome();}};
  }
  function onMsg(msg){
    switch(msg.type){
      case 'created':setRoomId(msg.roomId);setPhase('online_waiting');phaseR.current='online_waiting';break;
      case 'joined':setRoomId(msg.roomId);stopBGM();setPhase('online_playing');phaseR.current='online_playing';
        // ping3回送ってオフセット計算してからreadyAck
        syncServerTime(wsR.current,serverTimeOffsetR,()=>{
          if(wsR.current&&wsR.current.readyState===WebSocket.OPEN)wsR.current.send(JSON.stringify({type:'readyAck'}));
        });
        break;
      case 'guestJoined':stopBGM();setPhase('online_playing');phaseR.current='online_playing';
        syncServerTime(wsR.current,serverTimeOffsetR,()=>{
          if(wsR.current&&wsR.current.readyState===WebSocket.OPEN)wsR.current.send(JSON.stringify({type:'readyAck'}));
        });
        break;
      case 'pong':{
        const rtt=Date.now()-msg.clientTime;
        serverTimeOffsetR.current=msg.serverTime+(rtt/2)-Date.now();
        break;
      }
      case 'tick':{
        const role=onRoleR.current;
        setOnMyHand(msg.myHand||[]);onMyHandR.current=msg.myHand||[];
        setOnOpHandCount(msg.opHandCount||0);
        setOnOpHandSum(msg.opHandSum||0);
        const newField=msg.field||[];
        setOnField(newField);onFieldR.current=newField;
        setOnFieldSum(msg.fieldSum||0);onFieldSumR.current=msg.fieldSum||0;
        // サーバーから fieldOwners が届いた場合: host=青('player'), guest=赤('dealer') で固定
        if(msg.fieldOwners){
          const colors=msg.fieldOwners.map(o=>o==='host'?'player':'dealer');
          setOnFieldColors(colors);
        } else if(newField.length===0){
          setOnFieldColors([]);
        }
        setOnMyPt(role==='host'?msg.hostPt:msg.guestPt);
        setOnOpPt(role==='host'?msg.guestPt:msg.hostPt);
        setOnRNum(msg.rNum||1);
        // playingStartAtを使ってリアルタイム計算
        if(msg.phase==='playing'&&msg.playingStartAt){
          if(playingStartAtR.current!==msg.playingStartAt){
            playingStartAtR.current=msg.playingStartAt;
            // RAFで滑らかにタイマー更新
            if(timerRAFR.current)cancelAnimationFrame(timerRAFR.current);
            function tickTimer(){
              const serverNow=Date.now()+serverTimeOffsetR.current;
              const elapsed=serverNow-playingStartAtR.current;
              const left=Math.max(0,10-Math.floor(elapsed/1000));
              setOnTimeLeft(left);onTimeLeftR.current=left;
              if(left>0)timerRAFR.current=requestAnimationFrame(tickTimer);
            }
            timerRAFR.current=requestAnimationFrame(tickTimer);
          }
        } else if(msg.phase!=='playing'){
          if(timerRAFR.current){cancelAnimationFrame(timerRAFR.current);timerRAFR.current=null;}
          playingStartAtR.current=null;
          setOnTimeLeft(msg.timeLeft||10);onTimeLeftR.current=msg.timeLeft||10;
        }
        // loading/readyフェーズ処理
        if(msg.phase==='loading'){setOnLoadingPct(msg.loadingPct||0);setOnShowReady(false);}
        else if(msg.phase==='ready'){setOnLoadingPct(100);setOnShowReady(true);if(musicEnabledR.current){resumeAC();startBGM();}}
        else{setOnLoadingPct(-1);setOnShowReady(false);}
        const cd=msg.phase==='countdown'?msg.countdown:-1;
        const prevCd=onCountNumR.current;
        if(cd!==prevCd){onCountNumR.current=cd;setOnCountNum(cd);
          if(prevCd===0&&cd===-1){try{resumeAC();const t=AC.currentTime;[[523,0,0.08],[659,0.09,0.08],[784,0.18,0.08],[1047,0.27,0.25]].forEach(([f,d,dur])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.2,t+d);g.gain.exponentialRampToValueAtTime(0.001,t+d+dur);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+dur+0.02);});}catch(e){}}
        }
        if(msg.flashMsg){const fm=msg.flashMsg;const isMy=fm.by===role;
          const who2=isMy?'YOU':'相手';
          const parts=fm.text.split('　');
          const lbl=parts.length>1?parts.slice(1).join('　'):fm.text;
          setOnFlashMsg({text:who2+'　'+lbl,who:fm.by});
          if(fm.voice&&!comboSEFiredR.current){comboSEFiredR.current=true;resumeAC();playComboSfx(fm.voice);}
        }else{setOnFlashMsg(null);comboSEFiredR.current=false;}
        if(msg.comboShow)setOnComboShow(msg.comboShow);else setOnComboShow(null);
        const prevBurst=onBurstAnimR.current;
        const newBurst=!!msg.burstAnim&&msg.phase==='resolving';
        if(newBurst&&!prevBurst){resumeAC();playBurstSE();}
        if(newBurst!==prevBurst){setOnBurstAnim(newBurst);onBurstAnimR.current=newBurst;}
        setOnResetFA(!!msg.resetAnim);
        if(msg.phase==='timeup'&&!timeupSEFiredR.current){timeupSEFiredR.current=true;playMissSE();}
        if(msg.phase!=='timeup')timeupSEFiredR.current=false;
        break;
      }
      case 'state':
        // インターバルをクリアしてからリセット
        if(onCdIntervalR.current){clearInterval(onCdIntervalR.current);onCdIntervalR.current=null;}
        if(onTimerIntervalR.current){clearInterval(onTimerIntervalR.current);onTimerIntervalR.current=null;}
        endTimeRef.current=0;
        setOnMyHand(msg.myHand||[]);onMyHandR.current=msg.myHand||[];
        setOnOpHandCount(msg.opHandCount||0);
        setOnOpHandSum(msg.opHandSum||0);
        setOnField(msg.field||[]);onFieldR.current=msg.field||[];setOnFieldColors([]);
        setOnFieldSum(msg.fieldSum||0);onFieldSumR.current=msg.fieldSum||0;
        setOnMyPt(msg.myPt||0);setOnOpPt(msg.opPt||0);
        setOnRNum(msg.rNum||1);setOnTimeLeft(msg.timeLeft||10);onTimeLeftR.current=msg.timeLeft||10;
        if(msg.countdownStartAt){
          const startAt=msg.countdownStartAt;
          const dur=msg.countdownDuration||5;
          onCountNumR.current=dur;setOnCountNum(dur);
          onCdIntervalR.current=setInterval(()=>{
            const elapsed=Math.floor((Date.now()-startAt)/700);
            const val=dur-elapsed;
            if(val<=0){
              clearInterval(onCdIntervalR.current);onCdIntervalR.current=null;
              onCountNumR.current=0;setOnCountNum(0);
              try{resumeAC();const t=AC.currentTime;[[523,0,0.08],[659,0.09,0.08],[784,0.18,0.08],[1047,0.27,0.25]].forEach(([f,d,dur2])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.2,t+d);g.gain.exponentialRampToValueAtTime(0.001,t+d+dur2);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+dur2+0.02);});}catch(e){}
            } else {
              onCountNumR.current=val;setOnCountNum(val);
            }
          },100);
        }
        break;
      case 'gameStart':
        if(onCdIntervalR.current){clearInterval(onCdIntervalR.current);onCdIntervalR.current=null;}
        if(onTimerIntervalR.current){clearInterval(onTimerIntervalR.current);onTimerIntervalR.current=null;}
        onCountNumR.current=-1;setOnCountNum(-1);
        endTimeRef.current=msg.timerEndAt;
        onTimerIntervalR.current=setInterval(()=>{
          const remaining=Math.ceil((endTimeRef.current-Date.now())/1000);
          if(remaining<=0){
            clearInterval(onTimerIntervalR.current);onTimerIntervalR.current=null;
            setOnTimeLeft(0);onTimeLeftR.current=0;
            playMissSE();
          } else {
            setOnTimeLeft(remaining);onTimeLeftR.current=remaining;
          }
        },200);
        break;
      case 'timeUp':
        if(onTimerIntervalR.current){clearInterval(onTimerIntervalR.current);onTimerIntervalR.current=null;}
        setOnTimeLeft(0);onTimeLeftR.current=0;
        setOnFlashMsg({text:'⏱ 時間切れ！引き分け（±0pt）',who:null});
        setTimeout(()=>setOnFlashMsg(null),1600);
        break;
      case 'handUpdate':const nh=[...onMyHandR.current];nh[msg.idx]=0;setOnMyHand(nh);onMyHandR.current=nh;break;
      case 'newHand':setOnMyHand(msg.hand);onMyHandR.current=msg.hand;break;
      case 'fieldUpdate':setOnField(msg.field);onFieldR.current=msg.field;setOnFieldSum(msg.fieldSum);onFieldSumR.current=msg.fieldSum;break;
      case 'opPlay':
        const newField=[...onFieldR.current,msg.value];
        setOnField(newField);onFieldR.current=newField;
        setOnFieldSum(msg.fieldSum);onFieldSumR.current=msg.fieldSum;
        // ホストの相手=guest=赤('dealer'), ゲストの相手=host=青('player')
        setOnFieldColors(prev=>[...prev,onRoleR.current==='host'?'dealer':'player']);
        resumeAC();playTapSE();setOnOpHandCount(c=>Math.max(0,c-1));
        break;
      case 'burst':
        resumeAC();playBurstSE();setOnBurstAnim(true);
        const ib=msg.msg.by===onRoleR.current;
        setOnFlashMsg({text:ib?'💥 バースト！あなた-2pt':'💥 相手バースト！相手-2pt',who:msg.msg.by});
        if(onRoleR.current==='host'){setOnMyPt(msg.hostPt);setOnOpPt(msg.guestPt);}else{setOnMyPt(msg.guestPt);setOnOpPt(msg.hostPt);}
        setTimeout(()=>{setOnBurstAnim(false);setOnFlashMsg(null);},1000);break;
      case 'score':
        if(msg.voice)playComboSfx(msg.voice);
        setOnResetFA(true);setOnComboShow(msg.combo);
        if(onRoleR.current==='host'){setOnMyPt(msg.hostPt);setOnOpPt(msg.guestPt);}else{setOnMyPt(msg.guestPt);setOnOpPt(msg.hostPt);}
        setTimeout(()=>setOnComboShow(null),5200);setTimeout(()=>setOnResetFA(false),1400);break;
      case 'comboEnd':setOnComboShow(null);break;
      case 'forceReset':setOnResetFA(true);setOnFlashMsg({text:'4枚！強制リセット',who:null});setTimeout(()=>{setOnResetFA(false);setOnFlashMsg(null);},900);break;
      case 'finish':
        const isMe=msg.winner===onRoleR.current;
        setOnEndData({winner:isMe?'me':'op',myPt:onRoleR.current==='host'?msg.hostPt:msg.guestPt,opPt:onRoleR.current==='host'?msg.guestPt:msg.hostPt});
        stopBGM();setPhase('online_end');phaseR.current='online_end';break;
      case 'opLeft':alert('相手が退出しました');goOnlineHome();break;
      case 'error':alert(msg.msg);break;
    }
  }
  function createRoom(){onRoleR.current='host';onConnect(ws=>ws.send(JSON.stringify({type:'create'})));}
  function joinRoom(code){onRoleR.current='guest';onConnect(ws=>ws.send(JSON.stringify({type:'join',roomId:code})));}
  function onlinePlayCard(idx,value){
    if(onCountNumR.current>=0||onTimeLeftR.current<=0)return;
    if(!wsR.current||wsR.current.readyState!==WebSocket.OPEN)return;
    if(!onMyHandR.current[idx])return;
    if(!canPlay(value,onFieldSumR.current,onFieldR.current))return;
    resumeAC();playTapSE();
    const nh=[...onMyHandR.current];nh[idx]=0;setOnMyHand(nh);onMyHandR.current=nh;
    const nf=[...onFieldR.current,value];const ns=onFieldSumR.current+value;
    setOnField(nf);onFieldR.current=nf;setOnFieldSum(ns);onFieldSumR.current=ns;
    // ホスト=青('player'), ゲスト=赤('dealer')
    setOnFieldColors(prev=>[...prev,onRoleR.current==='host'?'player':'dealer']);
    wsR.current.send(JSON.stringify({type:'play',idx,value}));
  }
  function goOnlineHome(){
    if(wsR.current){try{wsR.current.send(JSON.stringify({type:'leave'}));}catch(e){}wsR.current.close();wsR.current=null;}
    if(onCdIntervalR.current){clearInterval(onCdIntervalR.current);onCdIntervalR.current=null;}
    if(onTimerIntervalR.current){clearInterval(onTimerIntervalR.current);onTimerIntervalR.current=null;}
    endTimeRef.current=0;
    stopBGM();setPhase('menu');phaseR.current='menu';
    setOnMyHand([]);setOnField([]);setOnFieldColors([]);setOnFieldSum(0);setOnMyPt(0);setOnOpPt(0);
    setOnCountNum(-1);onCountNumR.current=-1;setOnFlashMsg(null);setOnEndData(null);setOnLoadingPct(-1);setOnShowReady(false);
    if(timerRAFR.current){cancelAnimationFrame(timerRAFR.current);timerRAFR.current=null;}playingStartAtR.current=null;
  }
  function showOnlineMenu(){
    // ルーム作成/入室選択
    const code=window.prompt('ルームコードを入力（作る場合は空欄）');
    if(code===null)return;
    if(code.trim()===''){createRoom();}
    else{joinRoom(code.trim());}
  }

  function toggleMusic(){if(musicEnabledR.current){stopBGM();musicEnabledR.current=false;setMusicEnabled(false);}else{musicEnabledR.current=true;setMusicEnabled(true);resumeAC();if(phaseR.current==='playing'||phaseR.current==='online_playing')startBGM();}}
  function clearTimers(){clearTimeout(aiRef.current);clearInterval(timerRef.current);clearTimeout(countRef.current);}
  useEffect(()=>()=>clearTimers(),[]);

  function startGame(diff){
    if(diff){setDifficulty(diff);diffRef.current=diff;}
    clearTimers();lockR.current=false;
    const p=createDeck(),d=createDeck();
    setPH(p);setDH(d);pHR.current=p;dHR.current=d;
    setPPt(0);setDPt(0);pPtR.current=0;dPtR.current=0;
    setRNum(1);setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;
    setFlashMsg(null);setBurstAnim(false);setResetFA(false);setGameEndData(null);
    if(musicEnabledR.current)startBGM();doCountdown(p,d,0,0,1);
  }

  function doCountdown(pHand,dHand,pp,dp,rn){
    setPhase('playing');phaseR.current='playing';
    setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;
    setFlashMsg(null);setTimeLeft(10);setComboShow(null);
    let c=5;setCountNum(c);countNumR.current=c;
    function tick(){
      setCountNum(c);countNumR.current=c;
      if(c===0){
        // GO！音
        playGoChime();        setTimeout(()=>{
          setCountNum(-1);countNumR.current=-1;
          aiFirstFastRef.current=Math.random()<0.90;
          startTimer(rn);
          if(Math.random()<0.50){lockR.current=true;scheduleAi(rn,120);setTimeout(()=>{lockR.current=false;},400);}
          else{lockR.current=false;scheduleAi(rn,120);}
        },650);
        return;
      }
      c--;countRef.current=setTimeout(tick,650);
      playTickSE();
    }
    tick();
  }

  function startTimer(rn){
    clearInterval(timerRef.current);
    let t=10;setTimeLeft(t);
    timerRef.current=setInterval(()=>{
      t--;setTimeLeft(t);
      if(t<=0){clearInterval(timerRef.current);clearTimeout(aiRef.current);doTimeUp(rn);}
    },1000);
  }

  function doTimeUp(rn){
    resumeAC();playMissSE();
    setFlashMsg({text:'⏱ 時間切れ！引き分け（±0pt）',color:DIM});
    const newP=createDeck(),newD=createDeck();
    setPH(newP);setDH(newD);pHR.current=newP;dHR.current=newD;
    setTimeout(()=>{
      setFlashMsg(null);
      const pp=pPtR.current,dp=dPtR.current;
      if(pp>=WIN_PT||dp>=WIN_PT){endGame(pp,dp);return;}
      const nr=rn+1;setRNum(nr);doCountdown(newP,newD,pp,dp,nr);
    },1600);
  }

  function scheduleAi(rn,delay=null){
    clearTimeout(aiRef.current);
    let d;
    if(delay!==null){d=delay;}
    else{
      const cf=fieldR.current,cs=fieldSumR.current,fl=cf.length;
      const canWin=dHR.current.some(v=>canPlay(v,cs,cf)&&cs+v===10);
      const diff=diffRef.current;
      if(canWin)d=diff==='easy'?600+Math.random()*800:diff==='hard'?50+Math.random()*100:100+Math.random()*200;
      else if(fl===0){if(diff==='easy')d=800+Math.random()*800;else if(diff==='hard')d=150+Math.random()*200;else d=aiFirstFastRef.current?300+Math.random()*300:1200+Math.random()*800;}
      else if(fl===1)d=diff==='easy'?1000+Math.random()*600:diff==='hard'?400+Math.random()*200:1000+Math.random()*400;
      else d=diff==='easy'?1200+Math.random()*800:diff==='hard'?600+Math.random()*300:1500+Math.random()*500;
    }
    aiRef.current=setTimeout(()=>{if(phaseR.current==='playing'&&countNumR.current<0)aiPlay(rn);},d);
  }

  function aiPlay(rn){
    const dHand=dHR.current,cf=fieldR.current,cs=fieldSumR.current;
    if(!dHand.length)return;
    const playable=dHand.filter(v=>canPlay(v,cs,cf));
    if(!playable.length){scheduleAi(rn);return;}
    const wins=playable.filter(v=>cs+v===10);
    const safe=playable.filter(v=>cs+v<10);
    const diff=diffRef.current;
    const winRate  =diff==='easy'?0.60:diff==='hard'?0.97:0.85;
    const safeRate5=diff==='easy'?0.25:diff==='hard'?0.60:0.35;
    const safeBase =diff==='easy'?0.35:diff==='hard'?0.70:0.40;
    const safeCap  =diff==='easy'?0.50:diff==='hard'?0.90:0.65;
    const firstRate=diff==='easy'?0.45:diff==='hard'?0.80:0.55;
    let chosen=null;
    if(wins.length&&Math.random()<winRate)chosen=wins.reduce((b,v)=>calcPts([...cf,v]).total>calcPts([...cf,b]).total?v:b,wins[0]);
    else if(cs>=8){if(diff==='hard'&&Math.random()<0.15&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else if(cs>=5){if(Math.random()<safeRate5&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else if(cs>=1){if(Math.random()<Math.min(safeBase+cf.length*0.08,safeCap)&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else{if(Math.random()<firstRate&&safe.length)chosen=safe.sort((a,b)=>a-b)[0];}
    if(!chosen){scheduleAi(rn);return;}
    resumeAC();playTapSE();
    const idx=dHand.indexOf(chosen);
    const newDH=dHand.filter((_,i)=>i!==idx);
    setDH(newDH);dHR.current=newDH;
    if(!newDH.length){const nd=createDeck();setDH(nd);dHR.current=nd;}
    if(!resolvePlay(chosen,cf,cs,'dealer',rn))scheduleAi(rn);
  }

  function playCard(idx){
    if(phaseR.current!=='playing'||countNumR.current>=0||lockR.current)return;
    const value=pH[idx];
    if(!value||!canPlay(value,fieldSum,field))return;
    clearTimeout(aiRef.current);resumeAC();playTapSE();
    const newPH=pH.map((v,i)=>i===idx?null:v);
    setPH(newPH);pHR.current=newPH;
    if(!newPH.filter(Boolean).length){const nd=createDeck();setTimeout(()=>{setPH(nd);pHR.current=nd;},100);}
    if(!resolvePlay(value,field,fieldSum,'player',rNum)){clearTimeout(aiRef.current);scheduleAi(rNum);}
  }

  function resolvePlay(value,curField,curSum,who,rn){
    const nf=[...curField,value],ns=curSum+value;
    setField(nf);setFieldSum(ns);fieldR.current=nf;fieldSumR.current=ns;
    setFieldColors(prev=>[...prev,who]);
    if(ns>10){
      clearTimers();lockR.current=true;playBurstSE();setBurstAnim(true);
      triggerScreenFlash('#ff000066',400);triggerShake(450);
      const newPP=who==='player'?Math.max(0,pPtR.current-2):pPtR.current;
      const newDP=who==='dealer'?Math.max(0,dPtR.current-2):dPtR.current;
      setPPt(newPP);setDPt(newDP);pPtR.current=newPP;dPtR.current=newDP;
      setFlashMsg({text:who==='player'?'💥 バースト！あなた-2pt':'💥 ディーラーバースト！ディーラー-2pt',color:who==='player'?PINK:RED_C,who});
      setTimeout(()=>{setBurstAnim(false);resetField();if(newPP>=WIN_PT||newDP>=WIN_PT){endGame(newPP,newDP);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,newPP,newDP,nr);},1000);
      return true;
    }
    if(ns===10){
      clearTimers();lockR.current=true;
      const pts=calcPts(nf);
      const lv=getComboLevel(pts.voice||'役なし');
      const newPP=who==='player'?pPtR.current+pts.total:pPtR.current;
      const newDP=who==='dealer'?dPtR.current+pts.total:dPtR.current;
      setPPt(newPP);setDPt(newDP);pPtR.current=newPP;dPtR.current=newDP;
      playComboSfx(pts.voice||'役なし');
      setResetFA(true);
      // ズドーン演出！
      const fc=['','#00e5ff22','#00ffff33','#ff88ff33','#ffff0055','#ffffff77'];
      triggerScreenFlash(fc[Math.min(lv,5)],lv>=4?500:300);
      if(lv>=3)triggerShake(lv>=5?700:400);
      const color=who==='player'?PINK:RED_C;
      setComboShow({text:pts.voice||'10達成！',pts:pts.total,color});
      setTimeout(()=>setComboShow(null),5200);
      setTimeout(()=>{setResetFA(false);resetField();if(newPP>=WIN_PT||newDP>=WIN_PT){endGame(newPP,newDP);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,newPP,newDP,nr);},1400);
      return true;
    }
    if(nf.length>=4){
      clearTimers();lockR.current=true;setResetFA(true);
      setFlashMsg({text:'4枚！強制リセット',color:DIM});
      setTimeout(()=>{setResetFA(false);resetField();const pp=pPtR.current,dp=dPtR.current;if(pp>=WIN_PT||dp>=WIN_PT){endGame(pp,dp);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,pp,dp,nr);},900);
      return true;
    }
    return false;
  }

  function resetField(){setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;setFieldColors([]);}
  function endGame(pp,dp){stopBGM();setGameEndData({pPt:pp,dPt:dp,winner:pp>=WIN_PT?'player':'dealer',diff:diffRef.current});setPhase('gameEnd');}
  function goHome(){clearTimers();stopBGM();setPhase('menu');}

  if(phase==='menu')return h(MenuScreen,{onSolo:startGame,onOnline:showOnlineMenu,musicOn:musicEnabled,toggleMusic:toggleMusic});
  if(phase==='online_waiting')return h(WaitingScreen,{roomId,onCancel:goOnlineHome});
  if(phase==='online_end'&&onEndData)return h(OnlineEndScreen,{data:onEndData,onHome:goOnlineHome});
  if(phase==='gameEnd'&&gameEndData)return h(GameEndScreen,{data:gameEndData,onRestart:startGame,onHome:goHome});

  if(phase==='online_playing'){
    const role=onRoleR.current;
    const isCardOff=(v)=>onCountNum>=0||onTimeLeft<=0||!canPlay(v,onFieldSum,onField);
    return h('div',{style:{height:'100dvh',display:'flex',flexDirection:'column',overflow:'hidden',background:'linear-gradient(180deg,#0a0020 0%,#12002e 40%,#180040 70%,#1a0035 100%)',fontFamily:"'Playfair Display',serif",position:'relative',justifyContent:'center'}},
      
      onComboShow&&h(CyberParticles,{key:'op_'+onComboShow.text+Date.now(),color:onComboShow.color,level:getComboLevel(onComboShow.text),active:true}),
      onComboShow&&h(CyberComboDisplay,{key:'oc_'+onComboShow.text+Date.now(),combo:onComboShow}),
      // ── オーバーレイ（ローディング/Ready/カウントダウン/フラッシュ）──
      onLoadingPct>=0&&!onShowReady&&h('div',{style:{position:'fixed',inset:0,zIndex:200,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#0a0a1aee',pointerEvents:'none'}},
        h('div',{style:{fontSize:22,fontWeight:900,color:'#00d4ff',letterSpacing:4,marginBottom:24,fontFamily:"'Fira Code',monospace"}},'LOADING...'),
        h('div',{style:{width:260,height:14,background:'#1a1a3a',borderRadius:8,border:'1px solid #00d4ff44',overflow:'hidden'}},
          h('div',{style:{height:'100%',width:onLoadingPct+'%',background:'linear-gradient(90deg,#00d4ff,#a050ff)',borderRadius:8,transition:'width 0.1s linear',boxShadow:'0 0 12px #00d4ff88'}})
        ),
        h('div',{style:{marginTop:12,fontSize:14,color:'#00d4ff88',fontFamily:"'Fira Code',monospace"}},onLoadingPct+'%')
      ),
      onShowReady&&h('div',{style:{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',background:'#0a0a1aee',pointerEvents:'none'}},
        h('div',{style:{fontSize:72,fontWeight:900,color:'#00d4ff',animation:'countDown 0.4s ease both',textShadow:'0 0 40px #00d4ff',letterSpacing:8,fontFamily:"'Playfair Display',serif"}},'Ready')
