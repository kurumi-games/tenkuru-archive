<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PiCLuK ver.13</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@400;600&display=swap');

/* ─────────────────────────────────────
   BASE
───────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, #28005a 0%, transparent 58%),
    radial-gradient(ellipse 55% 40% at 85% 85%, #001a50 0%, transparent 55%),
    radial-gradient(ellipse 45% 45% at 15% 95%, #380038 0%, transparent 52%),
    #05000f;
  position:fixed;width:100%;height:100dvh;touch-action:none;
  font-family:'Orbitron','Fira Code',monospace;
  -webkit-font-smoothing:antialiased;
}

/* ─────────────────────────────────────
   CSS VARIABLES
   Layout is divided into 4 zones (top→bottom):
     HUD:    --z-hud   (compact header)
     DEALER: --z-dlr   (dealer strip, minimal)
     FIELD:  --z-fld   (hero — takes most space)
     HAND:   --z-hand  (fan cards + hint)
───────────────────────────────────── */
:root{
  --cyan:   #00e5ff;
  --pink:   #ff2d9b;
  --violet: #8b20ff;
  --gold:   #ffd040;
  --dim:    #9070c0;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);

  /* ── Zone heights ──────────────────────────────────────────
     Target: Pixel 6/7 class  ≈ 844px usable height
     HUD  :  48px  (≈ 5.7dvh)
     DLR  :  36px  (≈ 4.3dvh)
     FIELD:  1fr   → ≈ 310px  (≈ 37dvh)   ← trimmed from 38%+
     HAND :  450px (≈ 53dvh)  ← big enough for 2 rows + hint
     Total:  48+36+310+450 = 844 ✓
  ─────────────────────────────────────────────────────────── */
  --z-hud:  clamp(44px, 5.7dvh, 54px);
  --z-dlr:  clamp(32px, 4.3dvh, 42px);
  /* HAND = 2 × card-h + label + hint + padding, computed from card size */
  /* We fix hand zone to exactly fit 2 fan rows */
  --z-hand: calc(var(--hc-h) * 2 + 38px);

  /* ── Field cards ────────────────────────────────────────────
     Field zone ≈ 37dvh ≈ 312px.  Cards should be tall but leave
     room for the "場" label and sum line (≈ 50px total).
     So fc-h ≤ 312 - 50 = 262px — but 4 cards side-by-side need
     width ≤ (screen_width - 32px margin - 3×gap) / 4
     On 390px screen: (390-32-36)/4 ≈ 80px  → fc-w ≤ 80px
     → fc-h = fc-w / 0.72 ≤ 111px
  ─────────────────────────────────────────────────────────── */
  --fc-w: clamp(58px, 19vw, 78px);
  --fc-h: calc(var(--fc-w) / 0.72);   /* ≈ 81–108px */

  /* ── Hand cards ─────────────────────────────────────────────
     Must fit 5 cards side-by-side with minimal overlap on 390px.
     At 88% spacing: 5 × (hc-w × 0.88) + hc-w ≤ 390px - 16px
     → hc-w × (5×0.88 + 1) = hc-w × 5.4 ≤ 374
     → hc-w ≤ 69px  (use 66px as safe upper bound)
     hc-h = hc-w / 0.72 → max ≈ 92px
     Two rows: 2 × 92 + 14px gap + 20px label + 18px hint ≈ 236px
     → --z-hand ≈ 240px max
  ─────────────────────────────────────────────────────────── */
  --hc-w: clamp(52px, 16vw, 66px);
  --hc-h: calc(var(--hc-w) / 0.72);   /* ≈ 72–92px */
}

/* ─────────────────────────────────────
   KEYFRAMES
───────────────────────────────────── */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes countDown{0%{transform:scale(.35);opacity:0}40%{transform:scale(1.18);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(.75);opacity:0}}
@keyframes slideIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@keyframes burst{0%{transform:scale(1)}40%{transform:scale(1.22);opacity:.7}100%{transform:scale(.88);opacity:0}}
@keyframes resetAnim{0%{transform:scale(1)}40%{transform:scale(1.05);filter:brightness(1.5)}100%{transform:scale(1);filter:none}}
@keyframes screenFlash{0%{opacity:.8}100%{opacity:0}}
@keyframes cameraShake{0%,100%{transform:translate(0,0)}15%{transform:translate(-5px,-3px)}30%{transform:translate(5px,3px)}45%{transform:translate(-4px,4px)}60%{transform:translate(4px,-3px)}75%{transform:translate(-3px,3px)}90%{transform:translate(2px,-2px)}}
@keyframes fieldDrop{
  0%  {opacity:0;transform:scale(.4) translateY(-60px) rotate(-10deg);filter:blur(4px);}
  45% {transform:scale(1.18) translateY(4px) rotate(.8deg);filter:blur(0);}
  65% {transform:scale(.95) translateY(-2px) rotate(-.3deg);}
  82% {transform:scale(1.03) translateY(0);}
  100%{opacity:1;transform:scale(1) translateY(0) rotate(0);}
}
@keyframes winSpin{0%{transform:rotateY(0) scale(1)}30%{transform:rotateY(180deg) scale(1.2)}60%{transform:rotateY(360deg) scale(1.38)}100%{transform:rotateY(720deg) scale(1)}}
/* Fan card deal — uses CSS var for its resting transform */
@keyframes cardDeal{
  0%  {opacity:0;transform:var(--ft) scale(.65) translateY(-20px);}
  60% {transform:var(--ft) scale(1.06) translateY(2px);}
  100%{opacity:1;transform:var(--ft);}
}
@keyframes comboPop{0%{transform:scale(.3) rotate(-8deg);opacity:0}50%{transform:scale(1.22) rotate(2deg);opacity:1}70%{transform:scale(.96) rotate(-1deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes cyberIn{0%{transform:scale(.2) skewX(18deg);opacity:0;filter:blur(10px)}40%{transform:scale(1.28) skewX(-3deg);opacity:1;filter:blur(0)}70%{transform:scale(.97) skewX(1deg)}100%{transform:scale(1) skewX(0);opacity:1;filter:none}}
@keyframes chromaR{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,1px)}}
@keyframes chromaB{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-1px)}}
@keyframes gridFlash{0%,100%{opacity:0}50%{opacity:.2}}
@keyframes titleGlitch{0%,90%,100%{transform:none;filter:none}92%{transform:translateX(-3px);filter:hue-rotate(90deg)}96%{transform:none}98%{transform:translateX(-1px);filter:brightness(2)}}
@keyframes hexOpen{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:1}100%{transform:translate(-50%,-50%) scale(4) rotate(120deg);opacity:0}}
@keyframes dualBeam{0%{transform:scaleX(0);opacity:1}60%{transform:scaleX(1);opacity:.8}100%{opacity:0}}
@keyframes softRing{0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}

/* ─────────────────────────────────────
   LAYOUT SHELL
   4 fixed zones stacked, no scrolling
───────────────────────────────────── */
.game-shell{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows: var(--z-hud) var(--z-dlr) 1fr var(--z-hand);
  grid-template-columns: 1fr;
  overflow:hidden;
}

/* ─────────────────────────────────────
   ZONE 1 — HUD (ultra-compact)
───────────────────────────────────── */
.hud{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 4px) 10px 4px;
  background:linear-gradient(180deg,rgba(5,0,15,.97) 70%,transparent);
  z-index:20;gap:4px;
}
.hud-time{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:46px;padding:2px 7px;border-radius:8px;
  border:1.5px solid rgba(100,50,200,.5);
  background:rgba(12,3,36,.9);
  transition:background .3s,border-color .3s;
}
.hud-time.danger{background:var(--pink);border-color:var(--pink);animation:pulse .5s infinite;}
.hud-time .t-label{font-size:7px;letter-spacing:2px;color:var(--dim);font-family:'Fira Code',monospace;}
.hud-time .t-val{font-size:20px;font-weight:900;color:#fff;line-height:1;}
.hud-time.danger .t-label,.hud-time.danger .t-val{color:#fff;}
.hud-scores{display:flex;gap:10px;align-items:center;}
.hud-score{text-align:center;}
.hud-score .s-lbl{font-size:7px;letter-spacing:2px;color:var(--dim);font-family:'Fira Code',monospace;}
.hud-score .s-val{font-size:18px;font-weight:900;line-height:1.1;}
.hud-mid{text-align:center;}
.hud-mid .r-lbl{font-size:8px;color:var(--dim);font-family:'Fira Code',monospace;}
.hud-mid .d-lbl{font-size:7px;font-weight:700;font-family:'Fira Code',monospace;letter-spacing:1px;}
.hud-btns{display:flex;gap:4px;}
.hud-btn{
  background:transparent;border:1px solid rgba(255,255,255,.2);
  border-radius:7px;padding:4px 8px;
  color:rgba(255,255,255,.45);font-size:13px;cursor:pointer;
}

/* ─────────────────────────────────────
   ZONE 2 — DEALER STRIP (very thin)
───────────────────────────────────── */
.dlr-strip{
  display:flex;align-items:center;gap:6px;
  padding:0 10px;
  opacity:.65;   /* intentionally dimmed — not primary info */
}
.dlr-label{
  font-size:8px;letter-spacing:2px;color:var(--dim);
  font-family:'Fira Code',monospace;flex-shrink:0;white-space:nowrap;
}
.dlr-cards{display:flex;gap:2px;align-items:center;overflow:hidden;}
.dlr-pip{
  width:16px;height:22px;border-radius:3px;flex-shrink:0;
  background:linear-gradient(135deg,#200640,#0e0020);
  border:1px solid rgba(130,40,230,.35);
  display:flex;align-items:center;justify-content:center;
}
.dlr-pip svg{width:8px;height:8px;opacity:.4;}

/* ─────────────────────────────────────
   ZONE 3 — FIELD (HERO)
   Fills all remaining space between dealer and hand
───────────────────────────────────── */
.field-zone{
  position:relative;
  margin:0 8px;
  border:2px solid var(--violet);
  border-radius:18px;
  background:rgba(10,1,28,.72);
  backdrop-filter:blur(8px);
  overflow:visible;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;   /* tighter — cards are bigger now */
  transition:border-color .25s, box-shadow .3s;
}
/* corner accent lines */
.field-zone::before,.field-zone::after{
  content:'';position:absolute;border-radius:18px;pointer-events:none;
}
.field-zone::before{
  inset:-1px;
  background:linear-gradient(135deg,rgba(0,229,255,.12),transparent 40%,rgba(255,45,155,.1));
  z-index:0;
}
.field-zone::after{
  inset:0;
  border-radius:16px;
  background:radial-gradient(ellipse 70% 50% at 50% 50%, rgba(100,0,200,.08), transparent);
  z-index:0;
}
.field-zone.sum-mid  {border-color:#ff7700;box-shadow:0 0 14px rgba(255,119,0,.3);}
.field-zone.sum-high-p{border-color:var(--cyan);box-shadow:0 0 22px rgba(0,229,255,.4);}
.field-zone.sum-high-d{border-color:var(--pink);box-shadow:0 0 22px rgba(255,45,155,.4);}
.field-zone.burst-anim{animation:burst .5s ease;}
.field-zone.reset-anim{animation:resetAnim .5s ease;}
.field-zone.win-cyan{border-color:var(--cyan);box-shadow:0 0 36px var(--cyan), 0 0 80px rgba(0,229,255,.35);}
.field-zone.win-pink{border-color:var(--pink);box-shadow:0 0 36px var(--pink), 0 0 80px rgba(255,45,155,.35);}

.field-lbl{
  font-size:7px;letter-spacing:5px;color:rgba(140,100,220,.4);
  font-family:'Fira Code',monospace;
  position:relative;z-index:1;
}
.field-cards{
  display:flex;gap:clamp(6px,1.5vw,12px);justify-content:center;align-items:center;
  position:relative;z-index:1;
  /* shrink-wrap to actual cards, don't stretch */
  flex-wrap:nowrap;
}
/* field card placeholder */
.fc-slot{
  width:var(--fc-w);height:var(--fc-h);flex-shrink:0;
  border-radius:12px;
  border:1.5px dashed rgba(120,50,220,.18);
  background:rgba(255,255,255,.015);
}
/* field sum display — demoted to helper UI */
.field-sum{
  display:flex;align-items:baseline;gap:6px;
  position:relative;z-index:1;
  opacity:.85;
}
.field-sum .fs-num{
  font-size:clamp(22px,4.5vw,32px);font-weight:900;line-height:1;
  transition:color .25s;
  text-shadow:0 0 10px currentColor;
}
.field-sum .fs-sub{
  font-size:10px;color:var(--dim);font-family:'Fira Code',monospace;
  opacity:.7;
}

/* ─────────────────────────────────────
   FIELD CARD
───────────────────────────────────── */
.fc{
  width:var(--fc-w);height:var(--fc-h);
  border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  animation:fieldDrop .38s cubic-bezier(.15,1.4,.4,1) both;
}
/* impact ring that fires on card land */
.fc::after{
  content:'';
  position:absolute;inset:-4px;
  border-radius:18px;
  opacity:0;
  pointer-events:none;
}
.fc.fc-cyan{
  background:linear-gradient(155deg,#03101e,#050f22 60%,#020a14);
  border:2.5px solid var(--cyan);
  box-shadow:
    0 0 0 1px rgba(0,229,255,.25),
    0 0 20px rgba(0,229,255,.8),
    0 0 6px  var(--cyan),
    0 0 55px rgba(0,229,255,.25),
    0 6px 24px rgba(0,0,0,.85);
}
.fc.fc-pink{
  background:linear-gradient(155deg,#160208,#1e0010 60%,#100006);
  border:2.5px solid var(--pink);
  box-shadow:
    0 0 0 1px rgba(255,45,155,.25),
    0 0 20px rgba(255,45,155,.8),
    0 0 6px  var(--pink),
    0 0 55px rgba(255,45,155,.25),
    0 6px 24px rgba(0,0,0,.85);
}
/* win state: maximum glow */
.fc.fc-win{
  animation:fieldDrop .38s cubic-bezier(.15,1.4,.4,1) both, winSpin 1.5s ease .1s both;
}
.fc.fc-cyan.fc-win{
  box-shadow:
    0 0 0 2px var(--cyan),
    0 0 30px var(--cyan),
    0 0 80px rgba(0,229,255,.6),
    0 0 120px rgba(0,229,255,.25),
    0 8px 28px rgba(0,0,0,.9);
}
.fc.fc-pink.fc-win{
  box-shadow:
    0 0 0 2px var(--pink),
    0 0 30px var(--pink),
    0 0 80px rgba(255,45,155,.6),
    0 0 120px rgba(255,45,155,.25),
    0 8px 28px rgba(0,0,0,.9);
}
/* number: fill most of the card height */
.fc .fc-num{
  font-size:calc(var(--fc-h) * 0.52);
  font-weight:900;line-height:1;
  pointer-events:none;
  /* slight inner glow via text-shadow handled inline */
}
.fc .fc-corner{
  position:absolute;font-size:clamp(9px,1.8vw,12px);font-weight:900;pointer-events:none;
  font-family:'Orbitron',monospace;
}
.fc .fc-corner.tl{top:6px;left:7px;}
.fc .fc-corner.br{bottom:6px;right:7px;transform:rotate(180deg);}

/* ── impact shockwave keyframe (triggered via JS class toggle) ── */
@keyframes impactRing{
  0%  {box-shadow:0 0 0  0px rgba(255,255,255,.6),0 0 0  0px rgba(255,255,255,.3);}
  40% {box-shadow:0 0 0 18px rgba(255,255,255,.2),0 0 0 36px rgba(255,255,255,.08);}
  100%{box-shadow:0 0 0 36px rgba(255,255,255,0),  0 0 0 72px rgba(255,255,255,0);}
}
.fc.fc-impact{animation:fieldDrop .38s cubic-bezier(.15,1.4,.4,1) both, impactRing .45s ease .12s both;}

/* ─────────────────────────────────────
   ZONE 4 — HAND (fan layout, fixed bottom)
───────────────────────────────────── */
.hand-zone{
  position:relative;
  background:linear-gradient(0deg,rgba(5,0,15,.98) 55%,rgba(5,0,15,.6) 80%,transparent);
  display:flex;flex-direction:column;
  padding-bottom:calc(4px + var(--safe-b));
  overflow:visible;
  z-index:10;
}
.hand-lbl{
  font-size:8px;letter-spacing:2px;color:var(--dim);opacity:.7;
  font-family:'Fira Code',monospace;
  text-align:center;padding-top:3px;flex-shrink:0;
}
/* fan-row: height = card height + a small buffer for arc lift */
.fan-row{
  position:relative;
  display:flex;justify-content:center;
  height:calc(var(--hc-h) + 14px);
  flex-shrink:0;
}
/* second row sits just behind the first — small overlap only */
.fan-row + .fan-row{ margin-top:-6px; }

/* ─────────────────────────────────────
   HAND CARD
───────────────────────────────────── */
.hc{
  width:var(--hc-w);height:var(--hc-h);
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  position:absolute;
  bottom:0;
  transform-origin:50% 115%;   /* pivot slightly below card = natural arc */
  cursor:pointer;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  will-change:transform;
  animation:cardDeal .28s cubic-bezier(.2,1.3,.5,1) both;
  transition:box-shadow .12s, filter .12s;
}
.hc.hc-cyan{
  background:linear-gradient(160deg,#020c1c,#040f24);
  border:2px solid var(--cyan);
  box-shadow:0 0 16px rgba(0,229,255,.6), 0 0 4px var(--cyan), 0 5px 18px rgba(0,0,0,.7);
}
.hc.hc-pink{
  background:linear-gradient(160deg,#150208,#1e000e);
  border:2px solid var(--pink);
  box-shadow:0 0 16px rgba(255,45,155,.6), 0 0 4px var(--pink), 0 5px 18px rgba(0,0,0,.7);
}
/* Disabled: clearly dimmed */
.hc.hc-disabled{
  opacity:.2;cursor:default;filter:grayscale(.9) brightness(.5);
  box-shadow:none !important;border-color:rgba(80,60,100,.4) !important;
}
/* Pressed: big brightness surge for instant feedback */
.hc.hc-pressed{
  box-shadow:0 0 36px rgba(0,229,255,.95), 0 0 12px var(--cyan), 0 2px 8px rgba(0,0,0,.5) !important;
  filter:brightness(1.8);
}
.hc.hc-pressed.hc-pink{
  box-shadow:0 0 36px rgba(255,45,155,.95), 0 0 12px var(--pink), 0 2px 8px rgba(0,0,0,.5) !important;
}
.hc .hc-num{
  /* number fills ~50% of card height for maximum legibility */
  font-size:calc(var(--hc-h) * 0.50);
  font-weight:900;line-height:1;pointer-events:none;
}
.hc .hc-corner{
  position:absolute;
  font-size:calc(var(--hc-h) * 0.12);
  font-weight:900;pointer-events:none;
  font-family:'Orbitron',monospace;
}
.hc .hc-corner.tl{top:4px;left:5px;}
.hc .hc-corner.br{bottom:4px;right:5px;transform:rotate(180deg);}

/* ─────────────────────────────────────
   HINT STRIP
───────────────────────────────────── */
.hint-strip{
  display:flex;gap:3px;justify-content:center;flex-wrap:wrap;
  padding:2px 8px 0;flex-shrink:0;
}
.hint-pip{
  font-size:7.5px;color:rgba(160,120,255,.55);
  font-family:'Fira Code',monospace;
  background:rgba(255,255,255,.05);
  border-radius:3px;padding:1px 4px;white-space:nowrap;
}
.hint-pip b{color:rgba(0,220,255,.7);font-weight:700;}

/* ─────────────────────────────────────
   OVERLAY / FLASH MSG
───────────────────────────────────── */
.ov-center{
  position:fixed;inset:0;z-index:160;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.flash-box{
  backdrop-filter:blur(10px);border-radius:14px;
  padding:11px 20px;font-size:16px;font-weight:900;
  border:2px solid;animation:slideIn .2s ease;
  max-width:86vw;text-align:center;
}
.cd-num{font-weight:900;animation:countDown .65s ease both;text-shadow:0 0 28px #fff;}
.cd-num.go{color:#50e080;text-shadow:0 0 55px #50e080;}

/* ─────────────────────────────────────
   MENU SCREEN
───────────────────────────────────── */
.menu-bg{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, #28005a 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 90%, #001845 0%, transparent 55%),
    #05000f;
}
.menu-inner{
  display:flex;flex-direction:column;align-items:center;
  gap:18px;width:100%;max-width:320px;animation:fadeUp .5s ease;text-align:center;
}
.m-btn{
  border-radius:12px;padding:12px 0;
  font-family:'Orbitron',monospace;font-weight:700;font-size:13px;
  cursor:pointer;letter-spacing:1px;transition:filter .18s,transform .1s;
  touch-action:manipulation;
}
.m-btn:active{transform:scale(.97);}

/* ─────────────────────────────────────
   LOADING BAR
───────────────────────────────────── */
.load-bar-bg{width:240px;height:12px;background:#181830;border-radius:6px;border:1px solid rgba(0,200,255,.3);overflow:hidden;}
.load-bar-fg{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .1s;box-shadow:0 0 10px var(--cyan);}
</style>
</head>
<body>
<div id="root"></div>
<script>
const WS_URL='wss://4peace-server-vw1ezw.fly.dev';
const h=React.createElement;
const{useState,useEffect,useRef}=React;

/* ──────────────────────────────────────
   CONSTANTS
────────────────────────────────────── */
const WIN_PT=15;
const CYAN='#00e5ff', PINK='#ff2d9b', VIOLET='#8b20ff', GOLD='#ffd040', DIM='#9070c0';

/* ──────────────────────────────────────
   GAME LOGIC (unchanged)
────────────────────────────────────── */
function createDeck(){
  const d=[];
  while(d.length<10){const v=Math.floor(Math.random()*5)+1;if(d.filter(x=>x===v).length<3)d.push(v);}
  return d.sort(()=>Math.random()-.5);
}
function calcPts(cards){
  const s=[...cards].sort((a,b)=>a-b);
  if(cards.length===4&&s.join('')==='1234')return{total:5,voice:'ストレート'};
  if(cards.length===2&&s[0]===5&&s[1]===5)return{total:1,voice:'役なし'};
  const freq={};cards.forEach(v=>{freq[v]=(freq[v]||0)+1;});
  const counts=Object.values(freq);
  if(counts.some(c=>c>=3))return{total:4,voice:'スリーカード'};
  if(counts.filter(c=>c===2).length>=2)return{total:3,voice:'ツーペア'};
  if(counts.some(c=>c===2))return{total:2,voice:'ワンペア'};
  return{total:1,voice:'役なし'};
}
function canPlay(v,fieldSum,field){
  if(field.filter(x=>x!==null).length>=4)return false;
  const filled=field.filter(x=>x!==null).length+1,ns=fieldSum+v;
  if(filled===3&&ns<5)return false;
  if(filled===4&&ns<10)return false;
  return true;
}
function getComboLevel(voice){
  if(voice==='ストレート')return 5;if(voice==='スリーカード')return 4;
  if(voice==='ツーペア')return 3;if(voice==='ワンペア')return 2;return 1;
}

/* ──────────────────────────────────────
   WS TIME SYNC
────────────────────────────────────── */
function syncServerTime(ws,offsetRef,cb){
  let n=0;const offs=[];
  function ping(){if(!ws||ws.readyState!==WebSocket.OPEN){cb();return;}ws.send(JSON.stringify({type:'ping',clientTime:Date.now()}));}
  const orig=ws.onmessage;
  ws.onmessage=(e)=>{
    try{const m=JSON.parse(e.data);if(m.type==='pong'){const rtt=Date.now()-m.clientTime;offs.push(m.serverTime+(rtt/2)-Date.now());n++;if(n<3)setTimeout(ping,50);else{offsetRef.current=offs.reduce((a,b)=>a+b,0)/offs.length;ws.onmessage=orig;cb();}return;}}catch(e){}
    if(orig)orig(e);
  };
  ping();
}

  AC.state==='suspended'?AC.resume().then(go):go();
}

  try{resumeAC();const t=AC.currentTime;[[523,0,.08],[659,.09,.08],[784,.18,.08],[1047,.27,.25]].forEach(([f,d,dur])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.2,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+dur);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+dur+.02);});}catch(e){}
}

/* ══════════════════════════════════════════
   ★ FAN TRANSFORM  — playability first
   Uses vw-based card width to match --hc-w: clamp(52px,16vw,66px)
════════════════════════════════════════════ */
function fanT(idx,count){
  if(count<=0)return{rotate:0,tx:0,ty:0,z:1};

  // Max ±7° for 5 cards
  const halfSpread = Math.min(7, 1.8 * (count - 1));
  const angle = count===1 ? 0 : -halfSpread + (halfSpread*2/(count-1))*idx;

  // Nearly flat arc — max 4px drop at edges
  const norm = count===1 ? 0 : (idx/(count-1))*2-1;
  const ty   = 4 * norm*norm;

  // Match --hc-w: clamp(52px, 16vw, 66px)
  const cardW = Math.min(Math.max(window.innerWidth * 0.16, 52), 66);
  // 88% spacing → cards slightly overlap, feel like a hand
  const tx = (idx - (count-1)/2) * cardW * 0.88;

  const z = Math.round(count - Math.abs(idx - (count-1)/2));
  return {rotate:angle, tx, ty, z};
}

/* ══════════════════════════════════════════
   ★ BlastEffect  (particle canvas)
════════════════════════════════════════════ */
function BlastEffect({voice,who,active}){
  const cvRef=useRef(null);const rafRef=useRef(null);
  const lv=getComboLevel(voice);
  const mc=who==='player'?CYAN:PINK;
  useEffect(()=>{
    if(!active)return;
    const cv=cvRef.current;if(!cv)return;
    cv.width=window.innerWidth;cv.height=window.innerHeight;
    const ctx=cv.getContext('2d');const cx=cv.width/2,cy=cv.height*.40;
    const pals={1:[mc,'#fff','#aaffff'],2:[mc,'#fff','#ffe080'],3:[mc,'#ff88ff','#ffff66','#aaffff','#fff'],4:[mc,'#ff88ff','#ffff44','#fff','#ff4488','#44ffff'],5:['#ff00ff','#ffff00','#00ffff','#ff4400','#44ff00','#ff0044','#fff','#00ff88']};
    const pal=pals[Math.min(lv,5)];const rc=()=>pal[Math.floor(Math.random()*pal.length)];
    const pts=[];
    function sp(bx,by,cnt,sm=1,sz=1,gm=1){for(let i=0;i<cnt;i++){const a=Math.random()*Math.PI*2,spd=(4+Math.random()*[0,7,10,16,22,32][lv])*sm,siz=(Math.random()*[0,3,4,6,9,13][lv]+2)*sz,sh=Math.random()<.3?'star':Math.random()<.4?'trail':'dot';pts.push({x:bx,y:by,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:.004+Math.random()*.009,size:siz,col:rc(),sh,grav:.09*gm+Math.random()*.07,px:bx,py:by});}}
    sp(cx,cy,[0,30,55,90,140,220][lv]);
    const t2=setTimeout(()=>{if(lv>=2){const offs=lv>=4?[[cx-90,cy-50],[cx+90,cy-50],[cx,cy+60]]:[[cx-60,cy-30],[cx+60,cy-30]];offs.forEach(([ox,oy])=>sp(ox,oy,Math.floor([0,0,20,40,70,110][lv]/offs.length),.8,.85,1.1));}},160);
    const t3=setTimeout(()=>{if(lv>=3)for(let i=0;i<(lv>=5?6:3);i++)sp(cx+(Math.random()-.5)*cv.width*.7,cy+(Math.random()-.5)*cv.height*.5,lv>=5?35:18,.65,.8,1.3);},340);
    const t4=setTimeout(()=>{if(lv>=5)for(let i=0;i<8;i++)sp(cx+(Math.random()-.5)*cv.width*.9,cy+(Math.random()-.5)*cv.height*.7,25,.5,.7,1.5);},550);
    function dStar(c,x,y,r,col,a){c.save();c.globalAlpha=a;c.fillStyle=col;c.shadowBlur=10;c.shadowColor=col;c.beginPath();for(let i=0;i<10;i++){const ag=(i*Math.PI/5)-Math.PI/2,rd=i%2===0?r:r*.42;i===0?c.moveTo(x+rd*Math.cos(ag),y+rd*Math.sin(ag)):c.lineTo(x+rd*Math.cos(ag),y+rd*Math.sin(ag));}c.closePath();c.fill();c.restore();}
    let fr=0;
    function draw(){
      ctx.clearRect(0,0,cv.width,cv.height);fr++;
      const rings=[0,2,3,5,7,10][lv];
      for(let r=0;r<rings;r++){const p=(fr-r*5)/80;if(p<=0||p>1)continue;ctx.save();ctx.globalAlpha=(1-p)*.85;ctx.strokeStyle=pal[r%pal.length];ctx.lineWidth=lv>=4?5:3;ctx.shadowBlur=lv>=4?20:10;ctx.shadowColor=pal[r%pal.length];ctx.beginPath();ctx.arc(cx,cy,p*Math.min(cv.width,cv.height)*.52*(1+r*.2),0,Math.PI*2);ctx.stroke();ctx.restore();}
      if(lv>=5&&fr>2&&fr<50){[0,45,90,135,180,225,270,315].forEach((deg,i)=>{const rd=deg*Math.PI/180,p=Math.min(1,(fr-2)/40),al=(1-p)*.8,bL=Math.max(cv.width,cv.height)*.8*p;ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=pal[i%pal.length];ctx.lineWidth=3;ctx.shadowBlur=16;ctx.shadowColor=pal[i%pal.length];ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(rd)*bL,cy+Math.sin(rd)*bL);ctx.stroke();ctx.restore();});}
      if(lv===4&&fr>2&&fr<40){[60,180,300].forEach((deg,i)=>{const rd=deg*Math.PI/180,p=Math.min(1,(fr-2)/30),al=(1-p)*.9,bL=Math.max(cv.width,cv.height)*.7*p;ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=pal[i%pal.length];ctx.lineWidth=5;ctx.shadowBlur=20;ctx.shadowColor=pal[i%pal.length];ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(rd)*bL,cy+Math.sin(rd)*bL);ctx.stroke();ctx.restore();});}
      if(fr<=4){ctx.save();ctx.globalAlpha=.2*(1-fr/5);const g=ctx.createRadialGradient(cx,cy,0,cx,cy,cv.width*.55);g.addColorStop(0,'#fff');g.addColorStop(.25,mc);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();}
      pts.forEach(p=>{p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy=p.vy*.94+p.grav;p.life-=p.decay;if(p.life<=0)return;const a=Math.max(0,p.life);if(p.sh==='trail'){ctx.save();ctx.globalAlpha=a*.75;ctx.strokeStyle=p.col;ctx.lineWidth=p.size*.7;ctx.shadowBlur=10;ctx.shadowColor=p.col;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore();}else if(p.sh==='star'){dStar(ctx,p.x,p.y,p.size*p.life*1.5,p.col,a);}else{ctx.save();ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.shadowBlur=lv>=3?12:6;ctx.shadowColor=p.col;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.size*p.life),0,Math.PI*2);ctx.fill();ctx.restore();}});
      pts.filter(p=>p.life>0).length>0||fr<100?rafRef.current=requestAnimationFrame(draw):ctx.clearRect(0,0,cv.width,cv.height);
    }
    draw();
    return()=>{cancelAnimationFrame(rafRef.current);clearTimeout(t2);clearTimeout(t3);clearTimeout(t4);};
  },[active]);
  if(!active)return null;
  return h('canvas',{ref:cvRef,style:{position:'fixed',inset:0,zIndex:300,pointerEvents:'none',width:'100%',height:'100%'}});
}

    lv>=3&&isShow&&ph!=='pts'&&[
      h('div',{key:'r',style:{position:'absolute',fontSize:sz,fontWeight:900,fontFamily:"'Orbitron',monospace",letterSpacing:lv>=4?10:4,color:'#ff003355',animation:'chromaR .25s ease infinite',userSelect:'none'}},voice),

/* ══════════════════════════════════════════
   ★ FieldCard
════════════════════════════════════════════ */
function FieldCard({value,by,isWin=false,winLv=1,isNewest=false}){
  const isBlue=by==='player'||by==='host';
  const col=isBlue?CYAN:PINK;
  // win glow: override the CSS default via inline shadow only for win state
  const winGlows=[
    '',
    `0 0 20px ${col}99`,
    `0 0 28px ${col}, 0 0 60px ${col}88`,
    `0 0 38px ${col}, 0 0 80px ${col}88, 0 0 14px #fff5`,
    `0 0 50px ${col}, 0 0 100px ${col}88, 0 0 24px #fff7`,
    `0 0 70px ${col}, 0 0 140px ${col}88, 0 0 36px #ffff0077, 0 0 10px #fff`,
  ];
  const extraShadow = isWin ? winGlows[Math.min(winLv,5)] : null;
  const cls=`fc ${isBlue?'fc-cyan':'fc-pink'}${isWin?' fc-win':''}${isNewest&&!isWin?' fc-impact':''}`;
  return h('div',{className:cls,style:extraShadow?{boxShadow:extraShadow}:undefined},
    h('span',{className:'fc-num',style:{
      color:col,
      textShadow:`0 0 ${isWin?28:14}px ${col}, 0 0 ${isWin?8:3}px ${col}`,
    }},value),
    h('span',{className:'fc-corner tl',style:{color:col,opacity:.8}},value),
    h('span',{className:'fc-corner br',style:{color:col,opacity:.8}},value)
  );
}

/* ══════════════════════════════════════════
   ★ HandCard  (absolutely positioned in fan-row)
════════════════════════════════════════════ */
function HandCard({value,onPlay,disabled,isBlue,fanIdx,fanCount}){
  const[pressed,setPressed]=useState(false);
  const col=disabled?'#444':isBlue?CYAN:PINK;
  const{rotate,tx,ty,z}=fanT(fanIdx,fanCount);
  // ft = final resting transform (used by cardDeal animation too)
  const ft=`rotate(${rotate}deg) translate(${tx}px, ${ty}px)`;
  return h('div',{
    className:`hc ${isBlue?'hc-cyan':'hc-pink'}${disabled?' hc-disabled':''}${pressed&&!disabled?' hc-pressed':''}`,
    style:{'--ft':ft,transform:ft,zIndex:z+5},
    onPointerDown:()=>{if(!disabled)setPressed(true);},
    onPointerUp:()=>{if(!disabled&&pressed){setPressed(false);onPlay();}},
    onPointerCancel:()=>setPressed(false),
    onPointerLeave:()=>setPressed(false),
    onClick:()=>{if(!disabled)onPlay();},
  },
    h('span',{className:'hc-num',style:{color:col,textShadow:`0 0 10px ${col}`}},value),
    h('span',{className:'hc-corner tl',style:{color:col}},value),
    h('span',{className:'hc-corner br',style:{color:col}},value)
  );
}

/* ══════════════════════════════════════════
   ★ FanRow  — renders up to 5 cards in an arc
════════════════════════════════════════════ */
function FanRow({cards,isBlue,disabledFn,onPlay}){
  // cards = [{v, origIdx}]
  const n=cards.length;
  if(n===0)return null;
  return h('div',{className:'fan-row'},
    cards.map(({v,origIdx},fi)=>
      h(HandCard,{key:`${origIdx}_${v}`,value:v,onPlay:()=>onPlay(origIdx),disabled:disabledFn(v),isBlue,fanIdx:fi,fanCount:n})
    )
  );
}

/* ══════════════════════════════════════════
   ★ FanHand  — split into row1(0-4) and row2(5-9)
════════════════════════════════════════════ */
function FanHand({hand,onPlay,disabledFn,isBlue}){
  const row1=hand.slice(0,5).map((v,i)=>({v,origIdx:i})).filter(({v})=>v&&v!==0);
  const row2=hand.slice(5).map((v,i)=>({v,origIdx:i+5})).filter(({v})=>v&&v!==0);
  return h('div',{style:{position:'relative',overflow:'visible'}},
    h(FanRow,{cards:row1,isBlue,disabledFn,onPlay}),
    row2.length>0&&h(FanRow,{cards:row2,isBlue,disabledFn,onPlay})
  );
}

  const[onField,setOnField]=useState([]);const[onFieldColors,setOnFieldColors]=useState([]);const[onFieldSum,setOnFieldSum]=useState(0);
  const[onMyPt,setOnMyPt]=useState(0);const[onOpPt,setOnOpPt]=useState(0);
  const[onRNum,setOnRNum]=useState(1);const[onTimeLeft,setOnTimeLeft]=useState(10);
  const[onCountNum,setOnCountNum]=useState(-1);
  const[onLoadPct,setOnLoadPct]=useState(-1);const[onShowReady,setOnShowReady]=useState(false);
  const[onFlashMsg,setOnFlashMsg]=useState(null);
  const[onBurstAnim,setOnBurstAnim]=useState(false);const[onResetFA,setOnResetFA]=useState(false);
  const[onComboShow,setOnComboShow]=useState(null);const[onEndData,setOnEndData]=useState(null);

  const wsR=useRef(null);const onRoleR=useRef('');const onBurstAnimR=useRef(false);
  const timeupSEfiredR=useRef(false);const comboSEfiredR=useRef(false);
  const onCdIvR=useRef(null);const onTmIvR=useRef(null);const endTimeR=useRef(0);
  const onMyHandR=useRef([]);const onFieldR=useRef([]);const onFieldSumR=useRef(0);
  const onTLR=useRef(10);const playStartR=useRef(null);const rafTmR=useRef(null);
  const srvOffsetR=useRef(0);const onCdNumR=useRef(-1);
  const aiR=useRef(null),tmR=useRef(null),cdR=useRef(null);
  const pPtR=useRef(0),dPtR=useRef(0),pHR=useRef([]),dHR=useRef([]);
  const fieldR=useRef([]),fieldSumR=useRef(0);
  const phaseR=useRef('menu'),cdNumR=useRef(-1),lockR=useRef(false);
  const aiFastR=useRef(true);
  const fieldColorsR=useRef([]);

  useEffect(()=>{pPtR.current=pPt;},[pPt]);useEffect(()=>{dPtR.current=dPt;},[dPt]);
  useEffect(()=>{pHR.current=pH;},[pH]);useEffect(()=>{dHR.current=dH;},[dH]);
  useEffect(()=>{fieldR.current=field;},[field]);useEffect(()=>{fieldSumR.current=fieldSum;},[fieldSum]);
  useEffect(()=>{fieldColorsR.current=fieldColors;},[fieldColors]);
  useEffect(()=>{phaseR.current=phase;},[phase]);

  /* ── Online ── */
  function onConnect(cb){const ws=new WebSocket(WS_URL);wsR.current=ws;ws.onopen=()=>cb(ws);ws.onmessage=(e)=>onMsg(JSON.parse(e.data));ws.onclose=()=>{if(['online_waiting','online_playing'].includes(phaseR.current)){alert('接続が切れました');goOnlineHome();}};}
  function onMsg(msg){
    switch(msg.type){
      case 'created':setRoomId(msg.roomId);setPhase('online_waiting');phaseR.current='online_waiting';break;
      case 'joined':setRoomId(msg.roomId);stopBGM();setPhase('online_playing');phaseR.current='online_playing';syncServerTime(wsR.current,srvOffsetR,()=>{if(wsR.current&&wsR.current.readyState===WebSocket.OPEN)wsR.current.send(JSON.stringify({type:'readyAck'}));});break;
      case 'guestJoined':stopBGM();setPhase('online_playing');phaseR.current='online_playing';syncServerTime(wsR.current,srvOffsetR,()=>{if(wsR.current&&wsR.current.readyState===WebSocket.OPEN)wsR.current.send(JSON.stringify({type:'readyAck'}));});break;
      case 'pong':{const rtt=Date.now()-msg.clientTime;srvOffsetR.current=msg.serverTime+(rtt/2)-Date.now();break;}
      case 'tick':{
        const role=onRoleR.current;setOnMyHand(msg.myHand||[]);onMyHandR.current=msg.myHand||[];
        setOnOpCount(msg.opHandCount||0);
        const nf=msg.field||[];setOnField(nf);onFieldR.current=nf;setOnFieldSum(msg.fieldSum||0);onFieldSumR.current=msg.fieldSum||0;
        if(msg.fieldOwners)setOnFieldColors(msg.fieldOwners.map(o=>o==='host'?'player':'dealer'));else if(nf.length===0)setOnFieldColors([]);
        setOnMyPt(role==='host'?msg.hostPt:msg.guestPt);setOnOpPt(role==='host'?msg.guestPt:msg.hostPt);setOnRNum(msg.rNum||1);
        if(msg.phase==='playing'&&msg.playingStartAt){if(playStartR.current!==msg.playingStartAt){playStartR.current=msg.playingStartAt;if(rafTmR.current)cancelAnimationFrame(rafTmR.current);function tk(){const sn=Date.now()+srvOffsetR.current;const el=sn-playStartR.current;const left=Math.max(0,10-Math.floor(el/1000));setOnTimeLeft(left);onTLR.current=left;if(left>0)rafTmR.current=requestAnimationFrame(tk);}rafTmR.current=requestAnimationFrame(tk);}}
        else if(msg.phase!=='playing'){if(rafTmR.current){cancelAnimationFrame(rafTmR.current);rafTmR.current=null;}playStartR.current=null;setOnTimeLeft(msg.timeLeft||10);onTLR.current=msg.timeLeft||10;}
        if(msg.phase==='loading'){setOnLoadPct(msg.loadingPct||0);setOnShowReady(false);}else if(msg.phase==='ready'){setOnLoadPct(100);setOnShowReady(true);if(musicEnabledR.current){resumeAC();startBGM();}}else{setOnLoadPct(-1);setOnShowReady(false);}
        const cd=msg.phase==='countdown'?msg.countdown:-1;const pcd=onCdNumR.current;if(cd!==pcd){onCdNumR.current=cd;setOnCountNum(cd);if(pcd===0&&cd===-1)playGoChime();}
        if(msg.flashMsg){const fm=msg.flashMsg;const isMy=fm.by===role;const who2=isMy?'YOU':'相手';const parts=fm.text.split('　');const lbl=parts.length>1?parts.slice(1).join('　'):fm.text;setOnFlashMsg({text:who2+'　'+lbl,who:isMy?'player':'dealer'});if(fm.voice&&!comboSEfiredR.current){comboSEfiredR.current=true;resumeAC();playComboSfx(fm.voice);}}else{setOnFlashMsg(null);comboSEfiredR.current=false;}
        if(msg.comboShow)setOnComboShow(msg.comboShow);else setOnComboShow(null);
        const pb=onBurstAnimR.current;const nb=!!msg.burstAnim&&msg.phase==='resolving';if(nb&&!pb){resumeAC();playBurstSE();}if(nb!==pb){setOnBurstAnim(nb);onBurstAnimR.current=nb;}
        setOnResetFA(!!msg.resetAnim);
        if(msg.phase==='timeup'&&!timeupSEfiredR.current){timeupSEfiredR.current=true;playMissSE();}if(msg.phase!=='timeup')timeupSEfiredR.current=false;break;
      }
      case 'state':
        if(onCdIvR.current){clearInterval(onCdIvR.current);onCdIvR.current=null;}if(onTmIvR.current){clearInterval(onTmIvR.current);onTmIvR.current=null;}endTimeR.current=0;
        setOnMyHand(msg.myHand||[]);onMyHandR.current=msg.myHand||[];setOnOpCount(msg.opHandCount||0);
        setOnField(msg.field||[]);onFieldR.current=msg.field||[];setOnFieldColors([]);setOnFieldSum(msg.fieldSum||0);onFieldSumR.current=msg.fieldSum||0;
        setOnMyPt(msg.myPt||0);setOnOpPt(msg.opPt||0);setOnRNum(msg.rNum||1);setOnTimeLeft(msg.timeLeft||10);onTLR.current=msg.timeLeft||10;
        if(msg.countdownStartAt){const sa=msg.countdownStartAt,dur=msg.countdownDuration||5;onCdNumR.current=dur;setOnCountNum(dur);onCdIvR.current=setInterval(()=>{const el=Math.floor((Date.now()-sa)/700);const val=dur-el;if(val<=0){clearInterval(onCdIvR.current);onCdIvR.current=null;onCdNumR.current=0;setOnCountNum(0);setTimeout(()=>{onCdNumR.current=-1;setOnCountNum(-1);playGoChime();},650);}else{onCdNumR.current=val;setOnCountNum(val);}},100);}
        break;
      case 'gameStart':
        if(onCdIvR.current){clearInterval(onCdIvR.current);onCdIvR.current=null;}if(onTmIvR.current){clearInterval(onTmIvR.current);onTmIvR.current=null;}
        onCdNumR.current=-1;setOnCountNum(-1);endTimeR.current=msg.timerEndAt;
        onTmIvR.current=setInterval(()=>{const r=Math.ceil((endTimeR.current-Date.now())/1000);if(r<=0){clearInterval(onTmIvR.current);onTmIvR.current=null;setOnTimeLeft(0);onTLR.current=0;playMissSE();}else{setOnTimeLeft(r);onTLR.current=r;}},200);break;
      case 'timeUp':if(onTmIvR.current){clearInterval(onTmIvR.current);onTmIvR.current=null;}setOnTimeLeft(0);setOnFlashMsg({text:'⏱ 時間切れ！引き分け（±0pt）',who:null});setTimeout(()=>setOnFlashMsg(null),1600);break;
      case 'handUpdate':{const nh=[...onMyHandR.current];nh[msg.idx]=0;setOnMyHand(nh);onMyHandR.current=nh;break;}
      case 'newHand':setOnMyHand(msg.hand);onMyHandR.current=msg.hand;break;
      case 'fieldUpdate':setOnField(msg.field);onFieldR.current=msg.field;setOnFieldSum(msg.fieldSum);onFieldSumR.current=msg.fieldSum;break;
      case 'opPlay':{const nf2=[...onFieldR.current,msg.value];setOnField(nf2);onFieldR.current=nf2;setOnFieldSum(msg.fieldSum);onFieldSumR.current=msg.fieldSum;setOnFieldColors(prev=>[...prev,onRoleR.current==='host'?'dealer':'player']);resumeAC();playTapSE();setOnOpCount(c=>Math.max(0,c-1));break;}
      case 'burst':resumeAC();playBurstSE();setOnBurstAnim(true);{const ib=msg.msg.by===onRoleR.current;setOnFlashMsg({text:ib?'💥 バースト！あなた-2pt':'💥 相手バースト！相手-2pt',who:ib?'player':'dealer'});if(onRoleR.current==='host'){setOnMyPt(msg.hostPt);setOnOpPt(msg.guestPt);}else{setOnMyPt(msg.guestPt);setOnOpPt(msg.hostPt);}setTimeout(()=>{setOnBurstAnim(false);setOnFlashMsg(null);},1000);}break;
      case 'score':if(msg.voice)playComboSfx(msg.voice);setOnResetFA(true);setOnComboShow(msg.combo);if(onRoleR.current==='host'){setOnMyPt(msg.hostPt);setOnOpPt(msg.guestPt);}else{setOnMyPt(msg.guestPt);setOnOpPt(msg.hostPt);}setTimeout(()=>setOnComboShow(null),5200);setTimeout(()=>setOnResetFA(false),1400);break;
      case 'comboEnd':setOnComboShow(null);break;
      case 'forceReset':setOnResetFA(true);setOnFlashMsg({text:'4枚！強制リセット',who:null});setTimeout(()=>{setOnResetFA(false);setOnFlashMsg(null);},900);break;
      case 'finish':{const isMe=msg.winner===onRoleR.current;setOnEndData({winner:isMe?'me':'op',myPt:onRoleR.current==='host'?msg.hostPt:msg.guestPt,opPt:onRoleR.current==='host'?msg.guestPt:msg.hostPt});stopBGM();setPhase('online_end');phaseR.current='online_end';}break;
      case 'opLeft':alert('相手が退出しました');goOnlineHome();break;
      case 'error':alert(msg.msg);break;
    }
  }
  function createRoom(){onRoleR.current='host';onConnect(ws=>ws.send(JSON.stringify({type:'create'})));}
  function joinRoom(code){onRoleR.current='guest';onConnect(ws=>ws.send(JSON.stringify({type:'join',roomId:code})));}
  function onlinePlayCard(idx,value){
    if(onCdNumR.current>=0||onTLR.current<=0)return;if(!wsR.current||wsR.current.readyState!==WebSocket.OPEN)return;
    if(!onMyHandR.current[idx])return;if(!canPlay(value,onFieldSumR.current,onFieldR.current))return;
    resumeAC();playTapSE();const nh=[...onMyHandR.current];nh[idx]=0;setOnMyHand(nh);onMyHandR.current=nh;
    const nf=[...onFieldR.current,value],ns=onFieldSumR.current+value;
    setOnField(nf);onFieldR.current=nf;setOnFieldSum(ns);onFieldSumR.current=ns;
    setOnFieldColors(prev=>[...prev,onRoleR.current==='host'?'player':'dealer']);
    wsR.current.send(JSON.stringify({type:'play',idx,value}));
  }
  function goOnlineHome(){
    if(wsR.current){try{wsR.current.send(JSON.stringify({type:'leave'}));}catch(e){}wsR.current.close();wsR.current=null;}
    if(onCdIvR.current){clearInterval(onCdIvR.current);onCdIvR.current=null;}if(onTmIvR.current){clearInterval(onTmIvR.current);onTmIvR.current=null;}
    endTimeR.current=0;stopBGM();setPhase('menu');phaseR.current='menu';
    setOnMyHand([]);setOnField([]);setOnFieldColors([]);setOnFieldSum(0);setOnMyPt(0);setOnOpPt(0);
    setOnCountNum(-1);onCdNumR.current=-1;setOnFlashMsg(null);setOnEndData(null);setOnLoadPct(-1);setOnShowReady(false);
    if(rafTmR.current){cancelAnimationFrame(rafTmR.current);rafTmR.current=null;}playStartR.current=null;
  }
  function showOnlineMenu(){const code=window.prompt('ルームコードを入力（作る場合は空欄）');if(code===null)return;code.trim()===''?createRoom():joinRoom(code.trim());}
  function toggleMusic(){if(musicEnabledR.current){stopBGM();musicEnabledR.current=false;setMusicEnabled(false);}else{musicEnabledR.current=true;setMusicEnabled(true);resumeAC();if(['playing','online_playing'].includes(phaseR.current))startBGM();}}
  function clearTimers(){clearTimeout(aiR.current);clearInterval(tmR.current);clearTimeout(cdR.current);}
  useEffect(()=>()=>clearTimers(),[]);

  /* ── Solo game ── */
  function startGame(diff){
    if(diff){setDifficulty(diff);diffRef.current=diff;}clearTimers();lockR.current=false;
    const p=createDeck(),d=createDeck();setPH(p);setDH(d);pHR.current=p;dHR.current=d;
    setPPt(0);setDPt(0);pPtR.current=0;dPtR.current=0;
    setRNum(1);setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;setFieldColors([]);fieldColorsR.current=[];
    setFlashMsg(null);setBurstAnim(false);setResetFA(false);setGameEndData(null);
    setComboEffect(null);setWinField([]);setWinFieldColors([]);
    if(musicEnabledR.current)startBGM();doCountdown(p,d,0,0,1);
  }
  function doCountdown(pH2,dH2,pp,dp,rn){
    setPhase('playing');phaseR.current='playing';
    setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;setFieldColors([]);fieldColorsR.current=[];
    setFlashMsg(null);setTimeLeft(10);setWinField([]);setWinFieldColors([]);setComboEffect(null);
    let c=5;setCountNum(c);cdNumR.current=c;
    function tick(){setCountNum(c);cdNumR.current=c;
      if(c===0){
        playGoChime();
        setTimeout(()=>{setCountNum(-1);cdNumR.current=-1;aiFastR.current=Math.random()<.90;startTimer(rn);if(Math.random()<.50){lockR.current=true;scheduleAi(rn,120);setTimeout(()=>{lockR.current=false;},400);}else{lockR.current=false;scheduleAi(rn,120);}},650);return;
      }
      c--;cdR.current=setTimeout(tick,650);
    }
    tick();
  }
  function startTimer(rn){clearInterval(tmR.current);let t=10;setTimeLeft(t);tmR.current=setInterval(()=>{t--;setTimeLeft(t);if(t<=0){clearInterval(tmR.current);clearTimeout(aiR.current);doTimeUp(rn);}},1000);}
  function doTimeUp(rn){
    resumeAC();playMissSE();setFlashMsg({text:'⏱ 時間切れ！引き分け（±0pt）',who:null});
    const np=createDeck(),nd=createDeck();setPH(np);setDH(nd);pHR.current=np;dHR.current=nd;
    setTimeout(()=>{setFlashMsg(null);const pp=pPtR.current,dp=dPtR.current;if(pp>=WIN_PT||dp>=WIN_PT){endGame(pp,dp);return;}const nr=rn+1;setRNum(nr);doCountdown(np,nd,pp,dp,nr);},1600);
  }
  function scheduleAi(rn,delay=null){
    clearTimeout(aiR.current);let d;
    if(delay!==null){d=delay;}else{
      const cf=fieldR.current,cs=fieldSumR.current,fl=cf.length;const cw=dHR.current.some(v=>canPlay(v,cs,cf)&&cs+v===10);const diff=diffRef.current;
      if(cw)d=diff==='easy'?600+Math.random()*800:diff==='hard'?50+Math.random()*100:100+Math.random()*200;
      else if(fl===0){if(diff==='easy')d=800+Math.random()*800;else if(diff==='hard')d=150+Math.random()*200;else d=aiFastR.current?300+Math.random()*300:1200+Math.random()*800;}
      else if(fl===1)d=diff==='easy'?1000+Math.random()*600:diff==='hard'?400+Math.random()*200:1000+Math.random()*400;
      else d=diff==='easy'?1200+Math.random()*800:diff==='hard'?600+Math.random()*300:1500+Math.random()*500;
    }
    aiR.current=setTimeout(()=>{if(phaseR.current==='playing'&&cdNumR.current<0)aiPlay(rn);},d);
  }
  function aiPlay(rn){
    const dHand=dHR.current,cf=fieldR.current,cs=fieldSumR.current;if(!dHand.length)return;
    const playable=dHand.filter(v=>canPlay(v,cs,cf));if(!playable.length){scheduleAi(rn);return;}
    const wins=playable.filter(v=>cs+v===10),safe=playable.filter(v=>cs+v<10),diff=diffRef.current;
    const wr=diff==='easy'?.60:diff==='hard'?.97:.85,sr5=diff==='easy'?.25:diff==='hard'?.60:.35;
    const sb=diff==='easy'?.35:diff==='hard'?.70:.40,sc=diff==='easy'?.50:diff==='hard'?.90:.65,fr=diff==='easy'?.45:diff==='hard'?.80:.55;
    let chosen=null;
    if(wins.length&&Math.random()<wr)chosen=wins.reduce((b,v)=>calcPts([...cf,v]).total>calcPts([...cf,b]).total?v:b,wins[0]);
    else if(cs>=8){if(diff==='hard'&&Math.random()<.15&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else if(cs>=5){if(Math.random()<sr5&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else if(cs>=1){if(Math.random()<Math.min(sb+cf.length*.08,sc)&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else{if(Math.random()<fr&&safe.length)chosen=safe.sort((a,b)=>a-b)[0];}
    if(!chosen){scheduleAi(rn);return;}
    resumeAC();playTapSE();const idx=dHand.indexOf(chosen),nDH=dHand.filter((_,i)=>i!==idx);setDH(nDH);dHR.current=nDH;
    if(!nDH.length){const nd=createDeck();setDH(nd);dHR.current=nd;}
    if(!resolvePlay(chosen,cf,cs,'dealer',rn))scheduleAi(rn);
  }
  function playCard(idx){
    if(phaseR.current!=='playing'||cdNumR.current>=0||lockR.current)return;
    const value=pH[idx];if(!value||!canPlay(value,fieldSum,field))return;
    clearTimeout(aiR.current);resumeAC();playTapSE();
    const nPH=pH.map((v,i)=>i===idx?null:v);setPH(nPH);pHR.current=nPH;
    if(!nPH.filter(Boolean).length){const nd=createDeck();setTimeout(()=>{setPH(nd);pHR.current=nd;},100);}
    if(!resolvePlay(value,field,fieldSum,'player',rNum)){clearTimeout(aiR.current);scheduleAi(rNum);}
  }
  function resolvePlay(value,curField,curSum,who,rn){
    const nf=[...curField,value],ns=curSum+value;
    setField(nf);setFieldSum(ns);fieldR.current=nf;fieldSumR.current=ns;
    setFieldColors(prev=>{const nc=[...prev,who];fieldColorsR.current=nc;return nc;});
    if(ns>10){
      clearTimers();lockR.current=true;playBurstSE();setBurstAnim(true);
      triggerScreenFlash('#ff000044',400);triggerShake(450);
      const nPP=who==='player'?Math.max(0,pPtR.current-2):pPtR.current;
      const nDP=who==='dealer'?Math.max(0,dPtR.current-2):dPtR.current;
      setPPt(nPP);setDPt(nDP);pPtR.current=nPP;dPtR.current=nDP;
      setFlashMsg({text:who==='player'?'💥 バースト！あなた-2pt':'💥 ディーラーバースト！-2pt',who});
      setTimeout(()=>{setBurstAnim(false);resetFieldFn();if(nPP>=WIN_PT||nDP>=WIN_PT){endGame(nPP,nDP);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,nPP,nDP,nr);},1200);
      return true;
    }
    if(ns===10){
      clearTimers();lockR.current=true;const pts=calcPts(nf);const lv=getComboLevel(pts.voice);
      const nPP=who==='player'?pPtR.current+pts.total:pPtR.current;
      const nDP=who==='dealer'?dPtR.current+pts.total:dPtR.current;
      setPPt(nPP);setDPt(nDP);pPtR.current=nPP;dPtR.current=nDP;
      playComboSfx(pts.voice);setResetFA(true);
      const fc=['','#00e5ff22','#00ffff33','#ff88ff33','#ffff0055','#ffffff77'];
      triggerScreenFlash(fc[Math.min(lv,5)],lv>=4?500:300);if(lv>=3)triggerShake(lv>=5?700:400);
      setWinField(nf);
      // fieldColors state is async — use ref for accurate snapshot
      setWinFieldColors([...fieldColorsR.current,who]);
      setWinLv(lv);setComboEffect({voice:pts.voice,who,pts:pts.total});
      setTimeout(()=>{setResetFA(false);setComboEffect(null);setWinField([]);setWinFieldColors([]);resetFieldFn();if(nPP>=WIN_PT||nDP>=WIN_PT){endGame(nPP,nDP);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,nPP,nDP,nr);},5000);
      return true;
    }
    if(nf.length>=4){
      clearTimers();lockR.current=true;setResetFA(true);setFlashMsg({text:'4枚！強制リセット',who:null});
      setTimeout(()=>{setResetFA(false);resetFieldFn();const pp=pPtR.current,dp=dPtR.current;if(pp>=WIN_PT||dp>=WIN_PT){endGame(pp,dp);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,pp,dp,nr);},900);
      return true;
    }
    return false;
  }
  function resetFieldFn(){setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;setFieldColors([]);fieldColorsR.current=[];}
  function endGame(pp,dp){stopBGM();setGameEndData({pPt:pp,dPt:dp,winner:pp>=WIN_PT?'player':'dealer',diff:diffRef.current});setPhase('gameEnd');}
  function goHome(){clearTimers();stopBGM();setPhase('menu');}

  /* ── Render ── */
  if(phase==='menu')return h(MenuScreen,{onSolo:startGame,onOnline:showOnlineMenu,musicOn:musicEnabled,toggleMusic});
  if(phase==='online_waiting')return h(WaitingScreen,{roomId,onCancel:goOnlineHome});
  if(phase==='online_end'&&onEndData)return h(EndScreen,{win:onEndData.winner==='me',pScore:onEndData.myPt,dScore:onEndData.opPt,onHome:goOnlineHome,isOnline:true});
  if(phase==='gameEnd'&&gameEndData)return h(EndScreen,{win:gameEndData.winner==='player',pScore:gameEndData.pPt,dScore:gameEndData.dPt,onRestart:startGame,onHome:goHome,diff:gameEndData.diff,isOnline:false});

  if(phase==='online_playing'){
    const role=onRoleR.current;
    const onCombo=onComboShow?{voice:onComboShow.text||'役なし',who:role==='host'?'player':'dealer',pts:onComboShow.pts||1}:null;
    return h(GameScreen,{
      timeLeft:onTimeLeft,pPt:onMyPt,dPt:onOpPt,rNum:onRNum,
      flashMsg:onFlashMsg,burstAnim:onBurstAnim,resetFA:onResetFA,
      comboEffect:onCombo,winField:[],winFieldColors:[],winLv:1,
      field:onField,fieldColors:onFieldColors,fieldSum:onFieldSum,
      hand:onMyHand,dealerCount:onOpCount,
      musicEnabled,onToggleMusic:toggleMusic,onGoHome:goOnlineHome,
      onPlayCard:(idx)=>{const v=onMyHandR.current[idx];if(v)onlinePlayCard(idx,v);},
      difficulty:'normal',isOnline:true,role,
      loadingPct:onLoadPct,showReady:onShowReady,countNum:onCountNum,
    });
  }

  /* solo */
  return h(GameScreen,{
    timeLeft,pPt,dPt,rNum,
    flashMsg,burstAnim,resetFA,
    comboEffect,winField,winFieldColors,winLv,
    field,fieldColors,fieldSum,
    hand:pH,dealerCount:dH.length,
    musicEnabled,onToggleMusic:toggleMusic,onGoHome:goHome,
    onPlayCard:playCard,
    difficulty,isOnline:false,role:'',
    loadingPct:-1,showReady:false,countNum,
  });
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
