<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

body{background:linear-gradient(180deg,#3a1a6e 0%,#6040a0 40%,#9060b8 70%,#c070c0 100%);min-height:100vh;overflow:hidden;position:fixed;width:100%;touch-action:none;}
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Fira+Code:wght@400;600&display=swap');
@keyframes dealIn{from{opacity:0;transform:translateY(-12px) scale(0.88);}to{opacity:1;transform:none;}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
@keyframes burst{0%{transform:scale(1)}40%{transform:scale(1.3);opacity:0.7}100%{transform:scale(0.8);opacity:0}}
@keyframes resetAnim{0%{transform:scale(1)}40%{transform:scale(1.08);filter:brightness(1.3)}100%{transform:scale(1);filter:none}}
@keyframes countDown{0%{transform:scale(0.4);opacity:0}40%{transform:scale(1.2);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(0.8);opacity:0}}
@keyframes slideIn{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@keyframes comboPop{0%{transform:scale(0.3) rotate(-8deg);opacity:0}50%{transform:scale(1.25) rotate(3deg);opacity:1}70%{transform:scale(0.95) rotate(-1deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes comboOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4) translateY(-30px)}}
</style>

<body>
<div id="root"></div>
<script>
const h=React.createElement;
const{useState,useEffect,useRef}=React;

// ── 定数 ──
const PANEL='#7055b8',BORDER='#c0a0ff';
const PINK='#00d4ff',PINK2='#80eeff',RED_C='#ff2d6e',BLUE_C='#ffaa00';
const TEXT='#ffffff',DIM='#e0d0ff';
const WIN_PT=15;

// ── ゲームロジック ──
function createDeck(){
  const d=[];
  while(d.length<10){const v=Math.floor(Math.random()*5)+1;if(d.filter(x=>x===v).length<3)d.push(v);}
  return d.sort(()=>Math.random()-0.5);
}
function calcPts(cards){
  const s=[...cards].sort((a,b)=>a-b);
  if(cards.length===4&&s.join('')==='1234')return{total:5,label:'ストレート +5pt',voice:'ストレート'};
  if(cards.length===2&&s[0]===5&&s[1]===5)return{total:1,label:'ノーボーナス +1pt',voice:'ノーボーナス'};
  const freq={};cards.forEach(v=>{freq[v]=(freq[v]||0)+1;});const counts=Object.values(freq);
  if(counts.some(c=>c>=3))return{total:4,label:'スリーカード +4pt',voice:'スリーカード'};
  if(counts.filter(c=>c===2).length>=2)return{total:3,label:'ツーペア +3pt',voice:'ツーペア'};
  if(counts.some(c=>c===2))return{total:2,label:'ワンペア +2pt',voice:'ワンペア'};
  return{total:1,label:'ノーボーナス +1pt',voice:'ノーボーナス'};
}
function canPlay(v,fieldSum,field){
  const len=Array.isArray(field)?field.filter(x=>x!==null).length:field;
  if(len>=4)return false;
  const filled=len+1,ns=fieldSum+v;
  if(filled===3&&ns<5)return false;
  if(filled===4&&ns<10)return false;
  return true;
}

// ── BGM ──
let bgmRunning=false,bgmAudio=null;
function stopBGM(){bgmRunning=false;if(bgmAudio){bgmAudio.pause();bgmAudio.currentTime=0;}}
function startBGM(){
  if(bgmRunning)return;bgmRunning=true;
  if(!bgmAudio){bgmAudio=new Audio('Grit Sprint.mp3');bgmAudio.loop=true;bgmAudio.volume=0.45;}
  bgmAudio.play().catch(()=>{});
}

// ── SE ──
const AC=new(window.AudioContext||window.webkitAudioContext)();
function resumeAC(){if(AC.state==='suspended')AC.resume();}
let seBuffer=null;
fetch('se.mp3').then(r=>r.arrayBuffer()).then(ab=>AC.decodeAudioData(ab)).then(buf=>{seBuffer=buf;}).catch(()=>{});
function playSE({rate=1,vol=1,detune=0}){
  if(!seBuffer)return;
  try{resumeAC();const src=AC.createBufferSource(),g=AC.createGain();
    src.buffer=seBuffer;src.playbackRate.value=rate;src.detune.value=detune;g.gain.value=vol;
    src.connect(g);g.connect(AC.destination);src.start();}catch(e){}
}
function playTapSE(){playSE({rate:1.0,vol:0.9,detune:-300});}
function playMissSE(){playSE({rate:0.6,vol:0.8,detune:-400});}
function playBurstSE(){playSE({rate:0.5,vol:1.0,detune:-600});setTimeout(()=>playSE({rate:0.4,vol:0.7,detune:-800}),150);}
function playComboSfx(voice){
  if(voice==='ノーボーナス'){playSE({rate:1.0,vol:0.6});}
  else if(voice==='ワンペア'){playSE({rate:1.3,vol:0.75,detune:200});setTimeout(()=>playSE({rate:1.5,vol:0.6,detune:400}),120);}
  else if(voice==='ツーペア'){playSE({rate:1.5,vol:0.8,detune:400});setTimeout(()=>playSE({rate:1.7,vol:0.7,detune:600}),100);setTimeout(()=>playSE({rate:2.0,vol:0.6,detune:800}),220);}
  else if(voice==='スリーカード'){playSE({rate:1.8,vol:0.85,detune:600});setTimeout(()=>playSE({rate:2.0,vol:0.8,detune:800}),80);setTimeout(()=>playSE({rate:2.3,vol:0.75,detune:1000}),170);setTimeout(()=>playSE({rate:2.6,vol:0.9,detune:1200}),280);}
  else{playSE({rate:2.0,vol:0.9,detune:800});setTimeout(()=>playSE({rate:2.3,vol:0.85,detune:1000}),70);setTimeout(()=>playSE({rate:2.6,vol:0.85,detune:1200}),150);setTimeout(()=>playSE({rate:3.0,vol:0.9,detune:1400}),230);setTimeout(()=>playSE({rate:3.5,vol:1.0,detune:1600}),320);setTimeout(()=>playSE({rate:2.5,vol:0.5,detune:1000}),500);}
}

// ── SlideCard ──
function SlideCard({value,onPlay,disabled,cardRole,fieldBottom}){
  const[dragY,setDragY]=useState(0);
  const[isDragging,setIsDragging]=useState(false);
  const startYR=useRef(0),startedR=useRef(false),curYR=useRef(0);
  function onPointerDown(e){if(disabled)return;e.preventDefault();const t=e.touches?e.touches[0]:e;startYR.current=t.clientY;curYR.current=t.clientY;startedR.current=true;setIsDragging(true);setDragY(0);}
  function onPointerMove(e){if(!startedR.current||disabled)return;e.preventDefault();const t=e.touches?e.touches[0]:e;curYR.current=t.clientY;const dy=t.clientY-startYR.current;if(dy<0)setDragY(dy);}
  function onPointerUp(e){if(!startedR.current)return;startedR.current=false;setIsDragging(false);const dy=dragY;setDragY(0);if(disabled)return;if(fieldBottom!=null?curYR.current<fieldBottom:dy<-15)onPlay();}
  const cardBg=cardRole==='player'?'#0a1e3d':'#3d0a0a';
  const numColor=cardRole==='player'?'#4da8ff':'#ff6b6b';
  const borderN=cardRole==='player'?'#1a4080':'#801a1a';
  const reached=fieldBottom!=null&&isDragging&&curYR.current<fieldBottom;
  return h('div',{
    style:{width:50,height:70,borderRadius:7,flexShrink:0,background:disabled?'#111122':cardBg,
      border:disabled?'1.5px solid #333':(reached?'2px solid #50e080':'1.5px solid '+borderN),
      display:'flex',alignItems:'center',justifyContent:'center',opacity:disabled?0.3:1,
      animation:isDragging?'none':'dealIn 0.18s ease both',position:'relative',
      userSelect:'none',WebkitUserSelect:'none',touchAction:'none',cursor:disabled?'default':'grab',
      zIndex:isDragging?100:1,transform:isDragging?`translateY(${dragY}px) scale(1.1)`:'none',
      transition:isDragging?'none':'transform 0.2s ease',
      boxShadow:reached?'0 8px 24px #50e08099':'0 2px 8px #0004'},
    onPointerDown,onPointerMove,onPointerUp,onPointerCancel:onPointerUp,
  },
    h('span',{style:{fontSize:26,fontWeight:900,color:numColor,fontFamily:"'Playfair Display',serif",lineHeight:1,pointerEvents:'none'}},value),
    h('span',{style:{position:'absolute',top:2,left:4,fontSize:10,color:numColor,fontWeight:900,pointerEvents:'none'}},value),
    h('span',{style:{position:'absolute',bottom:2,right:4,fontSize:10,color:numColor,fontWeight:900,transform:'rotate(180deg)',pointerEvents:'none'}},value)
  );
}

// ── FieldCard ──
function FieldCard({value,by}){
  const isBlue=by==='player';
  const cardBg=isBlue?'#0a1e3d':'#3d0a0a';
  const numColor=isBlue?'#4da8ff':'#ff6b6b';

  return h('div',{style:{width:50,height:70,borderRadius:7,flexShrink:0,background:cardBg,border:'1.5px solid '+borderColor,display:'flex',alignItems:'center',justifyContent:'center',animation:'dealIn 0.18s ease both',position:'relative'}},
    h('span',{style:{fontSize:26,fontWeight:900,color:numColor,fontFamily:"'Playfair Display',serif"}},value),
    h('span',{style:{position:'absolute',top:2,left:4,fontSize:10,color:numColor,fontWeight:900}},value),
    h('span',{style:{position:'absolute',bottom:2,right:4,fontSize:10,color:numColor,fontWeight:900,transform:'rotate(180deg)'}},value)
  );
}

        h('div',{style:{background:'#ffffff11',borderRadius:10,padding:12,marginBottom:12}},

        h('div',{style:{background:'#ffffff11',borderRadius:10,padding:12,marginBottom:12}},
          h('div',{style:{fontSize:13,color:PINK2,fontFamily:"'Playfair Display',serif",fontWeight:700,marginBottom:6}},'🃏 遊び方'),

          h('div',{style:{fontSize:13,color:PINK2,fontFamily:"'Playfair Display',serif",fontWeight:700,marginBottom:6}},'⭐ ポイント一覧'),
          [['ストレート','1-2-3-4','5pt'],['スリーカード','同じ3枚含む','4pt'],['ツーペア','2枚×2組','3pt'],['ワンペア','2枚×1組','2pt'],['バラバラ/5+5','ペアなし or 5+5','1pt'],['バースト','合計10超','自身-2pt']].map(([k,desc,v])=>

      )
    ),
    h('div',{style:{textAlign:'center',display:'flex',flexDirection:'column',alignItems:'center',gap:20,width:'100%',maxWidth:320,animation:'fadeUp 0.5s ease'}},
      h('div',{style:{textAlign:'center',width:'100%'}},
        h('div',{style:{fontSize:9,letterSpacing:8,color:'#d4b8ff',fontFamily:"'Fira Code',monospace",marginBottom:8,opacity:0.8}},'✦ CARD GAME ✦'),
        h('div',{style:{position:'relative',display:'inline-block'}},
          h('div',{style:{fontSize:68,fontWeight:900,lineHeight:1,letterSpacing:3,background:'linear-gradient(135deg,#ffffff 0%,#e8d5ff 30%,#c084fc 60%,#f0abfc 100%)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',filter:'drop-shadow(0 2px 16px #c084fc88)'}},'PiCLuK'),
          h('div',{style:{position:'absolute',inset:0,fontSize:68,fontWeight:900,lineHeight:1,letterSpacing:3,background:'linear-gradient(135deg,#ffffff,#c084fc,#f0abfc)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',filter:'blur(10px)',opacity:0.4,pointerEvents:'none'}},'PiCLuK')
        ),
        h('div',{style:{fontSize:11,color:'#c084fc99',fontFamily:"'Fira Code',monospace",letterSpacing:3,marginTop:4,marginBottom:4}},'ver. 01 — SOLO'),
        h('div',{style:{marginTop:4,height:1,background:'linear-gradient(90deg,transparent,#c084fc88,transparent)'}})
      ),
      h('div',{style:{width:'100%',textAlign:'left'}},
        h('div',{style:{background:'#ffffff09',border:'1px solid #c084fc33',borderRadius:12,padding:'14px 16px',fontSize:11,color:'#e0d0ff',fontFamily:"'Fira Code',monospace",lineHeight:1.9}},
          h('div',{style:{color:'#c084fc',fontWeight:700,fontSize:10,letterSpacing:3,marginBottom:6}},'BASIC'),
          h('div',null,'手札1〜5のカードを交互に出し合う（手札10枚）'),
          h('div',null,'盤面の合計をピッタリ 10 にしたプレイヤーがポイント獲得'),
          h('div',null,'先に 15pt 獲得したプレイヤーの勝ち')
        )
      ),
      h('div',{style:{width:'100%'}},
        h('div',{style:{fontSize:10,color:DIM,fontFamily:"'Fira Code',monospace",marginBottom:8,textAlign:'center',letterSpacing:3}},'── 難易度を選択 ──'),
        h('div',{style:{display:'flex',gap:8,width:'100%'}},
          ['easy','normal','hard'].map(d=>
            h('button',{key:d,onClick:()=>setDiff(d),style:{flex:1,background:diff===d?'linear-gradient(135deg,'+PINK+','+BLUE_C+')':'transparent',border:'1.5px solid '+(diff===d?PINK:DIM),borderRadius:10,padding:'10px 0',color:diff===d?'#fff':DIM,fontSize:12,fontFamily:"'Fira Code',monospace",cursor:'pointer',fontWeight:diff===d?700:400}},
              d==='easy'?'EASY':d==='hard'?'HARD':'NORMAL')
          )
        )

      h('button',{onClick:()=>onStart(diff),style:{width:'100%',background:'linear-gradient(135deg,#6020a0,#a040c0)',border:'none',borderRadius:14,padding:'16px 0',color:'#fff',fontSize:20,fontFamily:"'Playfair Display',serif",fontWeight:900,cursor:'pointer',letterSpacing:2}},'🎮 ゲームスタート'),

        h('button',{onClick:toggleMusic,style:{background:'transparent',border:'1.5px solid '+DIM,borderRadius:12,padding:'10px 14px',color:DIM,fontSize:14,fontFamily:"'Fira Code',monospace",cursor:'pointer'}},musicOn?'🎵':'🔇')
      )

// ── GameEndScreen ──

// ── App ──
function App(){
  const[phase,setPhase]=useState('menu');
  const phaseR=useRef('menu');
  const[pH,setPH]=useState([]);
  const[dH,setDH]=useState([]);
  const[field,setField]=useState([]);
  const[fieldColors,setFieldColors]=useState([]);
  const[fieldSum,setFieldSum]=useState(0);
  const[pPt,setPPt]=useState(0);
  const[dPt,setDPt]=useState(0);
  const[rNum,setRNum]=useState(1);
  const[timeLeft,setTimeLeft]=useState(10);
  const[countNum,setCountNum]=useState(5);
  const[flashMsg,setFlashMsg]=useState(null);
  const[burstAnim,setBurstAnim]=useState(false);
  const[resetFA,setResetFA]=useState(false);
  const[comboShow,setComboShow]=useState(null);
  const[gameEndData,setGameEndData]=useState(null);
  const[musicEnabled,setMusicEnabled]=useState(false);
  const musicEnabledR=useRef(false);
  const[difficulty,setDifficulty]=useState('normal');
  const diffRef=useRef('normal');
  const fieldAreaRef=useRef(null);

  const pHR=useRef([]),dHR=useRef([]);
  const fieldR=useRef([]),fieldSumR=useRef(0);
  const pPtR=useRef(0),dPtR=useRef(0);
  const countNumR=useRef(5),lockR=useRef(false);
  const timerRef=useRef(null),aiRef=useRef(null),countRef=useRef(null);
  const aiFirstFastRef=useRef(false);

  useEffect(()=>{diffRef.current=difficulty;},[difficulty]);
  useEffect(()=>()=>clearTimers(),[]);

  function clearTimers(){clearInterval(timerRef.current);clearTimeout(aiRef.current);clearTimeout(countRef.current);}
  function toggleMusic(){
    if(musicEnabledR.current){stopBGM();musicEnabledR.current=false;setMusicEnabled(false);}
    else{musicEnabledR.current=true;setMusicEnabled(true);resumeAC();if(phaseR.current==='playing')startBGM();}
  }

  function startGame(diff){
    if(diff){setDifficulty(diff);diffRef.current=diff;}
    clearTimers();lockR.current=false;
    const p=createDeck(),d=createDeck();
    setPH(p);setDH(d);pHR.current=p;dHR.current=d;
    setPPt(0);setDPt(0);pPtR.current=0;dPtR.current=0;
    setRNum(1);setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;setFieldColors([]);
    setFlashMsg(null);setBurstAnim(false);setResetFA(false);setGameEndData(null);
    if(musicEnabledR.current)startBGM();
    doCountdown(p,d,0,0,1);
  }

  function doCountdown(pHand,dHand,pp,dp,rn){
    setPhase('playing');phaseR.current='playing';
    setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;setFieldColors([]);
    setFlashMsg(null);setTimeLeft(10);
    let c=5;setCountNum(c);countNumR.current=c;
    function tick(){
      setCountNum(c);countNumR.current=c;
      if(c===0){
        try{resumeAC();const t=AC.currentTime;
          [[523,0,0.08],[659,0.09,0.08],[784,0.18,0.08],[1047,0.27,0.25]].forEach(([f,d,dur])=>{
            const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
            g.gain.setValueAtTime(0.2,t+d);g.gain.exponentialRampToValueAtTime(0.001,t+d+dur);
            o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+dur+0.02);
          });
        }catch(e){}
        setTimeout(()=>{
          setCountNum(-1);countNumR.current=-1;
          aiFirstFastRef.current=Math.random()<0.90;
          startTimer(rn);
          if(Math.random()<0.50){lockR.current=true;scheduleAi(rn,120);setTimeout(()=>{lockR.current=false;},400);}
          else{lockR.current=false;scheduleAi(rn,120);}
        },650);
        return;
      }
      c--;countRef.current=setTimeout(tick,650);
    }
    tick();
  }

  function startTimer(rn){
    clearInterval(timerRef.current);
    let t=10;setTimeLeft(t);
    timerRef.current=setInterval(()=>{
      t--;setTimeLeft(t);
      if(t<=0){clearInterval(timerRef.current);clearTimeout(aiRef.current);doTimeUp(rn);}
    },1000);
  }

  function doTimeUp(rn){
    resumeAC();playMissSE();
    setFlashMsg({text:'⏱ 時間切れ！引き分け（±0pt）',color:DIM});
    const newP=createDeck(),newD=createDeck();
    setPH(newP);setDH(newD);pHR.current=newP;dHR.current=newD;
    setTimeout(()=>{
      setFlashMsg(null);
      const pp=pPtR.current,dp=dPtR.current;
      if(pp>=WIN_PT||dp>=WIN_PT){endGame(pp,dp);return;}
      const nr=rn+1;setRNum(nr);doCountdown(newP,newD,pp,dp,nr);
    },1600);
  }

  function scheduleAi(rn,delay=null){
    clearTimeout(aiRef.current);
    let d;
    if(delay!==null){d=delay;}
    else{
      const cf=fieldR.current,cs=fieldSumR.current,fl=cf.length;
      const canWin=dHR.current.some(v=>canPlay(v,cs,cf)&&cs+v===10);
      const diff=diffRef.current;
      if(canWin)d=diff==='easy'?600+Math.random()*800:diff==='hard'?50+Math.random()*100:100+Math.random()*200;
      else if(fl===0){if(diff==='easy')d=800+Math.random()*800;else if(diff==='hard')d=150+Math.random()*200;else d=aiFirstFastRef.current?300+Math.random()*300:1200+Math.random()*800;}
      else if(fl===1)d=diff==='easy'?1000+Math.random()*600:diff==='hard'?400+Math.random()*200:1000+Math.random()*400;
      else d=diff==='easy'?1200+Math.random()*800:diff==='hard'?600+Math.random()*300:1500+Math.random()*500;
    }
    aiRef.current=setTimeout(()=>{if(phaseR.current==='playing'&&countNumR.current<0)aiPlay(rn);},d);
  }

  function aiPlay(rn){
    const dHand=dHR.current,cf=fieldR.current,cs=fieldSumR.current;
    if(!dHand.length)return;
    const playable=dHand.filter(v=>canPlay(v,cs,cf));
    if(!playable.length){scheduleAi(rn);return;}
    const wins=playable.filter(v=>cs+v===10);
    const safe=playable.filter(v=>cs+v<10);
    const diff=diffRef.current;
    const winRate  =diff==='easy'?0.60:diff==='hard'?0.97:0.85;
    const safeRate5=diff==='easy'?0.25:diff==='hard'?0.60:0.35;
    const safeBase =diff==='easy'?0.35:diff==='hard'?0.70:0.40;
    const safeCap  =diff==='easy'?0.50:diff==='hard'?0.90:0.65;
    const firstRate=diff==='easy'?0.45:diff==='hard'?0.80:0.55;
    let chosen=null;
    if(wins.length&&Math.random()<winRate)chosen=wins.reduce((b,v)=>calcPts([...cf,v]).total>calcPts([...cf,b]).total?v:b,wins[0]);
    else if(cs>=8){if(diff==='hard'&&Math.random()<0.15&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else if(cs>=5){if(Math.random()<safeRate5&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else if(cs>=1){if(Math.random()<Math.min(safeBase+cf.length*0.08,safeCap)&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else{if(Math.random()<firstRate&&safe.length)chosen=safe.sort((a,b)=>a-b)[0];}
    if(!chosen){scheduleAi(rn);return;}
    resumeAC();playTapSE();
    const idx=dHand.indexOf(chosen);
    const newDH=dHand.filter((_,i)=>i!==idx);
    setDH(newDH);dHR.current=newDH;
    if(!newDH.length){const nd=createDeck();setDH(nd);dHR.current=nd;}
    if(!resolvePlay(chosen,cf,cs,'dealer',rn))scheduleAi(rn);
  }

  function playCard(idx){
    if(phaseR.current!=='playing'||countNumR.current>=0||lockR.current)return;
    const value=pH[idx];
    if(!value||!canPlay(value,fieldSum,field))return;
    clearTimeout(aiRef.current);resumeAC();playTapSE();
    const newPH=pH.map((v,i)=>i===idx?null:v);
    setPH(newPH);pHR.current=newPH;
    if(!newPH.filter(Boolean).length){const nd=createDeck();setTimeout(()=>{setPH(nd);pHR.current=nd;},100);}
    if(!resolvePlay(value,field,fieldSum,'player',rNum)){clearTimeout(aiRef.current);scheduleAi(rNum);}
  }

  function resolvePlay(value,curField,curSum,who,rn){
    const nf=[...curField,value],ns=curSum+value;
    setField(nf);setFieldSum(ns);fieldR.current=nf;fieldSumR.current=ns;
    setFieldColors(prev=>[...prev,who]);
    if(ns>10){
      clearTimers();lockR.current=true;playBurstSE();setBurstAnim(true);
      const newPP=who==='player'?Math.max(0,pPtR.current-2):pPtR.current;
      const newDP=who==='dealer'?Math.max(0,dPtR.current-2):dPtR.current;
      setPPt(newPP);setDPt(newDP);pPtR.current=newPP;dPtR.current=newDP;
      setFlashMsg({text:who==='player'?'💥 バースト！あなた-2pt':'💥 ディーラーバースト！',color:who==='player'?PINK:RED_C,who});
      setTimeout(()=>{setBurstAnim(false);resetField();if(newPP>=WIN_PT||newDP>=WIN_PT){endGame(newPP,newDP);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,newPP,newDP,nr);},1000);
      return true;
    }
    if(ns===10){
      clearTimers();lockR.current=true;
      const pts=calcPts(nf);
      const newPP=who==='player'?pPtR.current+pts.total:pPtR.current;
      const newDP=who==='dealer'?dPtR.current+pts.total:dPtR.current;
      setPPt(newPP);setDPt(newDP);pPtR.current=newPP;dPtR.current=newDP;
      playComboSfx(pts.voice||'ノーボーナス');
      setResetFA(true);
      const color=who==='player'?PINK:RED_C;
      setComboShow({text:pts.voice||'10達成！',pts:pts.total,color});
      setFlashMsg({text:(who==='player'?'🙋 YOU +':'💀 DEALER +')+pts.total+'pt　'+pts.label,color,who});
      setTimeout(()=>setComboShow(null),1200);
      setTimeout(()=>{setResetFA(false);resetField();if(newPP>=WIN_PT||newDP>=WIN_PT){endGame(newPP,newDP);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,newPP,newDP,nr);},1400);
      return true;
    }
    if(nf.length>=4){
      clearTimers();lockR.current=true;setResetFA(true);
      setFlashMsg({text:'4枚！強制リセット',color:DIM});
      setTimeout(()=>{setResetFA(false);resetField();const pp=pPtR.current,dp=dPtR.current;if(pp>=WIN_PT||dp>=WIN_PT){endGame(pp,dp);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,pp,dp,nr);},900);
      return true;
    }
    return false;
  }

  function resetField(){setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;setFieldColors([]);}
  function endGame(pp,dp){stopBGM();setGameEndData({pPt:pp,dPt:dp,winner:pp>=WIN_PT?'player':'dealer',diff:diffRef.current});setPhase('gameEnd');}
  function goHome(){clearTimers();stopBGM();setPhase('menu');}

  if(phase==='menu')return h(MenuScreen,{onStart:startGame,musicOn:musicEnabled,toggleMusic});
  if(phase==='gameEnd'&&gameEndData)return h(GameEndScreen,{data:gameEndData,onRestart:startGame,onHome:goHome});

  // ── ゲーム画面 ──
  const isCardOff=(v)=>countNum>=0||timeLeft<=0||!canPlay(v,fieldSum,field);
  return h('div',{style:{position:'fixed',inset:0,background:'linear-gradient(180deg,#3a1a6e 0%,#6040a0 40%,#9060b8 70%,#c070c0 100%)',fontFamily:"'Playfair Display',serif",overflow:'hidden'}},
    h('div',{style:{position:'fixed',inset:0,pointerEvents:'none',backgroundImage:'repeating-linear-gradient(0deg,#00d4ff0a 0,#00d4ff0a 1px,transparent 1px,transparent 20px),repeating-linear-gradient(90deg,#00d4ff0a 0,#00d4ff0a 1px,transparent 1px,transparent 20px)'}}),
    countNum>=0&&h('div',{style:{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',background:'#2a103066',pointerEvents:'all'}},
      h('div',{key:countNum,style:{fontSize:countNum===0?96:120,fontWeight:900,color:countNum===0?'#50e080':'#fff',animation:'countDown 0.65s ease both',textShadow:countNum===0?'0 0 60px #50e080':'0 0 30px #fff'}},countNum===0?'GO!!':countNum)
    ),
    flashMsg&&h('div',{style:{position:'fixed',inset:0,zIndex:150,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}},
      h('div',{style:{background:flashMsg.who==='player'?'#00203088':'#3a001088',backdropFilter:'blur(8px)',borderRadius:14,padding:'14px 26px',fontSize:18,fontWeight:900,color:flashMsg.who==='player'?'#00d4ff':'#ff2d6e',boxShadow:'0 4px 32px '+(flashMsg.who==='player'?'#00d4ff55':'#ff2d6e55'),border:'2px solid '+(flashMsg.who==='player'?'#00d4ff':'#ff2d6e'),animation:'slideIn 0.2s ease',maxWidth:'88vw',textAlign:'center'}},flashMsg.text)
    ),
    comboShow&&h('div',{style:{position:'fixed',inset:0,zIndex:170,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}},
      h('div',{style:{textAlign:'center',animation:'comboPop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards'}},
        h('div',{style:{fontSize:comboShow.pts>=5?60:52,fontWeight:900,color:comboShow.color,textShadow:'0 0 30px '+comboShow.color,lineHeight:1,letterSpacing:2}},comboShow.text),
        h('div',{style:{fontSize:comboShow.pts>=5?40:32,fontWeight:900,color:'#fff',textShadow:'0 0 20px '+comboShow.color,marginTop:4,animation:'comboOut 0.8s 0.4s ease forwards'}},'+'+comboShow.pts+'pt')
      )
    ),
    // ── 上部エリア ──
    h('div',{style:{position:'fixed',top:0,left:0,right:0,zIndex:10,padding:'48px 12px 0'}},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}},
        h('div',{style:{background:timeLeft<=5?RED_C:PANEL,border:'1px solid '+(timeLeft<=5?RED_C:BORDER),borderRadius:10,padding:'4px 10px',textAlign:'center',minWidth:54,transition:'background 0.3s',animation:timeLeft<=5&&timeLeft>0?'pulse 0.5s infinite':'none'}},
          h('div',{style:{fontSize:8,color:timeLeft<=5?'#fff':DIM,fontFamily:"'Fira Code',monospace"}},'TIME'),
          h('div',{style:{fontSize:24,fontWeight:900,color:timeLeft<=5?'#fff':TEXT,lineHeight:1.1}},timeLeft)
        ),
        h('div',{style:{display:'flex',gap:10,alignItems:'center'}},
          h('div',{style:{textAlign:'center'}},h('div',{style:{fontSize:9,color:DIM,fontFamily:"'Fira Code',monospace"}},'YOU'),h('div',{style:{fontSize:22,fontWeight:900,color:PINK}},pPt+'pt')),
          h('div',{style:{textAlign:'center'}},
            h('div',{style:{fontSize:10,color:DIM,fontFamily:"'Fira Code',monospace"}},'R'+rNum),
            h('div',{style:{fontSize:8,color:difficulty==='easy'?'#00ff88':difficulty==='hard'?RED_C:BLUE_C,fontFamily:"'Fira Code',monospace",fontWeight:700}},difficulty==='easy'?'EASY':difficulty==='hard'?'HARD':'NORMAL')
          ),
          h('div',{style:{textAlign:'center'}},h('div',{style:{fontSize:9,color:DIM,fontFamily:"'Fira Code',monospace"}},'DEALER'),h('div',{style:{fontSize:22,fontWeight:900,color:RED_C}},dPt+'pt'))
        ),
        h('div',{style:{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end'}},
          h('div',{style:{background:PANEL,border:'1px solid '+BORDER,borderRadius:10,padding:'4px 8px',textAlign:'center'}},
            h('div',{style:{fontSize:8,color:DIM,fontFamily:"'Fira Code',monospace"}},'GOAL'),
            h('div',{style:{fontSize:16,fontWeight:900,color:'#ff9500'}},WIN_PT+'pt')
          ),
          h('div',{style:{display:'flex',gap:8}},
            h('button',{onClick:toggleMusic,style:{background:'transparent',border:'1.5px solid '+DIM,borderRadius:10,padding:'6px 12px',color:DIM,fontSize:16,cursor:'pointer'}},musicEnabled?'🎵':'🔇'),
            h('button',{onClick:goHome,style:{background:'transparent',border:'1.5px solid '+DIM,borderRadius:10,padding:'6px 10px',color:DIM,fontSize:13,fontFamily:"'Fira Code',monospace",cursor:'pointer'}},'🏠')
          )
        )
      ),
      h('div',{style:{background:PANEL,border:'1px solid '+BORDER,borderRadius:12,padding:'6px 10px',marginBottom:6}},
        h('div',{style:{fontSize:8,letterSpacing:3,color:DIM,fontFamily:"'Fira Code',monospace",marginBottom:4}},'💀 DEALER — '+dH.filter(Boolean).length+'枚'),
        h('div',{style:{display:'flex',gap:3,flexWrap:'wrap',justifyContent:'center'}},
          dH.slice(0,12).map((_,i)=>h('div',{key:i,style:{width:22,height:32,borderRadius:4,background:'linear-gradient(135deg,#3d0a0a,#200505)',border:'1px solid #801a1a33',flexShrink:0}}))
        )
      ),
      h('div',{ref:fieldAreaRef,style:{background:PANEL,border:'2px solid '+(fieldSum>=8?(fieldColors[fieldColors.length-1]==='player'?'#4da8ff':RED_C):fieldSum>=5?'#e08020':BORDER),borderRadius:14,padding:'10px',textAlign:'center',transition:'border-color 0.25s',marginBottom:6,animation:resetFA?'resetAnim 0.5s ease':burstAnim?'burst 0.5s ease':'none'}},
        h('div',{style:{fontSize:8,letterSpacing:4,color:DIM,fontFamily:"'Fira Code',monospace",marginBottom:5}},'── 場 ──'),
        h('div',{style:{display:'flex',gap:5,justifyContent:'center',alignItems:'center',height:70}},
          [0,1,2,3].map(i=>field[i]?h(FieldCard,{key:i,value:field[i],by:fieldColors[i]||'player'}):h('div',{key:i,style:{width:50,height:70,flexShrink:0}}))
        ),
        h('div',{style:{marginTop:5,height:36,display:'flex',alignItems:'center',justifyContent:'center',gap:8,visibility:fieldSum>0?'visible':'hidden'}},
          h('span',{style:{fontSize:28,fontWeight:900,color:fieldSum>=8?(fieldColors[fieldColors.length-1]==='player'?'#4da8ff':RED_C):fieldSum>=5?'#e08020':TEXT,transition:'color 0.25s'}},fieldSum),
          h('span',{style:{fontSize:11,color:DIM,fontFamily:"'Fira Code',monospace"}},'/ 10　あと'+(10-fieldSum))
        )
      )
    ),
    // ── 手札エリア ──
    h('div',{style:{position:'fixed',top:'48vh',left:0,right:0,zIndex:50,background:PANEL,borderTop:'1.5px solid '+BORDER,padding:'8px 12px 12px',boxShadow:'0 -4px 16px #0001'}},
      h('div',{style:{fontSize:8,letterSpacing:3,color:DIM,fontFamily:"'Fira Code',monospace",marginBottom:5}},'YOU — '+pH.filter(Boolean).length+'枚'),
      h('div',{style:{display:'flex',gap:4,justifyContent:'center',marginBottom:4,flexWrap:'wrap'}},
        pH.slice(0,5).map((v,i)=>v===null?h('div',{key:i,style:{width:50,height:70,flexShrink:0}}):h(SlideCard,{key:'c'+i+'_'+v,value:v,onPlay:()=>playCard(i),disabled:isCardOff(v),cardRole:'player',fieldBottom:fieldAreaRef.current?fieldAreaRef.current.getBoundingClientRect().bottom:null}))
      ),
      h('div',{style:{display:'flex',gap:4,justifyContent:'center',flexWrap:'wrap'}},
        pH.slice(5).map((v,i)=>v===null?h('div',{key:i+5,style:{width:50,height:70,flexShrink:0}}):h(SlideCard,{key:'c'+(i+5)+'_'+v,value:v,onPlay:()=>playCard(i+5),disabled:isCardOff(v),cardRole:'player',fieldBottom:fieldAreaRef.current?fieldAreaRef.current.getBoundingClientRect().bottom:null}))
      )
    ),
    // ── 役一覧（下部）──
    h('div',{style:{position:'fixed',bottom:0,left:0,right:0,zIndex:49,padding:'4px 12px 6px',display:'flex',gap:5,flexWrap:'wrap',justifyContent:'center'}},
      [['ストレート','5pt'],['スリーカード','4pt'],['ツーペア','3pt'],['ワンペア','2pt'],['バースト','自身-2pt']].map(([k,v])=>
        h('div',{key:k,style:{fontSize:9,color:DIM,fontFamily:"'Fira Code',monospace",background:'#ffffff22',borderRadius:4,padding:'2px 5px',whiteSpace:'nowrap'}},
          h('span',{style:{color:PINK,fontWeight:700}},k),':',v)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
