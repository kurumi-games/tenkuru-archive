<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>テンクル (TEN-KURU)</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(180deg,#0a0020 0%,#12002e 40%,#180040 70%,#1a0035 100%);min-height:100dvh;overflow:hidden;position:fixed;width:100%;height:100dvh;touch-action:none;}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Playfair+Display:wght@400;700;900&family=Fira+Code:wght@400;600&display=swap');
@keyframes dealIn{0%{opacity:0;transform:translateY(-20px) scale(0.75) rotate(-6deg);}60%{transform:translateY(3px) scale(1.06) rotate(1deg);}100%{opacity:1;transform:none;}}
@keyframes cardGlow{0%,100%{box-shadow:0 2px 8px #0006,0 0 0px transparent}50%{box-shadow:0 4px 16px #0008,0 0 18px currentColor}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
@keyframes burst{0%{transform:scale(1)}40%{transform:scale(1.3);opacity:0.7}100%{transform:scale(0.8);opacity:0}}
@keyframes resetAnim{0%{transform:scale(1)}40%{transform:scale(1.08);filter:brightness(1.3)}100%{transform:scale(1);filter:none}}
@keyframes countDown{0%{transform:scale(0.4);opacity:0}40%{transform:scale(1.2);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(0.8);opacity:0}}
@keyframes slideIn{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@keyframes comboPop{0%{transform:scale(0.3) rotate(-8deg);opacity:0}50%{transform:scale(1.25) rotate(3deg);opacity:1}70%{transform:scale(0.95) rotate(-1deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes comboOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4) translateY(-30px)}}
@keyframes cyberIn{0%{transform:scale(0.2) skewX(20deg);opacity:0;filter:blur(12px)}40%{transform:scale(1.3) skewX(-4deg);opacity:1;filter:blur(0)}70%{transform:scale(0.97) skewX(1deg)}100%{transform:scale(1) skewX(0);opacity:1;filter:none}}
@keyframes cyberOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.6) translateY(-40px);filter:blur(8px)}}
@keyframes glitchShift{0%,100%{clip-path:inset(0 0 100% 0)}10%{clip-path:inset(10% 0 60% 0);transform:translateX(-4px)}20%{clip-path:inset(30% 0 40% 0);transform:translateX(4px)}30%{clip-path:inset(50% 0 20% 0);transform:translateX(-2px)}40%{clip-path:inset(70% 0 5% 0);transform:translateX(2px)}50%{clip-path:inset(0 0 0 0);transform:none}}
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
@keyframes chromaRed{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,1px)}}
@keyframes chromaBlue{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-1px)}}
@keyframes ringExpand{0%{transform:translate(-50%,-50%) scale(0);opacity:0.9}100%{transform:translate(-50%,-50%) scale(3.5);opacity:0}}
@keyframes ringExpand2{0%{transform:translate(-50%,-50%) scale(0);opacity:0.7}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}
@keyframes ptFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-80px) scale(1.4);opacity:0}}
@keyframes hexSpin{0%{transform:translate(-50%,-50%) rotate(0deg) scale(0);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-50%) rotate(180deg) scale(2.5);opacity:0}}
@keyframes gridFlash{0%,100%{opacity:0}50%{opacity:0.25}}
@keyframes titleGlitch{0%,90%,100%{transform:none;filter:none}92%{transform:translateX(-3px);filter:hue-rotate(90deg)}94%{transform:translateX(3px);filter:hue-rotate(-90deg)}96%{transform:none;filter:none}98%{transform:translateX(-1px);filter:brightness(2)}}

/* ============================================
   CARD DESIGN
   ============================================ */
.card-stage{position:relative;display:inline-block;flex-shrink:0;width:var(--card-w);aspect-ratio:5/7;}
/* 陣営色：cyan=自分(青) / magenta=相手(オレンジ)。GPT生成の発光カード画像を使用 */
.card-stage.cyan{--ac:#2e7fe8;--rgb:46,127,232;--cardimg:url('img/card-cyan.webp');}
.card-stage.magenta{--ac:#f5912a;--rgb:245,145,42;--cardimg:url('img/card-magenta.webp');}
/* 数字は墨色（瞬間的に読みやすく）。色分けは廃止 */
.card-stage.n1,.card-stage.n2,.card-stage.n3,.card-stage.n4,.card-stage.n5{--nc:#263240;}

.card-stage .card{
  position:relative;
  width:100%;height:100%;
  overflow:visible;
  z-index:1;
  background:var(--cardimg) center/contain no-repeat;
  border:none;
  box-shadow:none;
}
.card-stage .card::before{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
}
.card-stage .card::after{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;
}
/* 旧・下辺帯は不使用（カード地が陣営色なので） */
.card-stage .bottom-glow{
  position:absolute;
  bottom:0;left:0;right:0;
  background:transparent;
  pointer-events:none;
  z-index:5;
  display:none;
}
.card-stage .center-pattern{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:3;
  opacity:0;
}
.card-stage .cp-star{fill:transparent;}
.card-stage .card-overlay{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:4;
  overflow:visible;
  opacity:0;
}
.card-stage .fr-white{stroke:transparent;fill:none;}
.card-stage .fr-cyan{
  stroke:transparent;
  fill:none;
}
.card-stage .ext-bottom-line{
  position:absolute;
  background:transparent;
  pointer-events:none;
  z-index:5;
  display:none;
}
.card-stage .n-big{
  position:absolute;
  inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Outfit','Inter',sans-serif;
  font-weight:900;
  color:var(--nc);
  line-height:1;
  z-index:6;
  pointer-events:none;
  text-shadow:none;
}
.card-stage .n-tl,.card-stage .n-br{
  position:absolute;
  font-family:'Outfit','Inter',sans-serif;
  font-weight:800;
  color:var(--nc);
  z-index:6;
  pointer-events:none;
  opacity:.6;
}
.card-stage .n-br{transform:rotate(180deg);}

/* ★ User-customizable layout (set by HUD edit mode) */
:root{
  --user-hand-w:53;
  --user-hand-y:0;
  --user-field-w:62;
  --user-sum-size:40;
  --user-sum-x:0;
  --user-sum-y:6;
  --user-gap-df:10;
  --user-gap-fh:38;
}

/* HAND cards: width customizable via --user-hand-w */
.hand-card-area{--card-w:calc(var(--user-hand-w) * var(--u));}

/* FIELD cards: width customizable via --user-field-w */
.field-card-area{--card-w:calc(var(--user-field-w) * var(--u));}

/* Card internal proportions — calibrated for 84×118, work for any --card-w */
.card-stage .card{border-radius:calc(var(--card-w) * 0.083);}
.card-stage .bottom-glow{height:calc(var(--card-w) * 0.08);border-radius:0 0 calc(var(--card-w) * 0.083) calc(var(--card-w) * 0.083);}
.card-stage .ext-bottom-line{
  bottom:calc(var(--card-w) * -0.024);
  left:calc(var(--card-w) * 0.083);
  right:calc(var(--card-w) * 0.083);
  height:calc(var(--card-w) * 0.014);
  border-radius:calc(var(--card-w) * 0.008);
  box-shadow:none;
}
.card-stage .n-big{
  font-size:calc(var(--card-w) * 0.56);
  letter-spacing:calc(var(--card-w) * -0.018);
  transform:translateY(calc(var(--card-w) * -0.024));
}
.card-stage .n-tl,.card-stage .n-br{font-size:calc(var(--card-w) * 0.143);}
.card-stage .n-tl{top:calc(var(--card-w) * 0.107);left:calc(var(--card-w) * 0.107);}
.card-stage .n-br{bottom:calc(var(--card-w) * 0.107);right:calc(var(--card-w) * 0.107);}

/* 場の状態：通常は控えめ（白カードは元から見える） */
.card-stage.field .fr-cyan{filter:none;}

/* 10完成状態：決定打の1枚が陣営色で強く光る（白カードが浮き上がる） */
.card-stage.complete .card{
  border:1.5px solid var(--ac);
  box-shadow:
    0 0 4px var(--ac),
    0 0 12px rgba(var(--rgb),.5),
    0 0 24px rgba(var(--rgb),.22),
    0 calc(var(--card-w) * 0.05) calc(var(--card-w) * 0.12) rgba(40,60,90,.22);
  transform:scale(1.08) translateY(calc(var(--card-w) * -0.04));
}
.card-stage.complete .fr-cyan{filter:none;}
.card-stage .plasma{
  position:absolute;
  inset:-14px;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(ellipse 80% 80% at 50% 50%, rgba(var(--rgb),.14) 0%, transparent 72%);
  filter:blur(2px);
}

/* ============================================
   GAMEPLAY SCREEN LAYOUT (v8 — 360 base, width+height safety scale)
   ============================================ */
.gp-screen{
  --u:min(calc(100vw / 360), calc(100dvh / 640));
  position:fixed;inset:0;
  width:100vw;height:100dvh;
  /* 明るい曲面ステージ背景（画像）。cover+centerでiPad等でも破綻しない */
  background-image:url('img/bg.jpg');
  background-size:cover;
  background-position:center;
  background-color:#dfe6e6;
  display:flex;flex-direction:column;
  padding:max(env(safe-area-inset-top,0px),calc(14 * var(--u))) calc(12 * var(--u)) max(env(safe-area-inset-bottom,0px),calc(106 * var(--u)));
  border-radius:0;border:none;box-shadow:none;
  overflow:hidden;
}
.gp-screen::before{content:none;}
.gp-screen::after{content:none;}
@keyframes roomBreath{0%,100%{opacity:.4;}50%{opacity:.9;}}
.gp-screen > *{flex-shrink:0;position:relative;z-index:1;}
.gp-spacer{flex:0;min-height:calc(var(--user-gap-df) * var(--u));}
/* field→hand: user-gap-fh */
.gp-field-area + .gp-spacer{flex:0;min-height:calc(var(--user-gap-fh) * var(--u));}
/* below hand: zero — gp-screen padding-bottom handles it */
.gp-hand-area + .gp-spacer{flex:0;min-height:0;}

/* === TOP HUD === */
.gp-top-bar{
  display:flex;align-items:center;
  gap:calc(6 * var(--u));
  padding:calc(9 * var(--u)) calc(10 * var(--u));
  background:rgba(15,12,30,.4);
  border:1px solid rgba(255,255,255,.07);
  border-radius:calc(22 * var(--u));
  box-shadow:
    inset 0 1px 0 rgba(160,180,230,.14),
    0 calc(12 * var(--u)) calc(28 * var(--u)) rgba(0,0,0,.3);
  backdrop-filter:blur(22px) saturate(120%);-webkit-backdrop-filter:blur(22px) saturate(120%);
  position:relative;z-index:3;
}

/* TIME box: 黒ガラス + 発光する紫の数字 */
.gp-time-box{
  background:rgba(20,15,35,.45);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:
    inset 0 1px 0 rgba(160,140,255,.15),
    0 calc(6 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.4);
  border-radius:calc(13 * var(--u));
  padding:calc(7 * var(--u)) 0 calc(8 * var(--u));
  width:calc(48 * var(--u));
  text-align:center;flex-shrink:0;
  transition:all 0.3s;
}
.gp-time-box.urgent{background:rgba(60,15,30,.85);border-color:#ff2d6e;animation:pulse 0.5s infinite;}
.gp-time-box .lbl{font-size:calc(9 * var(--u));letter-spacing:calc(1.7 * var(--u));font-weight:700;color:#a8a4c0;line-height:1;}
.gp-time-box.urgent .lbl{color:#ff5b85;}
.gp-time-box .val{font-size:calc(26 * var(--u));font-weight:600;color:#b89aff;text-shadow:0 0 calc(8 * var(--u)) rgba(160,130,255,.5);letter-spacing:calc(-1 * var(--u));line-height:.95;margin-top:calc(3 * var(--u));font-family:'Inter',sans-serif;}
.gp-time-box.urgent .val{color:#ff5b85;text-shadow:0 0 calc(8 * var(--u)) rgba(255,45,110,.6);}

/* Scores: big number + "あと <b>Xpt</b>" subtitle */
.gp-score{text-align:center;flex:1;min-width:0;}
.gp-score .lbl{font-size:calc(9 * var(--u));letter-spacing:calc(1.7 * var(--u));font-weight:700;line-height:1;margin-bottom:calc(3 * var(--u));}
.gp-score .val{font-size:calc(26 * var(--u));font-weight:600;letter-spacing:calc(-.5 * var(--u));line-height:.95;font-family:'Inter',sans-serif;}
.gp-score .sub{font-size:calc(9 * var(--u));font-weight:500;color:rgba(225,225,240,.72);letter-spacing:calc(.3 * var(--u));line-height:1;margin-top:calc(5 * var(--u));}
.gp-score .sub b{font-weight:700;}
.gp-score.you .lbl,.gp-score.you .val,.gp-score.you .sub b{color:#2ccadf;text-shadow:0 0 calc(10 * var(--u)) rgba(44,202,223,.5);}
.gp-score.dealer .lbl,.gp-score.dealer .val,.gp-score.dealer .sub b{color:#f06ba8;text-shadow:0 0 calc(10 * var(--u)) rgba(240,107,168,.5);}

/* R-pill: 黒ガラス + 発光するピンクR + オレンジlevel */
.gp-round-pill{
  background:rgba(20,15,35,.45);
  border:1px solid rgba(255,255,255,.09);
  border-radius:999px;
  padding:calc(7 * var(--u)) calc(13 * var(--u));
  display:flex;align-items:center;gap:calc(6 * var(--u));
  box-shadow:
    inset 0 1px 0 rgba(160,140,255,.15),
    0 calc(6 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.35);
  flex-shrink:0;
  font-family:'Inter',sans-serif;
}
.gp-round-pill .r{font-size:calc(17 * var(--u));font-weight:700;color:#f06ba8;text-shadow:0 0 calc(6 * var(--u)) rgba(240,107,168,.5);letter-spacing:calc(-.3 * var(--u));line-height:1;}
.gp-round-pill .lvl{font-size:calc(9 * var(--u));font-weight:700;letter-spacing:calc(1.2 * var(--u));line-height:1;}
.gp-round-pill.easy .lvl{color:#3ad98a;text-shadow:0 0 calc(6 * var(--u)) rgba(58,217,138,.4);}
.gp-round-pill.normal .lvl{color:#f7ad6a;text-shadow:0 0 calc(6 * var(--u)) rgba(247,173,106,.4);}
.gp-round-pill.hard .lvl{color:#ff5b85;text-shadow:0 0 calc(6 * var(--u)) rgba(255,91,133,.4);}

/* HOME button: 黒ガラスの角丸スクエア */
.gp-icon-btn{
  width:calc(40 * var(--u));height:calc(40 * var(--u));
  background:rgba(20,15,35,.45);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:
    inset 0 1px 0 rgba(160,140,255,.12),
    0 calc(6 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.35);
  border-radius:calc(12 * var(--u));
  display:flex;align-items:center;justify-content:center;
  font-size:calc(18 * var(--u));color:#c0bcd5;
  cursor:pointer;flex-shrink:0;
}

/* TRACK button: 黒ガラスの円形 + 回転する破線枠 */
.gp-track-btn{
  position:relative;
  width:calc(40 * var(--u));height:calc(40 * var(--u));
  background:rgba(20,15,35,.45);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:
    inset 0 1px 0 rgba(160,140,255,.12),
    0 calc(6 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.35);
  border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.gp-track-btn::before{
  content:"";position:absolute;inset:calc(4 * var(--u));
  border-radius:50%;
  border:2px dashed rgba(160,140,255,.55);
  animation:trackRotate 8s linear infinite;
}
.gp-track-btn .num{
  position:relative;
  font-size:calc(13 * var(--u));
  font-weight:600;
  color:#c0bcd5;
  letter-spacing:calc(-.3 * var(--u));
  z-index:1;
  font-family:'Inter',sans-serif;
}
@keyframes trackRotate{
  to{transform:rotate(360deg);}
}

.gp-dealer-area{
  background:rgba(15,12,30,.35);
  border:1px solid rgba(255,255,255,.07);
  border-radius:calc(24 * var(--u));
  padding:calc(11 * var(--u)) calc(14 * var(--u)) calc(13 * var(--u));
  margin-top:calc(6 * var(--u));
  box-shadow:
    inset 0 1px 0 rgba(160,180,230,.1),
    0 calc(10 * var(--u)) calc(24 * var(--u)) rgba(0,0,0,.3);
  backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);
}
.gp-area-label{font-size:calc(10 * var(--u));letter-spacing:calc(2.2 * var(--u));color:rgba(225,225,240,.75);font-weight:700;margin-bottom:calc(9 * var(--u));display:flex;align-items:center;gap:calc(6 * var(--u));font-family:'Inter',sans-serif;}
.gp-dealer-cards{display:flex;gap:calc(3 * var(--u));justify-content:center;flex-wrap:nowrap;}
.gp-dealer-card{
  width:calc(26 * var(--u));aspect-ratio:5/7;border-radius:calc(5 * var(--u));
  background:linear-gradient(165deg, #f5912a 0%, #c4600f 100%);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    0 calc(5 * var(--u)) calc(10 * var(--u)) rgba(120,70,20,.22);
  flex-shrink:0;
}

.gp-field-area{
  position:relative;
  overflow:hidden;
  background:transparent;
  border:none;
  border-radius:calc(28 * var(--u));
  padding:calc(14 * var(--u)) calc(18 * var(--u));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(8 * var(--u));
  flex:1;min-height:calc(140 * var(--u));
  box-shadow:none;
  filter:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  transition:filter 0.25s;
}
/* HUD: faint concentric rings + repeating texture, inset from edges */
.gp-field-area::before{
  content:"";
  position:absolute;
  inset:8% 4%;
  pointer-events:none;
  z-index:0;
  opacity:.18;
  background:
    repeating-radial-gradient(circle at 50% 52%,
      rgba(160,140,255,.4) 0px,
      rgba(160,140,255,.4) 1px,
      transparent 2px,
      transparent calc(18 * var(--u))),
    radial-gradient(circle at 50% 52%,
      transparent 0 28%,
      rgba(160,140,255,.5) 29%,
      transparent 30%,
      transparent 42%,
      rgba(160,140,255,.35) 43%,
      transparent 44%,
      transparent 58%,
      rgba(160,140,255,.25) 59%,
      transparent 60%);
  animation:fieldBreath 10s ease-in-out infinite;
}
/* 微粒子 */
.gp-field-area::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.4;
  background:
    radial-gradient(circle at 16% 42%, rgba(180,170,255,.7) 0 1px, transparent 2px),
    radial-gradient(circle at 23% 56%, rgba(180,170,255,.5) 0 1px, transparent 2px),
    radial-gradient(circle at 72% 34%, rgba(180,170,255,.55) 0 1px, transparent 2px),
    radial-gradient(circle at 86% 62%, rgba(180,170,255,.48) 0 1px, transparent 2px),
    radial-gradient(circle at 38% 22%, rgba(180,170,255,.42) 0 1px, transparent 2px),
    radial-gradient(circle at 62% 78%, rgba(180,170,255,.38) 0 1px, transparent 2px),
    radial-gradient(circle at 50% 52%, rgba(120,90,200,.15), transparent 45%);
}
.gp-field-area > *{position:relative;z-index:1;}

@keyframes fieldBreath{
  0%,100% {opacity:.12;transform:scale(1);}
  50%     {opacity:.22;transform:scale(1.012);}
}

/* 右下の惑星アイコン (subtle Saturn-like line art) */
.field-planet{
  position:absolute;
  right:7%;
  bottom:9%;
  width:calc(50 * var(--u));
  height:calc(38 * var(--u));
  opacity:.40;
  pointer-events:none;
  z-index:1;
}
.field-planet::before{
  content:"";position:absolute;
  inset:calc(5 * var(--u)) calc(12 * var(--u));
  border:1.4px solid rgba(170,155,230,.55);
  border-radius:50%;
}
.field-planet::after{
  content:"";position:absolute;
  left:calc(2 * var(--u));right:calc(2 * var(--u));
  top:calc(18 * var(--u));
  height:1.4px;
  background:rgba(170,155,230,.55);
  border-radius:999px;
  transform:rotate(-18deg);
}

/* Customize mode: disable clip-path + allow handles outside */
.gp-screen.cust-mode .gp-field-area{
  clip-path:none;
  overflow:visible;
  filter:none;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.86),
    0 calc(12 * var(--u)) calc(28 * var(--u)) rgba(119,103,178,.12);
}

.gp-field-area.warn{
  filter:drop-shadow(0 0 calc(14 * var(--u)) rgba(255,159,28,.30)) drop-shadow(0 calc(12 * var(--u)) calc(28 * var(--u)) rgba(119,103,178,.12));
}

<script>
const WS_URL='wss://4peace-server-vw1ezw.fly.dev';
const h=React.createElement;
const{useState,useEffect,useRef,useCallback}=React;

// ── 定数 ──
const PANEL='#1a0a3a',BORDER='#4a2a8a';
const PINK='#00d4ff',PINK2='#80eeff',RED_C='#ff2d6e',BLUE_C='#ffaa00';
const TEXT='#ffffff',DIM='#e0d0ff';
const CC={1:'#c0003a',2:'#c05800',3:'#0068a0',4:'#6010b0',5:'#007a40'};
const WIN_PT=15;

// ── ゲームロジック ──
function createDeck(){
  const d=[];
  while(d.length<10){
    const v=Math.floor(Math.random()*5)+1;
    if(d.filter(x=>x===v).length<3)d.push(v);
  }
  return d.sort(()=>Math.random()-0.5);
}

function calcPts(cards){
  const s=[...cards].sort((a,b)=>a-b);
  if(cards.length===4&&s.join('')==='1234')return{total:5,label:'ストレート +5pt',voice:'ストレート'};
  if(cards.length===2&&s[0]===5&&s[1]===5)return{total:1,label:'役なし +1pt',voice:'役なし'};
  const freq={};
  cards.forEach(v=>{freq[v]=(freq[v]||0)+1;});
  const counts=Object.values(freq);
  if(counts.some(c=>c>=3))return{total:4,label:'スリーカード +4pt',voice:'スリーカード'};
  if(counts.filter(c=>c===2).length>=2)return{total:3,label:'ツーペア +3pt',voice:'ツーペア'};
  if(counts.some(c=>c===2))return{total:2,label:'ワンペア +2pt',voice:'ワンペア'};
  return{total:1,label:'役なし +1pt',voice:'役なし'};
}

function canPlay(v,fieldSum,field){
  if(field.filter(x=>x!==null).length>=4)return false;
  const filled=field.filter(x=>x!==null).length+1;
  const newSum=fieldSum+v;
  if(filled===3&&newSum<5)return false;
  if(filled===4&&newSum<10)return false;
  return true;
}

// ── BGM（3曲切り替え：1=Brass Blitz / 2=Grit Sprint / 3=Iron Lullaby / 0=ミュート）──
// GitHub Pagesのリポジトリ直下にmp3を置く前提（スペースは%20でエンコード）
const BGM_FILES={1:'Brass%20Blitz.mp3',2:'Grit%20Sprint.mp3',3:'Iron%20Lullaby.mp3'};
let bgmAudio=null,bgmPlayingTrack=0;
function stopBGM(){
  bgmPlayingTrack=0;
  if(bgmAudio){bgmAudio.pause();bgmAudio.currentTime=0;}
}
function startBGM(track){
  const t=BGM_FILES[track]?track:2;
  if(bgmPlayingTrack===t&&bgmAudio&&!bgmAudio.paused)return; // 同じ曲が再生中なら何もしない
  try{
    if(bgmAudio)bgmAudio.pause();
    bgmAudio=new Audio(BGM_FILES[t]);
    bgmAudio.loop=true;
    bgmAudio.volume=0.45;
    bgmPlayingTrack=t;
    bgmAudio.play().catch(()=>{});
  }catch(e){bgmPlayingTrack=0;}
}

// ── サーバー時刻同期 ──
// ping/pongで3回計測し平均オフセットを算出してからコールバックを呼ぶ
function syncServerTime(ws, offsetRef, callback) {
  let count = 0;
  const offsets = [];
  function doPing() {
    if (!ws || ws.readyState !== WebSocket.OPEN) { callback(); return; }
    ws.send(JSON.stringify({ type: 'ping', clientTime: Date.now() }));
  }
  const origOnMessage = ws.onmessage;
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'pong') {
        const rtt = Date.now() - msg.clientTime;
        offsets.push(msg.serverTime + (rtt / 2) - Date.now());
        count++;
        if (count < 3) { setTimeout(doPing, 50); }
        else {
          offsetRef.current = offsets.reduce((a, b) => a + b, 0) / offsets.length;
          ws.onmessage = origOnMessage;
          callback();
        }
        return;
      }
    } catch(e) {}
    if (origOnMessage) origOnMessage(e);
  };
  doPing();
}

// SE用AudioContext（BGMとは独立）
const AC=new(window.AudioContext||window.webkitAudioContext)();
function resumeAC(){if(AC.state==='suspended')AC.resume();}
// PC Chrome対策：最初のタッチ/クリックでACを即座に起動
document.addEventListener('pointerdown',()=>{resumeAC();},{once:true,capture:true});

// ==== 軽量星画像（SVGを1枚焼いてbackgroundで使い回す）====
// clip-path + drop-shadow をGPUに毎回計算させる代わりに、光のにじみ込みの星を画像化。
// ミドル端末(OPPO等)でのカクつき対策
const starImgCache={};
function starImg(core,glow){
  const k=core+'|'+glow;
  if(!starImgCache[k]){
    const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">'
      +'<defs><radialGradient id="g"><stop offset="0%" stop-color="'+glow+'" stop-opacity=".8"/><stop offset="55%" stop-color="'+glow+'" stop-opacity=".22"/><stop offset="100%" stop-color="'+glow+'" stop-opacity="0"/></radialGradient></defs>'
      +'<circle cx="20" cy="20" r="20" fill="url(#g)"/>'
      +'<path d="M20 5 L24.2 15.8 L35 20 L24.2 24.2 L20 35 L15.8 24.2 L5 20 L15.8 15.8 Z" fill="'+core+'"/>'
      +'</svg>';
    starImgCache[k]='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
  }
  return starImgCache[k];
}

// ==== 端末性能の自動判定（演出の軽量化）====
// 起動後1.8秒待ってから1秒間FPSを計測。低スペック端末では星の数を自動で間引く
let FX_QUALITY=1; // 1=フル / 0.7=中 / 0.4=軽量
(function(){
  setTimeout(()=>{
    let frames=0;
    const t0=performance.now();
    function loop(){
      frames++;
      if(performance.now()-t0<1000)requestAnimationFrame(loop);
      else FX_QUALITY=frames>=55?1:frames>=40?0.7:0.4;
    }
    requestAnimationFrame(loop);
  },1800);
})();

// ==== ホールリバーブ（幻想の残響・ver39）====
const FXCONV=AC.createConvolver();
(function(){
  const dur=2.4,len=Math.floor(AC.sampleRate*dur);
  const ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
  }
  FXCONV.buffer=ir;
})();
const FXWET=AC.createGain();FXWET.gain.value=0.6;
FXCONV.connect(FXWET);FXWET.connect(AC.destination);
// ドライ＋リバーブセンドの2系統出力
function fxOut(node,rev){
  node.connect(AC.destination);
  if(rev>0){const s=AC.createGain();s.gain.value=rev;node.connect(s);s.connect(FXCONV);}
}
function fxTone({f=440,f2=0,type='sine',v=0.15,a=0.005,d=0.3,t=0,det=0,rev=0.5}){
  try{
    const t0=AC.currentTime+t;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    if(det)o.detune.value=det;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(v,t0+a);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+a+d);
    o.connect(g);fxOut(g,rev);
    o.start(t0);o.stop(t0+a+d+0.05);
  }catch(e){}
}
function fxAir({v=0.06,a=0.01,d=0.2,t=0,hp=7000,rev=0.6}){
  try{
    const t0=AC.currentTime+t;
    const len=Math.max(1,Math.floor(AC.sampleRate*(a+d+0.05)));
    const buf=AC.createBuffer(1,len,AC.sampleRate);
    const dd=buf.getChannelData(0);
    for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
    const s=AC.createBufferSource(),fh=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=buf;fh.type='highpass';fh.frequency.value=hp;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(v,t0+a);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+a+d);
    s.connect(fh);fh.connect(g);fxOut(g,rev);
    s.start(t0);

// ── 10完成音の道具（osc/noise/sweep/reverb）──
function osc({freq=220,type='sine',vol=0.15,attack=0.01,decay=0.2,start=0,end=0,detune=0,curve='exp'}){
  try{
    const t=AC.currentTime+start;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=freq;if(detune)o.detune.value=detune;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+attack);
    if(curve==='exp')g.gain.exponentialRampToValueAtTime(0.0001,t+attack+decay);
    else g.gain.linearRampToValueAtTime(0.0001,t+attack+decay);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+attack+decay+0.05);
  }catch(e){}
}
function noise({vol=0.2,dur=0.3,start=0,lpFreq=800,hpFreq=0,q=1}){
  try{
    const t=AC.currentTime+start;
    const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(),g=AC.createGain();
    const lp=AC.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=lpFreq;lp.Q.value=q;
    src.buffer=buf;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(lp);lp.connect(g);g.connect(AC.destination);
    src.start(t);src.stop(t+dur+0.05);
  }catch(e){}
}
function sweep({startFreq=400,endFreq=100,vol=0.15,dur=0.3,start=0,type='sine'}){
  try{
    const t=AC.currentTime+start;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;
    o.frequency.setValueAtTime(startFreq,t);
    o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function reverb({freq=440,vol=0.05,start=0}){
  [0,0.04,0.09,0.16].forEach((d,i)=>{
    osc({freq:freq*(1+i*0.003),type:'sine',vol:vol*(1-i*0.22),attack:0.005,decay:0.4+d,start:start+d});
  });
}

function playComboSfx(voice){
  resumeAC();

  // Y2 星の開花：Lvが上がるほど「溜め」が長く、咲く和音が豊かに、降る星屑が多く
  const conf={

    2:{T:0,   bloom:[2093,2637],       rain:[3520],                     bd:0.7,top:0},
    3:{T:0.12,bloom:[2093,2637,3136],  rain:[3520,4186],                bd:0.9,top:0},
    4:{T:0.2, bloom:[2093,2637,3136],  rain:[3520,4186,3951],           bd:1.2,top:0},
    5:{T:0.35,bloom:[2093,2637,3136],  rain:[3520,4186,3951,3136,4699], bd:1.6,top:4186}
  }[lv];
  const T=conf.T;
  // 【溜め】低い光の膨らみ＋息を吸う空気（映像の収束と同期）
  if(T>0){

  }
  // 【開花】高い和音がふわっと咲く
  conf.bloom.forEach((f,i)=>fxBell({f,v:0.13-i*0.025,d:conf.bd,t:T+i*0.02,bright:1+i*0.08,rev:0.7}));
  // 【星屑】咲いた後に高音が降り注ぐ
  conf.rain.forEach((f,i)=>fxBell({f,v:0.055,d:0.5,t:T+0.16+i*0.1,bright:1.2,rev:0.8}));
  // 【余韻】スリーカード以上はシマーの空気、ストレートは最高音が長く響く
  if(lv>=4)fxAir({v:0.04,a:0.05,d:lv===5?1.1:0.6,t:T+0.2,hp:9500,rev:0.8});
  if(conf.top)fxBell({f:conf.top,v:0.09,d:1.4,t:T+0.5,bright:1.25,rev:0.85});
}
function getComboLevel(voice){
  if(voice==='ストレート')return 5;
  if(voice==='スリーカード')return 4;
  if(voice==='ツーペア')return 3;
  if(voice==='ワンペア')return 2;
  return 1;
}

        ov.appendChild(vg);
        vg.animate([{opacity:1},{opacity:0}],{duration:1300,easing:'ease-out',fill:'forwards'});
      }
      // ⑨ テキスト：光が集まって文字が滲み出る
      const slam=document.createElement('div');
      slam.className=isBurst?'fx2-slam fx2-burst':'fx2-slam';
      const bigCls='big'+(lv>=4?' grad':'')+(p.myth?' myth':'');
      const starsHtml=(!isBurst&&lv>=2)?'<span class="stars">'+'✦'.repeat(lv)+'</span>':'';
      slam.innerHTML=isBurst
        ?'<span class="who" style="color:'+whoColor+'">'+whoLabel+'</span><span class="big">BURST</span><span class="pts" style="color:#ffb3c0">-2pt</span>'
        :'<span class="who" style="color:'+whoColor+'">'+whoLabel+'</span><span class="'+bigCls+'">'+combo.text+'</span>'+starsHtml+'<span class="pts">+'+(combo.pts||1)+'pt</span>';
      ov.appendChild(slam);
      const bigEl=slam.querySelector('.big');
      if(bigEl){
        // 文字数に応じて画面幅に収める（「ストレート」の折り返し防止）
        const tlen=(isBurst?'BURST':combo.text).length;
        const maxPx=Math.max(26,Math.floor(window.innerWidth*0.92/Math.max(tlen,3))-4);
        bigEl.style.fontSize='min(calc(clamp(34px,10vw,64px) * '+p.scale+'), '+maxPx+'px)';
      }
      void slam.offsetWidth;slam.classList.add('go');
      later(()=>slam.classList.add('out'),p.myth?2100:1650);
    },D);

    const t=setTimeout(()=>ov.remove(),D+(lv===5?2700:2100));
    return ()=>{clearTimeout(t);timers.forEach(clearTimeout);ov.remove();};
  },[combo]);
  return null;
}

  // オンライン対戦

  const[onField,setOnField]=useState([]);
  const[onFieldColors,setOnFieldColors]=useState([]);
  const[onFieldSum,setOnFieldSum]=useState(0);
  const[onMyPt,setOnMyPt]=useState(0);
  const[onOpPt,setOnOpPt]=useState(0);
  const[onRNum,setOnRNum]=useState(1);
  const[onTimeLeft,setOnTimeLeft]=useState(10);
  const[onCountNum,setOnCountNum]=useState(-1);
  const[onLoadingPct,setOnLoadingPct]=useState(-1);
  const[onShowReady,setOnShowReady]=useState(false);
  const[onFlashMsg,setOnFlashMsg]=useState(null);
  const[onBurstAnim,setOnBurstAnim]=useState(false);
  const[onResetFA,setOnResetFA]=useState(false);
  const[onComboShow,setOnComboShow]=useState(null);
  const[onEndData,setOnEndData]=useState(null);
  const wsR=useRef(null);
  const onRoleR=useRef('');
  const onBurstAnimR=useRef(false);
  const timeupSEFiredR=useRef(false);
  const comboSEFiredR=useRef(false);
  const comboSeenR=useRef(false);   // 星演出をtickの立ち上がりで1回だけ発火させる
  const comboClearTR=useRef(null);  // 星演出の消滅タイマー（ローカル管理）
  const comboSeqR=useRef(0);        // 演出ごとの通し番号（Reactのkey用）
  const onCdIntervalR=useRef(null);
  const onTimerIntervalR=useRef(null);
  const endTimeRef=useRef(0);
  const onMyHandR=useRef([]);
  const onFieldR=useRef([]);
  const onFieldSumR=useRef(0);
  const onTimeLeftR=useRef(10);
  const playingStartAtR=useRef(null);
  const timerRAFR=useRef(null);
  const serverTimeOffsetR=useRef(0); // サーバー時刻 - クライアント時刻
  const onCountNumR=useRef(-1);
  const onFieldAreaRef=useRef(null);
  const aiRef=useRef(null),timerRef=useRef(null),countRef=useRef(null);
  const pPtR=useRef(0),dPtR=useRef(0);
  const pHR=useRef([]),dHR=useRef([]);
  const fieldR=useRef([]),fieldSumR=useRef(0);
  const fieldAreaRef=useRef(null);
  const phaseR=useRef('menu'),countNumR=useRef(-1),lockR=useRef(false);
  const aiFirstFastRef=useRef(true);
  const roundTokR=useRef(0);     // ラウンド遷移トークン（二重遷移防止）
  const resolvingR=useRef(false);// 場の完成演出中（この間の遅着カードは返却）
  const bounceMsgR=useRef(false);// 返却メッセージの連発防止

  useEffect(()=>{pPtR.current=pPt;},[pPt]);
  useEffect(()=>{dPtR.current=dPt;},[dPt]);
  useEffect(()=>{pHR.current=pH;},[pH]);
  useEffect(()=>{dHR.current=dH;},[dH]);
  useEffect(()=>{fieldR.current=field;},[field]);
  useEffect(()=>{fieldSumR.current=fieldSum;},[fieldSum]);
  useEffect(()=>{phaseR.current=phase;},[phase]);


  // ── オンライン接続 ──
  function onConnect(onOpen){
    const ws=new WebSocket(WS_URL);
    wsR.current=ws;
    ws.onopen=()=>onOpen(ws);
    ws.onmessage=(e)=>onMsg(JSON.parse(e.data));
    ws.onclose=()=>{if(['online_waiting','online_playing'].includes(phaseR.current)){alert('接続が切れました');goOnlineHome();}};
  }
  function onMsg(msg){
    switch(msg.type){
      case 'created':setRoomId(msg.roomId);setPhase('online_waiting');phaseR.current='online_waiting';break;
      case 'joined':setRoomId(msg.roomId);stopBGM();setPhase('online_playing');phaseR.current='online_playing';
        // ping3回送ってオフセット計算してからreadyAck
        syncServerTime(wsR.current,serverTimeOffsetR,()=>{
          if(wsR.current&&wsR.current.readyState===WebSocket.OPEN)wsR.current.send(JSON.stringify({type:'readyAck'}));
        });
        break;
      case 'guestJoined':stopBGM();setPhase('online_playing');phaseR.current='online_playing';
        syncServerTime(wsR.current,serverTimeOffsetR,()=>{
          if(wsR.current&&wsR.current.readyState===WebSocket.OPEN)wsR.current.send(JSON.stringify({type:'readyAck'}));
        });
        break;
      case 'pong':{
        const rtt=Date.now()-msg.clientTime;
        serverTimeOffsetR.current=msg.serverTime+(rtt/2)-Date.now();
        break;
      }
      case 'tick':{
        const role=onRoleR.current;
        setOnMyHand(msg.myHand||[]);onMyHandR.current=msg.myHand||[];
        setOnOpHandCount(msg.opHandCount||0);
        setOnOpHandSum(msg.opHandSum||0);
        const newField=msg.field||[];
        setOnField(newField);onFieldR.current=newField;
        setOnFieldSum(msg.fieldSum||0);onFieldSumR.current=msg.fieldSum||0;
        // サーバーから fieldOwners が届いた場合: host=青('player'), guest=赤('dealer') で固定
        if(msg.fieldOwners){
          const colors=msg.fieldOwners.map(o=>o===role?'player':'dealer'); // v42: 自分=青/相手=橙の視点固定
          setOnFieldColors(colors);
        } else if(newField.length===0){
          setOnFieldColors([]);
        }
        setOnMyPt(role==='host'?msg.hostPt:msg.guestPt);
        setOnOpPt(role==='host'?msg.guestPt:msg.hostPt);
        setOnRNum(msg.rNum||1);
        // playingStartAtを使ってリアルタイム計算
        if(msg.phase==='playing'&&msg.playingStartAt){
          if(playingStartAtR.current!==msg.playingStartAt){
            playingStartAtR.current=msg.playingStartAt;
            // RAFで滑らかにタイマー更新
            if(timerRAFR.current)cancelAnimationFrame(timerRAFR.current);
            function tickTimer(){
              const serverNow=Date.now()+serverTimeOffsetR.current;
              const elapsed=serverNow-playingStartAtR.current;
              const left=Math.max(0,10-Math.floor(elapsed/1000));
              setOnTimeLeft(left);onTimeLeftR.current=left;
              if(left>0)timerRAFR.current=requestAnimationFrame(tickTimer);
            }
            timerRAFR.current=requestAnimationFrame(tickTimer);
          }
        } else if(msg.phase!=='playing'){
          if(timerRAFR.current){cancelAnimationFrame(timerRAFR.current);timerRAFR.current=null;}
          playingStartAtR.current=null;
          setOnTimeLeft(msg.timeLeft||10);onTimeLeftR.current=msg.timeLeft||10;
        }
        // loading/readyフェーズ処理
        if(msg.phase==='loading'){setOnLoadingPct(msg.loadingPct||0);setOnShowReady(false);}
        else if(msg.phase==='ready'){setOnLoadingPct(100);setOnShowReady(true);if(trackNumR.current>0){resumeAC();startBGM(trackNumR.current);}}
        else{setOnLoadingPct(-1);setOnShowReady(false);}
        const cd=msg.phase==='countdown'?msg.countdown:-1;
        const prevCd=onCountNumR.current;
        if(cd!==prevCd){onCountNumR.current=cd;setOnCountNum(cd);
          if(prevCd===0&&cd===-1){playGoSE();}
        }
        if(msg.flashMsg){const fm=msg.flashMsg;
          // v41: 役・バーストは星演出に一本化。ピルは「4枚！強制リセット」等の中立メッセージだけ
          if(fm.by==null){setOnFlashMsg({text:fm.text,who:null});}
          else{setOnFlashMsg(null);}
          if(fm.voice&&!comboSEFiredR.current){comboSEFiredR.current=true;resumeAC();playComboSfx(fm.voice);}
        }else{setOnFlashMsg(null);comboSEFiredR.current=false;}
        // 星演出：tickの立ち上がりで1回だけ発火。消滅はローカルタイマー管理（毎tickの再生成を防ぐ）
        if(msg.comboShow){
          if(!comboSeenR.current){
            comboSeenR.current=true;
            const by=(msg.flashMsg&&msg.flashMsg.by)||null;
            setOnComboShow({...msg.comboShow,who:by===role?'player':'dealer',color:by===role?'#2e7fe8':'#f5912a',opp:'RIVAL',seq:++comboSeqR.current});
            clearTimeout(comboClearTR.current);
            comboClearTR.current=setTimeout(()=>setOnComboShow(null),2600);
          }
        }else{comboSeenR.current=false;}
        const prevBurst=onBurstAnimR.current;
        const newBurst=!!msg.burstAnim&&msg.phase==='resolving';
        if(newBurst&&!prevBurst){
          resumeAC();playBurstSE();
          // バーストの星演出（サーバーはcomboを送らないのでローカルで発火）
          const byB=(msg.flashMsg&&msg.flashMsg.by)||null;
          setOnComboShow({text:'BURST',pts:-2,burst:true,color:'#ff4d4d',who:byB===role?'player':'dealer',opp:'RIVAL',seq:++comboSeqR.current});
          clearTimeout(comboClearTR.current);
          comboClearTR.current=setTimeout(()=>setOnComboShow(null),2200);
        }
        if(newBurst!==prevBurst){setOnBurstAnim(newBurst);onBurstAnimR.current=newBurst;}
        setOnResetFA(!!msg.resetAnim);
        if(msg.phase==='timeup'&&!timeupSEFiredR.current){timeupSEFiredR.current=true;playMissSE();}
        if(msg.phase!=='timeup')timeupSEFiredR.current=false;
        break;
      }
      case 'state':
        // インターバルをクリアしてからリセット
        if(onCdIntervalR.current){clearInterval(onCdIntervalR.current);onCdIntervalR.current=null;}
        if(onTimerIntervalR.current){clearInterval(onTimerIntervalR.current);onTimerIntervalR.current=null;}
        endTimeRef.current=0;
        setOnMyHand(msg.myHand||[]);onMyHandR.current=msg.myHand||[];
        setOnOpHandCount(msg.opHandCount||0);
        setOnOpHandSum(msg.opHandSum||0);
        setOnField(msg.field||[]);onFieldR.current=msg.field||[];setOnFieldColors([]);
        setOnFieldSum(msg.fieldSum||0);onFieldSumR.current=msg.fieldSum||0;
        setOnMyPt(msg.myPt||0);setOnOpPt(msg.opPt||0);
        setOnRNum(msg.rNum||1);setOnTimeLeft(msg.timeLeft||10);onTimeLeftR.current=msg.timeLeft||10;
        if(msg.countdownStartAt){
          const startAt=msg.countdownStartAt;
          const dur=msg.countdownDuration||5;
          onCountNumR.current=dur;setOnCountNum(dur);
          let lastTick=dur+1;
          onCdIntervalR.current=setInterval(()=>{
            const elapsed=Math.floor((Date.now()-startAt)/700);
            const val=dur-elapsed;
            if(val<=0){
              clearInterval(onCdIntervalR.current);onCdIntervalR.current=null;
              onCountNumR.current=0;setOnCountNum(0);
              playGoSE();
            } else {
              if(val!==lastTick){lastTick=val;} // v40: カウント中は無音(GOだけ鳴らす)
              onCountNumR.current=val;setOnCountNum(val);
            }
          },100);
        }
        break;
      case 'gameStart':
        if(onCdIntervalR.current){clearInterval(onCdIntervalR.current);onCdIntervalR.current=null;}
        if(onTimerIntervalR.current){clearInterval(onTimerIntervalR.current);onTimerIntervalR.current=null;}
        onCountNumR.current=-1;setOnCountNum(-1);
        endTimeRef.current=msg.timerEndAt;
        onTimerIntervalR.current=setInterval(()=>{
          const remaining=Math.ceil((endTimeRef.current-Date.now())/1000);
          if(remaining<=0){
            clearInterval(onTimerIntervalR.current);onTimerIntervalR.current=null;
            setOnTimeLeft(0);onTimeLeftR.current=0;
            playMissSE();
          } else {
            setOnTimeLeft(remaining);onTimeLeftR.current=remaining;
          }
        },200);
        break;
      case 'timeUp':
        if(onTimerIntervalR.current){clearInterval(onTimerIntervalR.current);onTimerIntervalR.current=null;}
        setOnTimeLeft(0);onTimeLeftR.current=0;
        setOnFlashMsg({text:'⏱ 時間切れ！引き分け（±0pt）',who:null});
        setTimeout(()=>setOnFlashMsg(null),1600);
        break;
      case 'handUpdate':const nh=[...onMyHandR.current];nh[msg.idx]=0;setOnMyHand(nh);onMyHandR.current=nh;break;
      case 'newHand':setOnMyHand(msg.hand);onMyHandR.current=msg.hand;break;
      case 'fieldUpdate':setOnField(msg.field);onFieldR.current=msg.field;setOnFieldSum(msg.fieldSum);onFieldSumR.current=msg.fieldSum;break;
      case 'opPlay':
        const newField=[...onFieldR.current,msg.value];
        setOnField(newField);onFieldR.current=newField;
        setOnFieldSum(msg.fieldSum);onFieldSumR.current=msg.fieldSum;
        // v42: 相手のカードは常に橙('dealer')
        setOnFieldColors(prev=>[...prev,'dealer']);
        resumeAC();setTimeout(()=>playPlaceSE(false),100);setOnOpHandCount(c=>Math.max(0,c-1));
        break;
      case 'burst':
        resumeAC();playBurstSE();setOnBurstAnim(true);
        const ib=msg.msg.by===onRoleR.current;
        setOnFlashMsg({text:ib?'💥 バースト！あなた-2pt':'💥 相手バースト！相手-2pt',who:msg.msg.by});
        if(onRoleR.current==='host'){setOnMyPt(msg.hostPt);setOnOpPt(msg.guestPt);}else{setOnMyPt(msg.guestPt);setOnOpPt(msg.hostPt);}
        setTimeout(()=>{setOnBurstAnim(false);setOnFlashMsg(null);},1000);break;
      case 'score':
        if(msg.voice)playComboSfx(msg.voice);
        setOnResetFA(true);setOnComboShow(msg.combo);
        if(onRoleR.current==='host'){setOnMyPt(msg.hostPt);setOnOpPt(msg.guestPt);}else{setOnMyPt(msg.guestPt);setOnOpPt(msg.hostPt);}
        setTimeout(()=>setOnComboShow(null),5200);setTimeout(()=>setOnResetFA(false),1400);break;
      case 'comboEnd':setOnComboShow(null);break;
      case 'cardReturned':
        // 返却システム：相手のカードが先に着弾していた等でカードが跳ね返された
        // 手札は次のtickでサーバー正の状態に自動復元される
        fxRejectStamp();
        break;
      case 'forceReset':setOnResetFA(true);setOnFlashMsg({text:'4枚！強制リセット',who:null});setTimeout(()=>{setOnResetFA(false);setOnFlashMsg(null);},900);break;
      case 'finish':
        const isMe=msg.winner===onRoleR.current;
        setOnEndData({winner:isMe?'me':'op',myPt:onRoleR.current==='host'?msg.hostPt:msg.guestPt,opPt:onRoleR.current==='host'?msg.guestPt:msg.hostPt});
        stopBGM();setPhase('online_end');phaseR.current='online_end';break;
      case 'opLeft':alert('相手が退出しました');goOnlineHome();break;
      case 'error':alert(msg.msg);break;
    }
  }
  function createRoom(){onRoleR.current='host';onConnect(ws=>ws.send(JSON.stringify({type:'create'})));}
  function joinRoom(code){onRoleR.current='guest';onConnect(ws=>ws.send(JSON.stringify({type:'join',roomId:code})));}
  function onlinePlayCard(idx,value){
    if(onCountNumR.current>=0||onTimeLeftR.current<=0)return;
    if(!wsR.current||wsR.current.readyState!==WebSocket.OPEN)return;
    if(!onMyHandR.current[idx])return;
    if(!canPlay(value,onFieldSumR.current,onFieldR.current))return;
    const baseSum=onFieldSumR.current; // 返却判定用：出した瞬間の場の合計
    resumeAC();setTimeout(()=>playPlaceSE(true),100);
    const nh=[...onMyHandR.current];nh[idx]=0;setOnMyHand(nh);onMyHandR.current=nh;
    const nf=[...onFieldR.current,value];const ns=onFieldSumR.current+value;
    setOnField(nf);onFieldR.current=nf;setOnFieldSum(ns);onFieldSumR.current=ns;
    // v42: 自分のカードは常に青('player')
    setOnFieldColors(prev=>[...prev,'player']);
    wsR.current.send(JSON.stringify({type:'play',idx,value,baseSum}));
  }
  function goOnlineHome(){
    if(wsR.current){try{wsR.current.send(JSON.stringify({type:'leave'}));}catch(e){}wsR.current.close();wsR.current=null;}
    if(onCdIntervalR.current){clearInterval(onCdIntervalR.current);onCdIntervalR.current=null;}
    if(onTimerIntervalR.current){clearInterval(onTimerIntervalR.current);onTimerIntervalR.current=null;}
    endTimeRef.current=0;
    stopBGM();setPhase('menu');phaseR.current='menu';
    setOnMyHand([]);setOnField([]);setOnFieldColors([]);setOnFieldSum(0);setOnMyPt(0);setOnOpPt(0);
    setOnCountNum(-1);onCountNumR.current=-1;setOnFlashMsg(null);setOnEndData(null);setOnLoadingPct(-1);setOnShowReady(false);
    if(timerRAFR.current){cancelAnimationFrame(timerRAFR.current);timerRAFR.current=null;}playingStartAtR.current=null;
  }
  function showOnlineMenu(){
    // ルーム作成/入室選択
    const code=window.prompt('ルームコードを入力（作る場合は空欄）');
    if(code===null)return;
    if(code.trim()===''){createRoom();}
    else{joinRoom(code.trim());}
  }

  // 曲サイクル：1 → 2 → 3 → ミュート(0) → 1 → …
  function toggleMusic(){
    setTrackNum(t=>{
      const next=t===3?0:(t===0?1:t+1);
      trackNumR.current=next;
      musicEnabledR.current=next>0;setMusicEnabled(next>0);
      if(next===0)stopBGM();
      else if(phaseR.current==='playing'||phaseR.current==='online_playing'){resumeAC();startBGM(next);}
      return next;
    });
  }
  function clearTimers(){clearTimeout(aiRef.current);clearInterval(timerRef.current);clearTimeout(countRef.current);}
  useEffect(()=>()=>clearTimers(),[]);

  function startGame(diff){
    if(diff){setDifficulty(diff);diffRef.current=diff;}
    clearTimers();lockR.current=false;
    const p=createDeck(),d=createDeck();
    setPH(p);setDH(d);pHR.current=p;dHR.current=d;
    setPPt(0);setDPt(0);pPtR.current=0;dPtR.current=0;
    setRNum(1);setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;
    setFlashMsg(null);setBurstAnim(false);setResetFA(false);setGameEndData(null);
    if(trackNumR.current>0)startBGM(trackNumR.current);doCountdown(p,d,0,0,1);
  }

  function doCountdown(pHand,dHand,pp,dp,rn){
    roundTokR.current++;    // 古い遷移予約を全部無効化
    clearTimers();          // 残ってるカウントダウン/タイマーも掃除
    resolvingR.current=false;
    setPhase('playing');phaseR.current='playing';
    setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;
    setFlashMsg(null);setTimeLeft(10);setComboShow(null);setTimeUpShow(false);
    let c=5;setCountNum(c);countNumR.current=c;
    function tick(){
      setCountNum(c);countNumR.current=c;
      // カウント中は無音（GOだけ鳴らす）
      if(c===0){
        // GO！音（ワープSE）
        playGoSE();
        setTimeout(()=>{
          setCountNum(-1);countNumR.current=-1;
          aiFirstFastRef.current=Math.random()<0.90;
          startTimer(rn);
          lockR.current=false; // v40: 開始時のプレイヤーロック(50%で0.4秒)は撤廃
          scheduleAi(rn);
        },650);
        return;
      }
      c--;countRef.current=setTimeout(tick,650);
    }
    tick();
  }

  function startTimer(rn){
    clearInterval(timerRef.current);
    let t=10;setTimeLeft(t);
    timerRef.current=setInterval(()=>{
      t--;setTimeLeft(t);
      if(t<=0){clearInterval(timerRef.current);clearTimeout(aiRef.current);doTimeUp(rn);}
    },1000);
  }

  function doTimeUp(rn){
    clearTimers();lockR.current=true;resolvingR.current=true; // 時間切れ演出中はカードを出せない
    resumeAC();playMissSE();
    setTimeUpShow(true);
    const newP=createDeck(),newD=createDeck();
    setPH(newP);setDH(newD);pHR.current=newP;dHR.current=newD;
    const tok=roundTokR.current;
    setTimeout(()=>{
      if(tok!==roundTokR.current)return; // 別の遷移が先に走ってたら中止
      setTimeUpShow(false);
      const pp=pPtR.current,dp=dPtR.current;
      if(pp>=WIN_PT||dp>=WIN_PT){endGame(pp,dp);return;}
      const nr=rn+1;setRNum(nr);doCountdown(newP,newD,pp,dp,nr);
    },4000);
  }

  function scheduleAi(rn,delay=null){
    clearTimeout(aiRef.current);
    let d;
    if(delay!==null){d=delay;}
    else{
      const cf=fieldR.current,cs=fieldSumR.current,fl=cf.length;
      const canWin=dHR.current.some(v=>canPlay(v,cs,cf)&&cs+v===10);
      const diff=diffRef.current;
      // 10完成できる時も人間が反応できる程度の「間」を必ず空ける(v40)
      if(canWin)d=diff==='easy'?900+Math.random()*600:diff==='hard'?300+Math.random()*250:450+Math.random()*350;
      else if(fl===0){if(diff==='easy')d=800+Math.random()*800;else if(diff==='hard')d=150+Math.random()*200;else d=aiFirstFastRef.current?300+Math.random()*300:1200+Math.random()*800;}
      else if(fl===1)d=diff==='easy'?1000+Math.random()*600:diff==='hard'?400+Math.random()*200:1000+Math.random()*400;
      else d=diff==='easy'?1200+Math.random()*800:diff==='hard'?600+Math.random()*300:1500+Math.random()*500;
    }
    aiRef.current=setTimeout(()=>{if(phaseR.current==='playing'&&countNumR.current<0)aiPlay(rn);},d);
  }

  function aiPlay(rn){
    // 場が完成した直後にAIの出す動作が間に合ってしまった場合 → カード返却（出さない）
    // ※lockRは見ない：あれはラウンド開始時のプレイヤー用ハンデロックと共用のため
    if(resolvingR.current)return;
    const dHand=dHR.current,cf=fieldR.current,cs=fieldSumR.current;
    if(!dHand.length)return;
    const playable=dHand.filter(v=>canPlay(v,cs,cf));
    if(!playable.length){scheduleAi(rn);return;}
    const wins=playable.filter(v=>cs+v===10);
    const safe=playable.filter(v=>cs+v<10);
    const diff=diffRef.current;
    const winRate  =diff==='easy'?0.60:diff==='hard'?0.97:0.85;
    const safeRate5=diff==='easy'?0.25:diff==='hard'?0.60:0.35;
    const safeBase =diff==='easy'?0.35:diff==='hard'?0.70:0.40;
    const safeCap  =diff==='easy'?0.50:diff==='hard'?0.90:0.65;
    const firstRate=diff==='easy'?0.45:diff==='hard'?0.80:0.55;
    let chosen=null;
    if(wins.length&&Math.random()<winRate)chosen=wins.reduce((b,v)=>calcPts([...cf,v]).total>calcPts([...cf,b]).total?v:b,wins[0]);
    else if(cs>=8){if(diff==='hard'&&Math.random()<0.15&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else if(cs>=5){if(Math.random()<safeRate5&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else if(cs>=1){if(Math.random()<Math.min(safeBase+cf.length*0.08,safeCap)&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else{if(Math.random()<firstRate&&safe.length)chosen=safe.sort((a,b)=>a-b)[0];}
    if(!chosen){scheduleAi(rn);return;}
    resumeAC();setTimeout(()=>playPlaceSE(false),100);
    const idx=dHand.indexOf(chosen);
    const newDH=dHand.filter((_,i)=>i!==idx);
    setDH(newDH);dHR.current=newDH;
    if(!newDH.length){const nd=createDeck();setDH(nd);dHR.current=nd;}
    if(!resolvePlay(chosen,cf,cs,'dealer',rn))scheduleAi(rn);
  }

  function playCard(idx){
    if(phaseR.current!=='playing'||countNumR.current>=0)return;
    if(lockR.current){
      // 場が完成した直後に滑り込んだカード → バーストさせず手札に返却
      if(resolvingR.current&&!bounceMsgR.current){
        bounceMsgR.current=true;
        fxRejectStamp();
        setTimeout(()=>{bounceMsgR.current=false;},900);
      }
      return;
    }
    // 判定はstateでなくrefを使う（同時タイミングで相手の直前プレイが消えるのを防ぐ）
    const cf=fieldR.current,cs=fieldSumR.current;
    const value=pH[idx];
    if(!value||!canPlay(value,cs,cf))return;
    clearTimeout(aiRef.current);resumeAC();setTimeout(()=>playPlaceSE(true),100);
    const newPH=pH.map((v,i)=>i===idx?null:v);
    setPH(newPH);pHR.current=newPH;
    if(!newPH.filter(Boolean).length){const nd=createDeck();setTimeout(()=>{setPH(nd);pHR.current=nd;},100);}
    if(!resolvePlay(value,cf,cs,'player',rNum)){clearTimeout(aiRef.current);scheduleAi(rNum);}
  }

  function resolvePlay(value,curField,curSum,who,rn){
    const nf=[...curField,value],ns=curSum+value;
    setField(nf);setFieldSum(ns);fieldR.current=nf;fieldSumR.current=ns;
    setFieldColors(prev=>[...prev,who]);
    if(ns>10){
      clearTimers();lockR.current=true;resolvingR.current=true;playBurstSE();setBurstAnim(true);
      const newPP=who==='player'?Math.max(0,pPtR.current-2):pPtR.current;
      const newDP=who==='dealer'?Math.max(0,dPtR.current-2):dPtR.current;
      setPPt(newPP);setDPt(newDP);pPtR.current=newPP;dPtR.current=newDP;
      setComboShow({text:'BURST',pts:-2,color:'#ff3b3b',who,burst:true});
      setTimeout(()=>setComboShow(null),4000);
      const tokB=roundTokR.current;
      setTimeout(()=>{if(tokB!==roundTokR.current)return;setBurstAnim(false);resetField();if(newPP>=WIN_PT||newDP>=WIN_PT){endGame(newPP,newDP);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,newPP,newDP,nr);},4000);
      return true;
    }
    if(ns===10){
      clearTimers();lockR.current=true;resolvingR.current=true;
      const pts=calcPts(nf);
      const newPP=who==='player'?pPtR.current+pts.total:pPtR.current;
      const newDP=who==='dealer'?dPtR.current+pts.total:dPtR.current;
      setPPt(newPP);setDPt(newDP);pPtR.current=newPP;dPtR.current=newDP;
      playComboSfx(pts.voice||'役なし');
      setResetFA(true);
      const color=who==='player'?'#2e7fe8':'#f5912a';
      setComboShow({text:pts.voice||'10達成！',pts:pts.total,color,who});
      setTimeout(()=>setComboShow(null),4000);
      const tokS=roundTokR.current;
      setTimeout(()=>{if(tokS!==roundTokR.current)return;setResetFA(false);resetField();if(newPP>=WIN_PT||newDP>=WIN_PT){endGame(newPP,newDP);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,newPP,newDP,nr);},4000);
      return true;
    }
    if(nf.length>=4){
      clearTimers();lockR.current=true;resolvingR.current=true;setResetFA(true);
      setFlashMsg({text:'4枚！強制リセット',color:DIM});
      const tokF=roundTokR.current;
      setTimeout(()=>{if(tokF!==roundTokR.current)return;setResetFA(false);resetField();const pp=pPtR.current,dp=dPtR.current;if(pp>=WIN_PT||dp>=WIN_PT){endGame(pp,dp);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,pp,dp,nr);},900);
      return true;
    }
    return false;
  }

  function resetField(){setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;setFieldColors([]);}
  function endGame(pp,dp){roundTokR.current++;stopBGM();setGameEndData({pPt:pp,dPt:dp,winner:pp>=WIN_PT?'player':'dealer',diff:diffRef.current});setPhase('gameEnd');}
  function goHome(){roundTokR.current++;clearTimers();stopBGM();setPhase('menu');}

  if(phase==='menu')return h(MenuScreen,{onSolo:startGame,onOnline:showOnlineMenu,musicOn:musicEnabled,toggleMusic:toggleMusic});
  if(phase==='online_waiting')return h(WaitingScreen,{roomId,onCancel:goOnlineHome});
  if(phase==='online_end'&&onEndData)return h(OnlineEndScreen,{data:onEndData,onHome:goOnlineHome});
  if(phase==='gameEnd'&&gameEndData)return h(GameEndScreen,{data:gameEndData,onRestart:startGame,onHome:goHome});

  if(phase==='online_playing'){
    const role=onRoleR.current;
    const myColorRole='player'; // v42: 自分の手札は常に青
    const isCardOff=(v)=>onCountNum>=0||onTimeLeft<=0||!canPlay(v,onFieldSum,onField);

    return h('div',{className:'gp-screen'},

      onComboShow&&h(CyberComboDisplay,{key:'oc_'+(onComboShow.seq||onComboShow.text),combo:onComboShow}),
      // ── オーバーレイ（ローディング/Ready/カウントダウン/フラッシュ）──
      onLoadingPct>=0&&!onShowReady&&h('div',{style:{position:'fixed',inset:0,zIndex:200,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#0a0a1aee',pointerEvents:'none'}},
        h('div',{style:{fontSize:22,fontWeight:900,color:'#00d4ff',letterSpacing:4,marginBottom:24,fontFamily:"'Fira Code',monospace"}},'LOADING...'),
        h('div',{style:{width:260,height:14,background:'#1a1a3a',borderRadius:8,border:'1px solid #00d4ff44',overflow:'hidden'}},
          h('div',{style:{height:'100%',width:onLoadingPct+'%',background:'linear-gradient(90deg,#00d4ff,#a050ff)',borderRadius:8,transition:'width 0.1s linear',boxShadow:'0 0 12px #00d4ff88'}})
        ),
        h('div',{style:{marginTop:12,fontSize:14,color:'#00d4ff88',fontFamily:"'Fira Code',monospace"}},onLoadingPct+'%')
      ),
      onShowReady&&h('div',{style:{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',background:'#0a0a1aee',pointerEvents:'none'}},
        h('div',{style:{fontSize:72,fontWeight:900,color:'#00d4ff',animation:'countDown 0.4s ease both',textShadow:'0 0 40px #00d4ff',letterSpacing:8}},'Ready')
      ),
      onCountNum>=0&&h('div',{style:{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',background:'#2a103066',pointerEvents:'none'}},
        h('div',{key:onCountNum,style:{fontSize:onCountNum===0?96:120,fontWeight:900,color:onCountNum===0?'#50e080':'#fff',animation:'countDown 0.65s ease both',textShadow:onCountNum===0?'0 0 60px #50e080':'0 0 30px #fff'}},onCountNum===0?'GO!!':onCountNum)
      ),
      onFlashMsg&&h('div',{style:{position:'fixed',inset:0,zIndex:150,display:'flex',alignItems:onComboShow?'flex-start':'center',justifyContent:'center',paddingTop:onComboShow?'clamp(90px,20vh,140px)':'0',pointerEvents:'none'}},
        h('div',{style:{background:'rgba(255,255,255,.34)',backdropFilter:'blur(8px)',borderRadius:14,padding:'14px 26px',fontSize:18,fontWeight:900,color:onFlashMsg.who==='host'?'#1c6fe0':onFlashMsg.who==='guest'?'#d2691e':'#2a3a4a',boxShadow:'0 4px 24px rgba(40,60,90,.18)',border:'1px solid rgba(255,255,255,.5)',animation:'slideIn 0.2s ease',maxWidth:'88vw',textAlign:'center'}},onFlashMsg.text)
      ),

      // TOP BAR（AIと同じ明るいHUD）
      h('div',{className:'gp-top-bar',style:{visibility:(onLoadingPct>=0||onShowReady)?'hidden':'visible'}},
        h('div',{className:'gp-time-box'+(onTimeLeft<=5?' urgent':'')},
          h('div',{className:'lbl'},'TIME'),
          h('div',{className:'val'},onTimeLeft)
        ),
        h('div',{className:'gp-score you'},
          h('div',{className:'lbl'},'YOU'),
          h('div',{className:'val'},onMyPt),
          h('div',{className:'sub'},'あと ',h('b',null,Math.max(0,WIN_PT-onMyPt)),'pt')
        ),
        h('div',{className:'gp-round-pill'},
          h('span',{className:'r'},'R'+onRNum)
        ),
        h('div',{className:'gp-score dealer'},
          h('div',{className:'lbl'},'RIVAL'),
          h('div',{className:'val'},onOpPt),
          h('div',{className:'sub'},'あと ',h('b',null,Math.max(0,WIN_PT-onOpPt)),'pt')
        ),
        h('div',{className:'gp-icon-btn',onClick:goOnlineHome,title:'ホームに戻る'},h('span',null,'⌂')),
        h('div',{className:'gp-track-btn',onClick:toggleMusic,title:'曲を変更（1→2→3→ミュート）'},
          h('span',{className:'num'},trackNum===0?'OFF':String(trackNum).padStart(2,'0'))
        )
      ),

      // 相手エリア（AIと同じ枠なし）
      h('div',{className:'gp-dealer-area',style:{visibility:(onLoadingPct>=0||onShowReady)?'hidden':'visible'}},
        h('div',{className:'gp-area-label'},'⚔ RIVAL — '+onOpHandCount+'枚'),
        h('div',{className:'gp-dealer-cards'},
          Array.from({length:Math.min(onOpHandCount,12)}).map((_,i)=>h('div',{key:i,className:'gp-dealer-card'}))
        )
      ),

      h('div',{className:'gp-spacer'}),

      // FIELD（AIと同じ）
      h('div',{
        ref:onFieldAreaRef,
        className:'gp-field-area field-card-area'+((onFieldSum>=8&&onFieldSum<10)?(onFieldColors[onFieldColors.length-1]==='player'?' alert-blue':' alert'):onFieldSum>=5?' warn':''),
        style:{animation:onResetFA?'resetAnim 0.5s ease':onBurstAnim?'burst 0.5s ease':'none',visibility:(onLoadingPct>=0||onShowReady)?'hidden':'visible'}
      },
        h('div',{className:'field-planet'}),
        h('div',{className:'gp-field-cards'},
          [0,1,2,3].map(i=>onField[i]?h(FieldCard,{key:i,value:onField[i],by:onFieldColors[i]||'player',isComplete:onFieldSum===10&&i===onFieldColors.length-1}):h('div',{key:i,style:{width:'var(--card-w)',height:'calc(var(--card-w) * 1.4)',flexShrink:0}}))
        ),
        h('div',{className:'gp-field-sum gp-field-sum-strong',style:{visibility:onFieldSum>0?'visible':'hidden'}},
          h('div',{className:'main'},
            h('span',{className:'num'+((onFieldSum>=8&&onFieldSum<10)?(onFieldColors[onFieldColors.length-1]==='player'?' alert-blue':' alert'):onFieldSum>=5?' warn':'')},onFieldSum),
            h('span',{className:'sep'},'/ 10')
          ),
          h('div',{className:'ato'},'あと ',h('b',null,10-onFieldSum))
        )
      ),

      h('div',{className:'gp-spacer'}),

      // HAND（AIと同じ）
      h('div',{className:'gp-hand-area hand-card-area',style:{visibility:(onLoadingPct>=0||onShowReady)?'hidden':'visible'}},
        h('div',{className:'gp-area-label'},'YOU — '+myHandCount+'枚'),
        h('div',{className:'gp-hand-rows'},
          h('div',{className:'gp-hand-row'},
            onMyHand.slice(0,5).map((v,i)=>(!v||v===0)?h('div',{key:i,style:{width:'var(--card-w)',height:'calc(var(--card-w) * 1.4)',flexShrink:0}}):h(SlideCard,{key:'c'+i+'_'+v,value:v,onPlay:()=>onlinePlayCard(i,v),disabled:isCardOff(v),cardRole:myColorRole}))
          ),
          h('div',{className:'gp-hand-row'},
            onMyHand.slice(5).map((v,i)=>(!v||v===0)?h('div',{key:i+5,style:{width:'var(--card-w)',height:'calc(var(--card-w) * 1.4)',flexShrink:0}}):h(SlideCard,{key:'c'+(i+5)+'_'+v,value:v,onPlay:()=>onlinePlayCard(i+5,v),disabled:isCardOff(v),cardRole:myColorRole}))
          )
        )
      ),

      h('div',{className:'gp-spacer'})
    );
  }


  return h('div',{className:'gp-screen'},
    
    comboShow&&h(CyberComboDisplay,{key:'c_'+comboShow.text+Date.now(),combo:comboShow}),
    timeUpShow&&h(TimeUpDisplay,{key:'tu_'+Date.now(),show:true}),
    countNum>=0&&h('div',{style:{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',background:'#2a103066',pointerEvents:'none'}},
      h('div',{key:countNum,style:{fontSize:countNum===0?96:120,fontWeight:900,color:countNum===0?'#50e080':'#fff',animation:'countDown 0.65s ease both',textShadow:countNum===0?'0 0 60px #50e080':'0 0 30px #fff'}},countNum===0?'GO!!':countNum)
    ),
    flashMsg&&h('div',{style:{position:'fixed',inset:0,zIndex:150,display:'flex',alignItems:comboShow?'flex-start':'center',justifyContent:'center',paddingTop:comboShow?'clamp(90px,20vh,140px)':'0',pointerEvents:'none'}},
      h('div',{style:{background:flashMsg.who==='player'?'#00203088':'#3a001088',backdropFilter:'blur(8px)',borderRadius:14,padding:'14px 26px',fontSize:18,fontWeight:900,color:flashMsg.who==='player'?'#00d4ff':'#ff2d6e',boxShadow:'0 4px 32px '+(flashMsg.who==='player'?'#00d4ff55':'#ff2d6e55'),border:'2px solid '+(flashMsg.who==='player'?'#00d4ff':'#ff2d6e'),animation:'slideIn 0.2s ease',maxWidth:'88vw',textAlign:'center'}},flashMsg.text)
    ),

    // TOP BAR
    h('div',{className:'gp-top-bar'},
      h('div',{className:'gp-time-box'+(timeLeft<=5?' urgent':'')},
        h('div',{className:'lbl'},'TIME'),
        h('div',{className:'val'},timeLeft)
      ),
      h('div',{className:'gp-score you'},
        h('div',{className:'lbl'},'YOU'),
        h('div',{className:'val'},pPt),
        h('div',{className:'sub'},'あと ',h('b',null,Math.max(0,WIN_PT-pPt)),'pt')
      ),
      h('div',{className:'gp-round-pill '+difficulty},
        h('span',{className:'r'},'R'+rNum),
        h('span',{className:'lvl'},difficulty==='easy'?'EASY':difficulty==='hard'?'HARD':'NORMAL')
      ),
      h('div',{className:'gp-score dealer'},
        h('div',{className:'lbl'},'DEALER'),
        h('div',{className:'val'},dPt),
        h('div',{className:'sub'},'あと ',h('b',null,Math.max(0,WIN_PT-dPt)),'pt')
      ),
      h('div',{className:'gp-icon-btn',onClick:goHome,title:'ホームに戻る'},h('span',null,'⌂')),
      h('div',{className:'gp-track-btn',onClick:toggleMusic,title:'曲を変更（1→2→3→ミュート）'},
        h('span',{className:'num'},trackNum===0?'OFF':String(trackNum).padStart(2,'0'))
      )
    ),

    // DEALER 手札
    h('div',{className:'gp-dealer-area'},
      h('div',{className:'gp-area-label'},'💀 DEALER — '+dH.length+'枚'),
      h('div',{className:'gp-dealer-cards'},
        dH.slice(0,12).map((_,i)=>h('div',{key:i,className:'gp-dealer-card'}))
      )
    ),

    // SPACER (dealer → field)
    h('div',{className:'gp-spacer'}),

    // FIELD area
    h('div',{
      ref:fieldAreaRef,
      className:'gp-field-area field-card-area'+((fieldSum>=8&&fieldSum<10)?(fieldColors[fieldColors.length-1]==='player'?' alert-blue':' alert'):fieldSum>=5?' warn':''),
      style:{animation:resetFA?'resetAnim 0.5s ease':burstAnim?'burst 0.5s ease':'none'}
    },
      h('div',{className:'field-planet'}),
      h('div',{className:'gp-field-cards'},
        field.map((v,i)=>h(FieldCard,{key:i,value:v,by:fieldColors[i],isComplete:fieldSum===10&&i===field.length-1}))
      ),
      // FIELD SUM（場のカードの下・前の配置に戻す＋少し強化）
      h('div',{className:'gp-field-sum gp-field-sum-strong',style:{visibility:fieldSum>0?'visible':'hidden'}},
        h('div',{className:'main'},
          h('span',{className:'num'+((fieldSum>=8&&fieldSum<10)?(fieldColors[fieldColors.length-1]==='player'?' alert-blue':' alert'):fieldSum>=5?' warn':'')},fieldSum),
          h('span',{className:'sep'},'/ 10')
        ),
        h('div',{className:'ato'},'あと ',h('b',null,10-fieldSum))
      )
    ),

    // SPACER (field → hand)
    h('div',{className:'gp-spacer'}),

    // HAND area
    h('div',{className:'gp-hand-area hand-card-area'},
      h('div',{className:'gp-area-label'},'YOU — '+pH.filter(Boolean).length+'枚'),
      h('div',{className:'gp-hand-rows'},
        h('div',{className:'gp-hand-row'},
          pH.slice(0,5).map((v,i)=>v===null?h('div',{key:i,style:{width:'var(--card-w)',height:'calc(var(--card-w) * 1.4)',flexShrink:0}}):h(SlideCard,{key:i+'_'+v,value:v,onPlay:()=>playCard(i),disabled:countNum>=0||!canPlay(v,fieldSum,field),cardRole:'player'}))
        ),
        h('div',{className:'gp-hand-row'},
          pH.slice(5).map((v,i)=>v===null?h('div',{key:i+5,style:{width:'var(--card-w)',height:'calc(var(--card-w) * 1.4)',flexShrink:0}}):h(SlideCard,{key:(i+5)+'_'+v,value:v,onPlay:()=>playCard(i+5),disabled:countNum>=0||!canPlay(v,fieldSum,field),cardRole:'player'}))
        )
      )
    ),

    // SPACER (below hand)
    h('div',{className:'gp-spacer'})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
