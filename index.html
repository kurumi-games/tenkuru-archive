  // ── ストーリー進行 ──
  function goMap(){roundTokR.current++;clearTimers();exitLink();stopBGM();setShiftScene(null);shiftPendingR.current=false;sceneOnR.current=false;setScreenPop(false);stageR.current=null;stageOptsR.current=null;setStageCtx(null);setPhase('map');phaseR.current='map';}
  function startStage(arIdx,stIdx){
    const ar=STAGES.areas[arIdx],st=ar.stages[stIdx];
    if(!st||st.comingSoon){goMap();return;} // v54: 準備中は開始しない
    if(phaseR.current==='playing')return;      // v54: 二重開始防止
    stageR.current={ar:arIdx,st:stIdx};setStageCtx({ar:arIdx,st:stIdx});
    winPtR.current=st.winPt||WIN_PT;setWinPt(st.winPt||WIN_PT);
    const hook=RULE_HOOKS[st.rule];if(hook&&typeof hook.onStart==='function')hook.onStart(st); // ギミック差し込み口（未実装）
    // v56: ステージ固有オプション
    const firstChrono=ar.stages.find(x=>x.chrono);
    let chrono=false;
    if(CHRONO_CONFIG.enabled&&st.chrono){
      if(CHRONO_CONFIG.guaranteeFirstUnlock&&firstChrono&&st.no===firstChrono.no&&!saveR.current.chronoIntro){chrono=true;updSave(s=>{s.chronoIntro=true;return s;});}
      else chrono=Math.random()<CHRONO_CONFIG.appearRate;
    }
    stageOptsR.current={chrono,timeLimit:st.timeLimit||10,ability:st.ability||null,champion:st.champion||null,challenge:!!st.challenge,rivalName:st.rivalName||null,form2Name:st.form2Name||null,shiftPt:st.shiftPt||null,bgm:st.bgm||null};
    if(st.challenge&&typeof SHIFT_VIDEO!=='undefined'){try{[SHIFT_VIDEO.v1,SHIFT_VIDEO.v2].forEach(u=>fetch(u,{mode:'no-cors',cache:'force-cache'}).catch(()=>{}));}catch(e){}} // v78: 変身動画を先読み
    if(st.champion&&CHAMPIONS[st.champion]){setPendingDiff(st.diff);setPhase('champIntro');phaseR.current='champIntro';return;} // v61 登場画面を挟む
    if(st.tutorial&&!tutDoneR.current){openTutorial(st.diff);return;}
    startGame(st.diff);
  }
  function stageNext(){
    const c=stageR.current;if(!c){goMap();return;}
    const ar=STAGES.areas[c.ar];
    const nx=ar.stages[c.st+1];
    if(nx&&!nx.comingSoon&&!nx.challenge)startStage(c.ar,c.st+1);else goMap(); // v62: チャレンジへは自動で進まない
  }
  function startGame(diff){
    if(diff){setDifficulty(diff);diffRef.current=diff;}
    clearTimers();lockR.current=false;
    const p=createDeck(),d=createDeck();
    const opts=stageR.current?(stageOptsR.current||{}):{};
    chronoR.current={armed:!!opts.chrono,count:0,pending:false,deals:0};
    roundSecR.current=opts.timeLimit||10;
    coreShiftR.current={active:opts.ability==='coreShift',used:false};setCoreShiftUsed(false);
    form2R.current=false;setForm2(false);shiftPendingR.current=false;setShiftScene(null);sceneOnR.current=false;setScreenPop(false);setPtBurst(false);srPendingR.current=false;setFieldRing([]);setSrBanner(false); // v70/v75/v79
    dealPlayer(p);setDealer(d);exitLink();
    setPPt(0);setDPt(0);pPtR.current=0;dPtR.current=0;
    setRNum(1);setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;
    setFlashMsg(null);setBurstAnim(false);setResetFA(false);setGameEndData(null);
    if(trackNumR.current>0)startBGM(trackNumR.current,stageBgm());doCountdown(p,d,0,0,1);
  }

  function doCountdown(pHand,dHand,pp,dp,rn){
    // v70: 第2形態の演出が待機中なら、ここで一旦止めて演出→終わってから続行
    if(shiftPendingR.current){
      shiftPendingR.current=false;
      clearTimers();exitLink();stopChronoHum(); // クロノリンクの残りタイマー・効果音を確実に止める
      lockR.current=true;resolvingR.current=true;sceneOnR.current=true;
      setBgmVolume(0.12);
      const so=stageOptsR.current||{};
      setShiftScene({name:so.rivalName||'',form2Name:so.form2Name||'',args:[pHand,dHand,pp,dp,rn],tok:roundTokR.current});
      return;
    }
    roundTokR.current++;    // 古い遷移予約を全部無効化
    clearTimers();          // 残ってるカウントダウン/タイマーも掃除
    resolvingR.current=false;exitLink(); // v54: 時間停止の残骸を必ず解除
    setPhase('playing');phaseR.current='playing';
    setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;setFieldSp([]);
    setFieldColors([]); // v46: 時間切れ後に前ラウンドの色記録が残って自分のカードがオレンジになるバグ修正
    setFlashMsg(null);setTimeLeft(roundSecR.current);setComboShow(null);setTimeUpShow(false);setFieldShift([]);
    let c=5;setCountNum(c);countNumR.current=c;
    function tick(){
      setCountNum(c);countNumR.current=c;
      // カウント中は無音（GOだけ鳴らす）
      if(c===0){
        // GO！音（ワープSE）
        playGoSE();
        setTimeout(()=>{
          setCountNum(-1);countNumR.current=-1;
          aiFirstFastRef.current=Math.random()<0.90;
          startTimer(rn);
          lockR.current=false; // v40: 開始時のプレイヤーロック(50%で0.4秒)は撤廃
          scheduleAi(rn);
          if(rn===1)sayChamp('start'); // v61
          if(starRingActive())setTimeout(()=>attachStarRing(rn),400); // v80: 毎ラウンド開始直後に1枚へ星環
          if(srPendingR.current){srPendingR.current=false;setTimeout(()=>{if(phaseR.current==='playing'&&countNumR.current<0)starRingComplete(rn);},600);}
        },650);
        return;
      }
      c--;countRef.current=setTimeout(tick,650);
    }
    tick();
  }

  function startTimer(rn,from){
    clearInterval(timerRef.current);
    let t=(from==null)?roundSecR.current:from;setTimeLeft(t);timeLeftR.current=t;
    timerRef.current=setInterval(()=>{
      t--;setTimeLeft(t);timeLeftR.current=t;
      if(t<=0){clearInterval(timerRef.current);clearTimeout(aiRef.current);doTimeUp(rn);}
    },1000);
  }

  function doTimeUp(rn){
    clearTimers();lockR.current=true;resolvingR.current=true; // 時間切れ演出中はカードを出せない
    resumeAC();playMissSE();
    setTimeUpShow(true);
    const newP=createDeck(),newD=createDeck();
    dealPlayer(newP);
    { // v79: 時間切れでも環付きカードは残す
      const keep=dHR.current.filter((v,i)=>dRingR.current[i]),keepRf=keep.map(()=>true);
      const fill=newD.slice(0,10-keep.length);setDealer([...keep,...fill],[...keepRf,...fill.map(()=>false)]);
    }
    const tok=roundTokR.current;
    setTimeout(()=>{
      if(tok!==roundTokR.current)return; // 別の遷移が先に走ってたら中止
      setTimeUpShow(false);
      const pp=pPtR.current,dp=dPtR.current;
      if(pp>=winPtR.current||dp>=winPtR.current){endGame(pp,dp);return;}
      const nr=rn+1;setRNum(nr);doCountdown(newP,dHR.current,pp,dp,nr);
    },4000);
  }

  function scheduleAi(rn,delay=null){
    clearTimeout(aiRef.current);
    let d;
    if(delay!==null){d=delay;}
    else{
      const cf=fieldR.current,cs=fieldSumR.current,fl=cf.length;
      const canWin=dHR.current.some(v=>canPlay(v,cs,cf)&&cs+v===10);
      const diff=diffRef.current;
      // 10完成できる時も人間が反応できる程度の「間」を必ず空ける(v40)
      if(canWin)d=diff==='easy'?900+Math.random()*600:diff==='hard'?300+Math.random()*250:diff==='master'?250+Math.random()*200:450+Math.random()*350;
      else if(fl===0){if(diff==='easy')d=800+Math.random()*800;else if(diff==='hard')d=150+Math.random()*200;else if(diff==='master')d=120+Math.random()*180;else d=aiFirstFastRef.current?300+Math.random()*300:1200+Math.random()*800;}
      else if(fl===1)d=diff==='easy'?1000+Math.random()*600:diff==='hard'?400+Math.random()*200:diff==='master'?300+Math.random()*180:1000+Math.random()*400;
      else d=diff==='easy'?1200+Math.random()*800:diff==='hard'?600+Math.random()*300:diff==='master'?450+Math.random()*250:1500+Math.random()*500;
    }
    aiRef.current=setTimeout(()=>{if(phaseR.current==='playing'&&countNumR.current<0&&!linkR.current)aiPlay(rn);},d);
  }

  function aiPlay(rn){
    // 場が完成した直後にAIの出す動作が間に合ってしまった場合 → カード返却（出さない）
    // ※lockRは見ない：あれはラウンド開始時のプレイヤー用ハンデロックと共用のため
    if(resolvingR.current||linkR.current||sceneOnR.current)return; // v54: 時間停止中は出さない / v75: 演出中も出さない
    const dHand=dHR.current,cf=fieldR.current,cs=fieldSumR.current;
    if(!dHand.length)return;
    const rf=dRingR.current;const avail=dHand.filter((v,i)=>!rf[i]); // v79: 星環付きは温存
    const playable=avail.filter(v=>canPlay(v,cs,cf));
    if(!playable.length){scheduleAi(rn);return;}
    const wins=playable.filter(v=>cs+v===10);
    const safe=playable.filter(v=>cs+v<10);
    const diff=diffRef.current;
    const winRate  =diff==='easy'?0.60:diff==='hard'?0.97:diff==='master'?1.0:0.85;
    const safeRate5=diff==='easy'?0.25:diff==='hard'?0.60:diff==='master'?0.75:0.35;
    const safeBase =diff==='easy'?0.35:diff==='hard'?0.70:diff==='master'?0.80:0.40;
    const safeCap  =diff==='easy'?0.50:diff==='hard'?0.90:diff==='master'?0.95:0.65;
    const firstRate=diff==='easy'?0.45:diff==='hard'?0.80:diff==='master'?0.90:0.55;
    let chosen=null;
    if(wins.length&&Math.random()<winRate)chosen=wins.reduce((b,v)=>calcPts([...cf,v]).total>calcPts([...cf,b]).total?v:b,wins[0]);
    else if(diff==='master'&&safe.length&&dHand.includes(1)&&cs<9&&safe.includes(9-cs)&&Math.random()<0.65){
      // MASTERの妨害プレイ：手札に1がある時、場を合計9にして「1でしか完成できない場」の罠を張り、自分の1で刈り取る
      chosen=9-cs;
    }
    else if(cs>=8){if((diff==='hard'&&Math.random()<0.15||diff==='master'&&Math.random()<0.25)&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else if(cs>=5){if(Math.random()<safeRate5&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else if(cs>=1){if(Math.random()<Math.min(safeBase+cf.length*0.08,safeCap)&&safe.length)chosen=safe[Math.floor(Math.random()*safe.length)];}
    else{if(Math.random()<firstRate&&safe.length)chosen=safe.sort((a,b)=>a-b)[0];}
    if(!chosen){scheduleAi(rn);return;}
    resumeAC();setTimeout(()=>playPlaceSE(false),100);
    const idx=dHand.findIndex((v,i)=>v===chosen&&!rf[i]);
    const newDH=dHand.filter((_,i)=>i!==idx),newRf=rf.filter((_,i)=>i!==idx);
    setDealer(newDH,newRf);
    if(!newDH.filter((v,i)=>!newRf[i]).length){ // 環付きだけ残った → 環付きを残して10枚まで補充 → 新しい環
      const keep=newDH,keepRf=newRf;const nd=createDeck().slice(0,10-keep.length);
      setDealer([...keep,...nd],[...keepRf,...nd.map(()=>false)]); // 新しい環は次ラウンド開始時
    }
    if(!resolvePlay(chosen,cf,cs,'dealer',rn))scheduleAi(rn);
  }

  function playCard(idx){
    if(phaseR.current!=='playing'||countNumR.current>=0||sceneOnR.current)return; // v75: 変身演出中は操作不可
    if(lockR.current){
      // 場が完成した直後に滑り込んだカード → バーストさせず手札に返却
      if(resolvingR.current&&!bounceMsgR.current){
        bounceMsgR.current=true;
        fxRejectStamp();
        setTimeout(()=>{bounceMsgR.current=false;},900);
      }
      return;
    }
    // 判定はstateでなくrefを使う（同時タイミングで相手の直前プレイが消えるのを防ぐ）
    const cf=fieldR.current,cs=fieldSumR.current;
    let value=pH[idx];
    if(!value||!canPlay(value,cs,cf))return;
    const isSp=!!pSpR.current[idx];
    const wasLink=linkR.current;   // 時間停止中の「追加の1枚」か
    clearTimeout(aiRef.current);resumeAC();
    if(isSp){playChronoTapSE();chronoR.current.pending=false;}
    setTimeout(()=>playPlaceSE(true),100);
    const newPH=pH.map((v,i)=>i===idx?null:v);
    const newSp=pSpR.current.map((f,i)=>i===idx?false:f);
    setPH(newPH);pHR.current=newPH;setPSp(newSp);pSpR.current=newSp;
    const emptied=!newPH.filter(Boolean).length;
    if(emptied){const nd=createDeck();setTimeout(()=>{dealPlayer(nd);},100);}
    // v56 チャンピオン能力「コア・シフト」：最初に置いた4が3に変わる（得点確定より先）
    let shifted=false;
    // ※変化後の3でも既存ルール(canPlay)が通る時だけ。4枚目で10未満、3枚目で5未満になる場合は発動せず、4のまま置く
    if(coreShiftR.current.active&&!coreShiftR.current.used&&value===4&&canPlay(3,cs,cf)){
      coreShiftR.current.used=true;setCoreShiftUsed(true);shifted=true;value=3;
      playCoreShiftSE();sayChamp('coreShift');setFlashMsg({text:'CORE SHIFT　4 → 3',who:'dealer'});setTimeout(()=>setFlashMsg(m=>m&&m.text.startsWith('CORE SHIFT')?null:m),1300);
    }
    if(wasLink){playChronoReleaseSE();}
    const ended=resolvePlay(value,cf,cs,'player',rNum,isSp,shifted);
    if(ended){exitLink();return;} // 10完成/バースト/4枚 → 既存の終了処理が優先
    const nf=fieldR.current,ns=fieldSumR.current;
    if(wasLink){
      // 追加の1枚を置いた → 時間停止を解除して再開（AIは1回だけ予約）
      exitLink();
      startTimer(rNum,timeLeftR.current);
      clearTimeout(aiRef.current);scheduleAi(rNum);
      return;
    }
    if(isSp&&CHRONO_CONFIG.enabled&&!emptied&&newPH.some(v=>v&&canPlay(v,ns,nf))){
      // CHRONO LINK：ラウンド継続かつ追加で出せるカードがある時だけ時間停止
      clearInterval(timerRef.current);clearTimeout(aiRef.current);
      enterLink();
      return;
    }
    clearTimeout(aiRef.current);scheduleAi(rNum);
  }

  function resolvePlay(value,curField,curSum,who,rn,isSp,shifted){
    const nf=[...curField,value],ns=curSum+value;
    setField(nf);setFieldSum(ns);fieldR.current=nf;fieldSumR.current=ns;
    setFieldColors(prev=>[...prev,who]);
    setFieldSp(prev=>[...prev,!!isSp]);
    setFieldShift(prev=>[...prev,!!shifted]);
    if(ns>10){
      clearTimers();lockR.current=true;resolvingR.current=true;playBurstSE();setBurstAnim(true);
      const newPP=who==='player'?Math.max(0,pPtR.current-2):pPtR.current;
      const newDP=who==='dealer'?Math.max(0,dPtR.current-2):dPtR.current;
      setPPt(newPP);setDPt(newDP);pPtR.current=newPP;dPtR.current=newDP;
      setComboShow({text:'BURST',pts:-2,color:'#ff3b3b',who,burst:true,opp:stageOptsR.current&&((form2R.current&&stageOptsR.current.form2Name)||stageOptsR.current.rivalName)||undefined});sayChamp(who==='player'?'burstYou':'burstSelf');
      setTimeout(()=>setComboShow(null),4000);
      const tokB=roundTokR.current;
      setTimeout(()=>{if(tokB!==roundTokR.current)return;setBurstAnim(false);resetField();if(newPP>=winPtR.current||newDP>=winPtR.current){endGame(newPP,newDP);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,newPP,newDP,nr);},4000);
      return true;
    }
    if(ns===10){completeTen(nf,who,rn);return true;}
    if(nf.length>=4){
      clearTimers();lockR.current=true;resolvingR.current=true;setResetFA(true);
      setFlashMsg({text:'4枚！強制リセット',color:DIM});
      const tokF=roundTokR.current;
      setTimeout(()=>{if(tokF!==roundTokR.current)return;setResetFA(false);resetField();const pp=pPtR.current,dp=dPtR.current;if(pp>=winPtR.current||dp>=winPtR.current){endGame(pp,dp);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,pp,dp,nr);},900);
      return true;
    }
    return false;
  }

  // 10完成の得点処理（プレイヤー／相手／星環 共通）
  function completeTen(nf,who,rn){
      clearTimers();lockR.current=true;resolvingR.current=true;
      const pts=calcPts(nf);
      const prevPPv=pPtR.current;
      const newPP=who==='player'?pPtR.current+pts.total:pPtR.current;
      const newDP=who==='dealer'?dPtR.current+pts.total:dPtR.current;
      setPPt(newPP);setDPt(newDP);pPtR.current=newPP;dPtR.current=newDP;
      // v75: 変身トリガー = 直前<shiftPt かつ 今回>=shiftPt（15→17でも発動）。1試合1回。勝利点に達した時は変身より決着を優先
      let shiftNow=false;
      { const so=stageOptsR.current,prevPP=prevPPv; if(who==='player'&&so&&so.shiftPt&&!form2R.current&&prevPP<so.shiftPt&&newPP>=so.shiftPt&&newPP<winPtR.current){shiftPendingR.current=true;shiftNow=true;setPtBurst(true);setTimeout(()=>setPtBurst(false),900);} }
      playComboSfx(pts.voice||'役なし');
      setResetFA(true);
      const color=who==='player'?'#2e7fe8':'#f5912a';
      setComboShow({text:pts.voice||'10達成！',pts:pts.total,color,who,opp:stageOptsR.current&&((form2R.current&&stageOptsR.current.form2Name)||stageOptsR.current.rivalName)||undefined});sayChamp(who==='player'?'scoreYou':'scoreSelf');
      const waitMs=shiftNow?1400:4000; // v75: 変身する得点の時だけ短く
      setTimeout(()=>setComboShow(null),waitMs);
      const tokS=roundTokR.current;
      setTimeout(()=>{if(tokS!==roundTokR.current)return;setResetFA(false);resetField();if(newPP>=winPtR.current||newDP>=winPtR.current){endGame(newPP,newDP);return;}const nr=rn+1;setRNum(nr);doCountdown(pHR.current,dHR.current,newPP,newDP,nr);},waitMs);
        }
  function resetField(){setField([]);setFieldSum(0);fieldR.current=[];fieldSumR.current=0;setFieldColors([]);setFieldSp([]);setFieldShift([]);setFieldRing([]);}
  function endGame(pp,dp){
    roundTokR.current++;stopBGM();
    let stars=0;
    const c=stageR.current;
    if(c){const st=STAGES.areas[c.ar].stages[c.st];stars=calcStars(pp,dp,winPtR.current);if(stars>0)updSave(s=>{s.stars[st.no]=Math.max(s.stars[st.no]||0,stars);return s;});}
    setGameEndData({pPt:pp,dPt:dp,winner:pp>=winPtR.current?'player':'dealer',diff:diffRef.current,stars,rivalName:stageOptsR.current&&((form2R.current&&stageOptsR.current.form2Name)||stageOptsR.current.rivalName)||null});
    setPhase('gameEnd');phaseR.current='gameEnd';exitLink();
  }
  function goHome(){if(stageR.current){goMap();return;}roundTokR.current++;clearTimers();exitLink();stopBGM();setPhase('menu');}

  const curStage=stageCtx?STAGES.areas[stageCtx.ar].stages[stageCtx.st]:null;
  if(phase==='menu')return h(TitleScreen,{onPlay:()=>{setPhase('map');phaseR.current='map';},onTutorial:()=>openTutorial(null),musicOn:musicEnabled,toggleMusic});
  if(phase==='champIntro'&&curStage&&curStage.champion)return h(ChampionIntroScreen,{champ:CHAMPIONS[curStage.champion],stage:curStage,onStart:()=>startGame(pendingDiff)});
  if(phase==='map')return h(MapScreen,{area:STAGES.areas[0],save,onSelect:i=>startStage(0,i),onBack:()=>{setPhase('menu');phaseR.current='menu';}});
  if(phase==='tutorial')return h(TutorialScreen,{pendingDiff,onFinish:finishTutorial,onExit:()=>finishTutorial(pendingDiff),trackNum,toggleMusic,coachName:null,startLabel:curStage?'ステージ '+curStage.no+' をはじめる':null,bg:null,winPt:curStage?curStage.winPt:null});
  if(phase==='gameEnd'&&gameEndData){
    if(stageCtx)return h(StageEndScreen,{data:gameEndData,stage:curStage,stars:gameEndData.stars||0,onNext:stageNext,onRetry:()=>startStage(stageCtx.ar,stageCtx.st),onMap:goMap,isLast:(()=>{const nx=STAGES.areas[stageCtx.ar].stages[stageCtx.st+1];return !nx||!!nx.comingSoon||!!nx.challenge;})()});
    return h(GameEndScreen,{data:gameEndData,onRestart:startGame,onHome:goHome});
  }

  const so=stageOptsR.current||{};
  const rival=(form2&&so.form2Name)||so.rivalName||'DEALER';
  // v62: 第7は「ルナ」／v70: 第2形態は「レイピア」
  return h('div',{className:'gp-screen'+(so.challenge?' ch7':'')+(screenPop?' form2-pop':'')},
    h(ChampionLayer,{champ:stageOptsR.current&&stageOptsR.current.champion?CHAMPIONS[stageOptsR.current.champion]:null}), // v61 チャンピオン戦は立ち絵
    so.challenge&&h('div',{className:'champ-layer'},
      form2
        ?h('div',{key:'f2',className:'boss-img form2 pd'},h('div',{className:'pd-box'},h('div',{className:'pd-wingL'}),h('div',{className:'pd-wingR'}),h('div',{className:'pd-rings'}),h('div',{className:'pd-body'}),h('div',{className:'pd-lids'}))) // v76: パーツ分けレイピア
        :h('div',{key:'f1',className:'boss-img'}), // v75: ルナ上半身
      form2&&RING_ORDER.map((k,i)=>h('div',{key:'rd'+k,className:'ring-dormant',style:{left:'calc(50% + '+[-112,68,-112,68][i]+' * var(--u))',top:'calc('+[88,88,168,168][i]+' * var(--u))',backgroundImage:'url('+REIPIA_RINGS[k].image+')'}})) // 休眠中の星環（能力は未実装）
    ),
    shiftScene&&h(ShiftScene,{key:'shift',name:shiftScene.name,form2Name:shiftScene.form2Name,
      onForm2:()=>{if(shiftScene.tok===roundTokR.current){form2R.current=true;setForm2(true);setDealer(dHR.current);}}, // v79: 第2形態では星環なし
      onLeave:()=>{if(shiftScene.tok===roundTokR.current){setScreenPop(true);setTimeout(()=>setScreenPop(false),700);setBgmVolume(0.45);}},
      onDone:()=>{
        const sc=shiftScene;setShiftScene(null);sceneOnR.current=false;
        if(sc.tok!==roundTokR.current)return; // 演出中にホームへ戻った等
        form2R.current=true;setForm2(true);setBgmVolume(0.45);
        doCountdown(...sc.args); // 次ラウンドはここで1回だけ
      }}),
    champLine&&stageOptsR.current&&stageOptsR.current.champion&&h('div',{key:'cl'+champLine.id,className:'champ-bubble'},champLine.text), // 吹き出し（最前面）
    // v56 クロノリンク演出（すべて pointer-events:none）
    chronoFx==='in'&&h('div',{key:'chv'+rNum,className:'chrono-veil'}),
    chronoFx==='out'&&h('div',{className:'chrono-veil out'}),
    chronoFx==='in'&&h('div',{className:'chrono-burst',style:{left:burstPos.x,top:burstPos.y}}),
    chronoFx==='in'&&h('div',{className:'chrono-ring',style:{left:burstPos.x,top:burstPos.y}}),
    chronoFx==='in'&&h('div',{className:'chrono-ring r2',style:{left:burstPos.x,top:burstPos.y}}),
    chronoFx==='in'&&h('div',{className:'chrono-title',style:{top:burstPos.y}},CHRONO_TEXT.en),
    chronoFx==='out'&&h('div',{className:'chrono-flash'}),
    linkMode&&h('div',{className:'link-banner'},h('b',null,CHRONO_TEXT.en),CHRONO_TEXT.hint),
    comboShow&&h(CyberComboDisplay,{key:'c_'+comboShow.text+Date.now(),combo:comboShow}),
    timeUpShow&&h(TimeUpDisplay,{key:'tu_'+Date.now(),show:true}),
    countNum>=0&&h('div',{style:{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',background:'#2a103066',pointerEvents:'none'}},
      h('div',{key:countNum,style:{fontSize:countNum===0?96:120,fontWeight:900,color:countNum===0?'#50e080':'#fff',animation:'countDown 0.65s ease both',textShadow:countNum===0?'0 0 60px #50e080':'0 0 30px #fff'}},countNum===0?'GO!!':countNum)
    ),
    flashMsg&&h('div',{style:{position:'fixed',inset:0,zIndex:150,display:'flex',alignItems:comboShow?'flex-start':'center',justifyContent:'center',paddingTop:comboShow?'clamp(90px,20vh,140px)':'0',pointerEvents:'none'}},
      h('div',{style:{background:flashMsg.who==='player'?'#00203088':'#3a001088',backdropFilter:'blur(8px)',borderRadius:14,padding:'14px 26px',fontSize:18,fontWeight:900,color:flashMsg.who==='player'?'#00d4ff':'#ff2d6e',boxShadow:'0 4px 32px '+(flashMsg.who==='player'?'#00d4ff55':'#ff2d6e55'),border:'2px solid '+(flashMsg.who==='player'?'#00d4ff':'#ff2d6e'),animation:'slideIn 0.2s ease',maxWidth:'88vw',textAlign:'center'}},flashMsg.text)
    ),

    // TOP BAR
    h('div',{className:'gp-top-bar'},
      h('div',{className:'gp-time-box'+(timeLeft<=5?' urgent':'')+(linkMode?' frozen':'')},
        h('div',{className:'lbl'},'TIME'),
        h('div',{className:'val'},timeLeft)
      ),
      h('div',{className:'gp-score you'+(ptBurst?' pt-burst':'')},
        h('div',{className:'lbl'},'YOU'),
        h('div',{className:'val'},pPt),
        h('div',{className:'sub'},'あと ',h('b',null,Math.max(0,winPt-pPt)),'pt')
      ),
      h('div',{className:'gp-round-pill '+difficulty},
        h('span',{className:'r'},'R'+rNum),
        h('span',{className:'lvl'},curStage?(curStage.boss?'BOSS':'ST '+curStage.no):(difficulty==='easy'?'EASY':difficulty==='hard'?'HARD':difficulty==='master'?'MASTER':'NORMAL'))
      ),
      h('div',{className:'gp-score dealer'},
        h('div',{className:'lbl'},rival),
        h('div',{className:'val'},dPt),
        h('div',{className:'sub'},'あと ',h('b',null,Math.max(0,winPt-dPt)),'pt')
      ),
      h('div',{className:'gp-icon-btn',onClick:goHome,title:'ホームに戻る'},h('span',null,'⌂')),
      h('div',{className:'gp-track-btn',onClick:toggleMusic,title:'曲を変更（1→2→ミュート）'},
        h('span',{className:'num'},trackNum===0?'OFF':String(trackNum).padStart(2,'0'))
      )
    ),

    // v56 チャンピオン能力の表示（使用後は暗くなる）
    coreShiftR.current.active&&h('div',{className:'ability-pill'+(coreShiftUsed?' used':'')},h('span',{className:'en'},'CORE SHIFT'),h('span',null,coreShiftUsed?'使用済み':'最初に置く 4 → 3')),

    // DEALER 手札
    h('div',{className:'gp-dealer-area'},
      h('div',{className:'gp-area-label'},(so.rivalName?'✦ ':'💀 ')+rival+' — '+dH.length+'枚'),
      h('div',{className:'gp-dealer-cards'},
        dH.slice(0,12).map((_,i)=>h('div',{key:i,className:'gp-dealer-card'+(dRing[i]?' ringed':'')},dRing[i]&&h('div',{className:'star-ring'})))
      )
    ),
    srBanner&&h('div',{className:'sr-banner'},h('b',null,'STAR RING'),'星環 ── 完成'),

    // SPACER (dealer → field)
    h('div',{className:'gp-spacer'}),

    // FIELD area
    h('div',{
      ref:fieldAreaRef,
      className:'gp-field-area field-card-area'+((fieldSum>=8&&fieldSum<10)?(fieldColors[fieldColors.length-1]==='player'?' alert-blue':' alert'):fieldSum>=5?' warn':''),
      style:{animation:resetFA?'resetAnim 0.5s ease':burstAnim?'burst 0.5s ease':'none'}
    },
      h('div',{className:'field-planet'}),
      h('div',{className:'gp-field-cards'},
        field.map((v,i)=>h(FieldCard,{key:i,value:v,by:fieldColors[i],isComplete:fieldSum===10&&i===field.length-1,isSpecial:!!fieldSp[i],shifted:!!fieldShift[i],ringed:!!fieldRing[i]}))
      ),
      // FIELD SUM（場のカードの下・前の配置に戻す＋少し強化）
      h('div',{className:'gp-field-sum gp-field-sum-strong',style:{visibility:fieldSum>0?'visible':'hidden'}},
        h('div',{className:'main'},
          h('span',{className:'num'+((fieldSum>=8&&fieldSum<10)?(fieldColors[fieldColors.length-1]==='player'?' alert-blue':' alert'):fieldSum>=5?' warn':'')},fieldSum),
          h('span',{className:'sep'},'/ 10')
        ),
        h('div',{className:'ato'},'あと ',h('b',null,10-fieldSum))
      )
    ),

    // SPACER (field → hand)
    h('div',{className:'gp-spacer'}),

    // HAND area
    h('div',{className:'gp-hand-area hand-card-area'},
      h('div',{className:'gp-area-label'},'YOU — '+pH.filter(Boolean).length+'枚'),
      h('div',{className:'gp-hand-rows'},
        h('div',{className:'gp-hand-row'},
          pH.slice(0,5).map((v,i)=>v===null?h('div',{key:i,style:{width:'var(--card-w)',height:'calc(var(--card-w) * 1.4)',flexShrink:0}}):h(SlideCard,{key:i+'_'+v,value:v,onPlay:()=>playCard(i),disabled:countNum>=0||!canPlay(v,fieldSum,field),cardState:countNum>=0?null:handCardState(v,fieldSum,field),onLocked:()=>fxLockHint(lockReason(v,fieldSum,field)),cardRole:'player',isSpecial:!!pSp[i],linkPick:linkMode&&canPlay(v,fieldSum,field)}))
        ),
        h('div',{className:'gp-hand-row'},
          pH.slice(5).map((v,i)=>v===null?h('div',{key:i+5,style:{width:'var(--card-w)',height:'calc(var(--card-w) * 1.4)',flexShrink:0}}):h(SlideCard,{key:(i+5)+'_'+v,value:v,onPlay:()=>playCard(i+5),disabled:countNum>=0||!canPlay(v,fieldSum,field),cardState:countNum>=0?null:handCardState(v,fieldSum,field),onLocked:()=>fxLockHint(lockReason(v,fieldSum,field)),cardRole:'player',isSpecial:!!pSp[i+5],linkPick:linkMode&&canPlay(v,fieldSum,field)}))
        )
      )
    ),

    // SPACER (below hand)
    h('div',{className:'gp-spacer'})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
